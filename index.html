<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار الطيران - النسخة المستعادة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b141a; color: white; text-align: center; margin: 0; padding: 10px; overflow-x: hidden; }
        .card { background: #1c262d; padding: 20px; border-radius: 20px; max-width: 400px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #2d333b; }
        #multiplier { font-size: 65px; font-weight: 900; color: #00ff88; margin: 20px 0; display: none; height: 80px; align-items: center; justify-content: center; text-shadow: 0 0 20px rgba(0,255,136,0.3); }
        #countdown-box { margin: 20px 0; display: block; }
        #timer-num { font-size: 60px; color: #ffcc00; font-weight: bold; }
        .sky-area { background: linear-gradient(to top, #1e3a8a, #3b82f6); height: 160px; border-radius: 15px; position: relative; overflow: hidden; margin-bottom: 15px; border: 2px solid #12191f; }
        .plane { font-size: 50px; position: absolute; left: 10%; bottom: 20px; transition: transform 0.1s linear; z-index: 10; }
        .controls { background: #12191f; padding: 15px; border-radius: 15px; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: none; background: #1c262d; color: white; text-align: center; font-size: 22px; margin-bottom: 10px; outline: none; border: 1px solid #2d333b; }
        button { width: 100%; padding: 18px; border-radius: 12px; border: none; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-bet { background: #238636; color: white; box-shadow: 0 4px 15px rgba(35,134,54,0.4); }
        .btn-cashout { background: #f85149; color: white; box-shadow: 0 4px 15px rgba(248,81,73,0.4); }
        .btn-success { background: #2d333b; color: #3fb950; cursor: default; }
        .history { display: flex; justify-content: center; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
        .hist-tag { padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; background: #2d333b; border: 1px solid #3e444d; }
        .red { color: #f85149; } .green { color: #3fb950; }
        .gold-border { border: 1px solid #ffcc00 !important; box-shadow: 0 0 10px rgba(255,204,0,0.2); }
    </style>
</head>
<body>

<div id="login-ui" class="card">
    <h2 style="margin-bottom: 20px;">تسجيل الدخول</h2>
    <input type="text" id="u" placeholder="اسم المستخدم (مثل eya)">
    <input type="password" id="p" placeholder="كلمة السر">
    <button id="l-btn" onclick="login()" class="btn-bet">دخول</button>
</div>

<div id="game-ui" style="display:none;" class="card">
    <div style="display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center;">
        <span id="user-name" style="color:#8b949e; font-weight: bold; font-size: 18px;"></span>
        <span style="color:#e3b341; font-size: 20px; font-weight: bold;">💰 <span id="user-balance">0</span></span>
    </div>

    <div id="multiplier">1.00x</div>
    <div id="countdown-box">
        <div style="color: #8b949e; font-size: 16px; margin-bottom: 5px;">الرحلة القادمة في</div>
        <div id="timer-num">5</div>
    </div>

    <div class="sky-area">
        <div id="plane-img" class="plane">✈️</div>
    </div>

    <div class="controls">
        <div id="bet-input-area">
            <input type="number" id="bet-amount" value="10" min="1">
        </div>
        <button id="main-btn" onclick="handleButtonClick()" class="btn-bet">تجهيز الرهان</button>
    </div>

    <div id="history-list" class="history"></div>
</div>

<script>
    const S_URL = 'https://uqmfwgdrlcqywxvdljlb.supabase.co';
    const S_KEY = 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT';
    const _supabase = supabase.createClient(S_URL, S_KEY);

    const s_tick = new Audio('https://www.soundjay.com/buttons/sounds/button-50.mp3');
    const s_music = new Audio('https://www.soundjay.com/transportation/sounds/jet-passing-by-01.mp3'); 
    const s_crash = new Audio('https://www.soundjay.com/mechanical/sounds/explosion-02.mp3');
    const s_win = new Audio('https://www.soundjay.com/buttons/sounds/button-37.mp3');

    let currentBalance, username, gameInterval, countdownInterval;
    let currentMultiplier = 1.0, crashPoint = 0, betPlaced = false, cashedOut = false, currentBet = 0;

    function unlockAudio() {
        [s_tick, s_music, s_crash, s_win].forEach(s => {
            s.play().then(() => { s.pause(); s.currentTime = 0; }).catch(() => {});
        });
    }

    async function login() {
        const btn = document.getElementById('l-btn');
        btn.innerText = "جاري التحقق...";
        btn.disabled = true;
        
        const u = document.getElementById('u').value.trim();
        const p = document.getElementById('p').value.trim();

        try {
            const { data, error } = await _supabase.from('Profiles').select('*').eq('username', u).eq('password', p).single();
            if (data) {
                username = data.username; currentBalance = data.balance;
                document.getElementById('login-ui').style.display = 'none';
                document.getElementById('game-ui').style.display = 'block';
                updateDisplay();
                unlockAudio();
                startNewRound();
            } else {
                alert("بيانات الدخول غير صحيحة");
                btn.innerText = "دخول"; btn.disabled = false;
            }
        } catch (e) {
            alert("خطأ في الاتصال بالخادم");
            btn.innerText = "دخول"; btn.disabled = false;
        }
    }

    function updateDisplay() {
        document.getElementById('user-name').innerText = username;
        document.getElementById('user-balance').innerText = Math.floor(currentBalance);
    }

    function startNewRound() {
        clearInterval(gameInterval); clearInterval(countdownInterval);
        betPlaced = false; cashedOut = false; currentMultiplier = 1.0;
        
        document.getElementById('multiplier').style.display = 'none';
        document.getElementById('multiplier').style.color = "#00ff88";
        document.getElementById('countdown-box').style.display = 'block';
        document.getElementById('bet-input-area').style.display = 'block';
        
        const btn = document.getElementById('main-btn');
        btn.className = 'btn-bet';
        btn.innerText = "تجهيز الرهان";
        btn.disabled = false;
        
        document.getElementById('plane-img').style.transform = "translate(0,0)";

        let timeLeft = 5;
        document.getElementById('timer-num').innerText = timeLeft;
        countdownInterval = setInterval(() => {
            timeLeft--;
            if(timeLeft >= 1) s_tick.play().catch(()=>{});
            document.getElementById('timer-num').innerText = timeLeft;
            if (timeLeft <= 0) { clearInterval(countdownInterval); launchPlane(); }
        }, 1000);
    }

    function handleButtonClick() {
        if (document.getElementById('main-btn').innerText === "تجهيز الرهان") placeBet();
        else if (document.getElementById('main-btn').className.includes('btn-cashout')) cashOut();
    }

    function placeBet() {
        let amt = parseFloat(document.getElementById('bet-amount').value);
        if (amt > currentBalance || amt <= 0) return alert("الرصيد غير كافٍ");
        currentBet = amt; betPlaced = true;
        const btn = document.getElementById('main-btn');
        btn.innerText = "انتظار الإقلاع..";
        btn.disabled = true;
    }

    function launchPlane() {
        document.getElementById('countdown-box').style.display = 'none';
        document.getElementById('multiplier').style.display = 'flex';
        s_music.currentTime = 0; s_music.loop = true; s_music.play().catch(() => {});

        const btn = document.getElementById('main-btn');
        if (betPlaced) {
            currentBalance -= currentBet; updateDisplay();
            document.getElementById('bet-input-area').style.display = 'none';
            btn.className = 'btn-cashout';
            btn.disabled = false;
        } else {
            btn.innerText = "بدأت الرحلة.."; btn.disabled = true;
        }

        // الاحتمالات الموزونة
        let chance = Math.random() * 100;
        if (chance <= 70) crashPoint = (Math.random() * 2.9 + 1.1);
        else if (chance <= 90) crashPoint = (Math.random() * 6 + 4);
        else if (chance <= 99.8) crashPoint = (Math.random() * 90 + 10);
        else crashPoint = (Math.random() * 600 + 100); // فرصة الـ 700x

        gameInterval = setInterval(() => {
            let inc = (currentMultiplier < 5) ? 0.02 : (currentMultiplier < 25 ? 0.3 : 2.5);
            currentMultiplier = parseFloat((currentMultiplier + inc).toFixed(2));
            
            document.getElementById('multiplier').innerText = currentMultiplier + "x";
            if (betPlaced && !cashedOut) {
                btn.innerHTML = `اسحب <span style="color:#ffcc00">${(currentBet * currentMultiplier).toFixed(2)}</span> 💰`;
            }

            let drift = Math.min(currentMultiplier * 2.5, 75);
            let lift = Math.min(currentMultiplier * 6, 95);
            document.getElementById('plane-img').style.transform = `translate(${drift}px, -${lift}px)`;

            if (currentMultiplier >= crashPoint) triggerCrash();
        }, 100);
    }

    async function cashOut() {
        if (!betPlaced || cashedOut) return;
        cashedOut = true; s_win.play().catch(()=>{});
        let win = currentBet * currentMultiplier;
        currentBalance += win; updateDisplay();
        
        const btn = document.getElementById('main-btn');
        btn.className = 'btn-success';
        btn.innerHTML = `تم السحب ✅ +${win.toFixed(2)}`;
        btn.disabled = true;

        await _supabase.from('Profiles').update({ balance: Math.floor(currentBalance) }).eq('username', username);
    }

    function triggerCrash() {
        clearInterval(gameInterval); s_music.pause(); s_crash.play().catch(()=>{}); 
        document.getElementById('multiplier').innerText = "💥 " + currentMultiplier + "x";
        document.getElementById('multiplier').style.color = "#f85149";
        
        if (!cashedOut) {
            document.getElementById('main-btn').className = 'btn-bet';
            document.getElementById('main-btn').innerText = "انفجرت!";
            document.getElementById('main-btn').disabled = true;
        }
        
        addHistory(currentMultiplier);
        if (betPlaced && !cashedOut) {
            _supabase.from('Profiles').update({ balance: Math.floor(currentBalance) }).eq('username', username).then();
        }
        setTimeout(startNewRound, 3000);
    }

    function addHistory(val) {
        const list = document.getElementById('history-list');
        const item = document.createElement('div');
        item.className = `hist-tag ${val >= 2 ? 'green' : 'red'} ${val >= 10 ? 'gold-border' : ''}`;
        item.innerText = val + "x";
        list.prepend(item);
        if (list.children.length > 6) list.lastChild.remove();
    }
</script>
</body>
</html>
