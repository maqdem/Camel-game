<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Ahoul Ultra - سباق الهجن المطوّر</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2ecc71; --danger: #e74c3c; --dark-blue: #0f172a; --panel: #1e293b; --gold: #fbbf24; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--dark-blue); color: white; margin: 0; padding: 10px; }
        .app-container { max-width: 480px; margin: auto; background: var(--panel); border-radius: 24px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.7); border: 1px solid #334155; }
        
        /* شاشة السباق */
        .viewport { 
            height: 260px; background: linear-gradient(180deg, #020617 0%, #1e293b 100%); 
            position: relative; overflow: hidden; border-bottom: 6px solid #855b2b;
        }
        .moon { position: absolute; top: 25px; right: 45px; font-size: 35px; filter: drop-shadow(0 0 15px #fff); opacity: 0.8; }
        #mult-display { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); font-size: 60px; font-weight: 900; color: var(--primary); text-shadow: 0 0 30px rgba(46,204,113,0.5); z-index: 100; pointer-events: none; }

        /* الجمل SVG المطور */
        .camel-stage { position: absolute; left: 10%; bottom: 15px; width: 120px; transition: left 0.1s linear; transform: scaleX(-1); }
        .running .leg-f { animation: run-f 0.25s infinite alternate; transform-origin: top; }
        .running .leg-b { animation: run-b 0.25s infinite alternate; transform-origin: top; }
        .running .hump { animation: bounce 0.4s infinite alternate; }
        @keyframes run-f { from { transform: rotate(-30deg); } to { transform: rotate(30deg); } }
        @keyframes run-b { from { transform: rotate(30deg); } to { transform: rotate(-30deg); } }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }

        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
