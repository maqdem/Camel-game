<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن - النسخة المصلحة</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-y: auto; padding: 20px 0; }
        .app-container { width: 95%; max-width: 420px; background: var(--card); padding: 20px; border-radius: 24px; border: 1px solid #2d333b; text-align: center; position: relative; }
        
        #alert-toast { position: absolute; top: -60px; left: 50%; transform: translateX(-50%); background: var(--error); color: white; padding: 10px 20px; border-radius: 12px; font-weight: bold; font-size: 14px; transition: top 0.4s ease; z-index: 1000; width: 80%; box-shadow: 0 4px 15px rgba(255, 75, 75, 0.3); }
        #alert-toast.show { top: 20px; }

        #main-timer { font-size: 80px; font-weight: 900; color: var(--gold); margin: 20px 0; }
        .multiplier { font-size: 65px; font-weight: 900; color: var(--accent); margin: 15px 0; display: none; }
        
        .track { height: 120px; background: #12191f; border-radius: 18px; position: relative; border: 2px solid #2d333b; margin: 15px 0; overflow: hidden; }
        .camel { position: absolute; bottom: 10px; left: 0; font-size: 50px; transition: left 0.1s linear; z-index: 2; filter: drop-shadow(0 0 5px rgba(0,0,0,0.5)); }
        
        .controls { background: #0d1117; padding: 15px; border-radius: 18px; margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin: 8px 0; }
        .input-field { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #1c262d; color: white; text-align: center; font-size: 16px; box-sizing: border-box; }
        
        .toggle-box { display: flex; justify-content: space-between; align-items: center; background: #1c262d; padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #2d333b; font-size: 14px; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(22px); }

        button { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cancel { background: #444; color: white; }
        .btn-cashout { background: var(--error); color: white; }
        .btn-waiting { background: #222; color: #555; cursor: not-allowed; }

        .history-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; }
        .history-item { padding: 6px; border-radius: 8px; font-weight: bold; font-size: 12px; background: #12191f; border: 1px solid rgba(0,255,136,0.2); color: var(--accent); text-align: center; }
        .hist-crash { color: var(--error); border-color: rgba(255,75,75,0.2); }
        
        .win-badge { position: absolute; background: var(--accent); color: black; padding: 5px 15px; border-radius: 10px; font-weight: bold; z-index: 10; left: 50%; transform: translateX(-50%); animation: popUp 1s forwards; }
        @keyframes popUp { 0% { bottom: 30px; opacity: 1; } 100% { bottom: 80px; opacity: 0; } }
    </style>
</head>
<body>

<div class="app-container">
    <div id="alert-toast">⚠️ أقل رهان هو 1</div>

    <div id="auth-screen">
        <h2 style="margin-bottom: 20px;">دخول اللاعبين 🌍</h2>
        <input type="text" id="username" class="input-field" placeholder="اسم المستخدم">
        <input type="password" id="password" class="input-field" placeholder="كلمة السر">
        <button class="btn-bet" onclick="handleLogin()">تسجيل الدخول</button>
    </div>

    <div id="game-screen" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span id="player-name" style="color: #888;">---</span>
            <div style="color: var(--gold); font-weight: bold; font-size: 18px;">💰 <span id="player-balance">0.00</span></div>
        </div>

        <div id="main-timer">5</div>
        <div id="mult-display" class="multiplier">1.00x</div>
        <div class="track" id="track"><div id="camel" class="camel">🐪</div></div>

        <div class="controls">
            <div class="toggle-box">
                <span>رهان تلقائي</span>
                <label class="switch"><input type="checkbox" id="auto-bet-toggle"><span class="slider"></span></label>
            </div>
            <div class="toggle-box">
                <span>سحب آلي عند:</span>
                <input type="number" id="auto-cash-val" value="2.00" step="0.1" style="width: 60px; background: #0b141a; border: 1px solid #444; color: white; text-align: center; border-radius: 5px;">
                <label class="switch"><input type="checkbox" id="auto-cash-toggle"><span class="slider"></span></label>
            </div>
            
            <div class="input-group">
                <input type="number" id="bet-amount" class="input-field" value="1" min="1" placeholder="مبلغ الرهان">
            </div>
            <button id="action-btn" class="btn-bet" onclick="handleAction()">وضع رهان</button>
        </div>

        <div class="history-section">
            <div id="history-list" class="history-list"></div>
        </div>
    </div>
</div>

<script>
    const CONF = { URL: 'https://uqmfwgdrlcqywxvdljlb.supabase.co', KEY: 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT' };
    const supabaseClient = supabase.createClient(CONF.URL, CONF.KEY);

    let user = null, betPlaced = false, userInBet = false, hasCashedOut = false;
    let crashPoint = 0, lastBetAmount = 0, lastLoggedRound = -1;
    const WAIT_TIME = 5; 
    const MAX_RACING_TIME = 15; // الجمل لن يجري أكثر من 15 ثانية
    const CYCLE_TIME = WAIT_TIME + MAX_RACING_TIME; // الدورة الإجمالية 20 ثانية

    async function handleLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        const { data } = await supabaseClient.from('Profiles').select('*').eq('username', u).eq('password', p).maybeSingle();
        if (data) { 
            user = data; 
            document.getElementById('auth-screen').style.display='none'; 
            document.getElementById('game-screen').style.display='block'; 
            const saved = localStorage.getItem('global_camel_history_v5');
            if (saved) document.getElementById('history-list').innerHTML = saved;
            updateUI(); startEngine(); 
        } else { showAlert("بيانات الدخول خاطئة"); }
    }

    function showAlert(msg) {
        const t = document.getElementById('alert-toast'); t.innerText = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    function startEngine() {
        setInterval(() => {
            const now = Date.now() / 1000;
            const cyclePos = now % CYCLE_TIME;
            const roundId = Math.floor(now / CYCLE_TIME);
            crashPoint = generateGlobalCrash(roundId);

            if (cyclePos < WAIT_TIME) renderWaiting(Math.ceil(WAIT_TIME - cyclePos), roundId);
            else renderRacing(cyclePos - WAIT_TIME, roundId);
        }, 50); // تحديث أسرع للمزامنة
    }

    function generateGlobalCrash(seed) {
        let h = Math.abs(Math.sin(seed) * 10000);
        let r = h - Math.floor(h);
        // تم تعديل المعادلة ليكون الحد الأقصى للتحطم متوافق مع طول الطريق
        let crash = parseFloat((0.98 / (1 - r * 0.95)).toFixed(2));
        return Math.min(crash, 10.00); // الجمل ينفجر حتماً قبل 10.00x لضمان عدم الخروج عن الطريق
    }

    function renderWaiting(sec, rid) {
        document.getElementById('main-timer').style.display = 'block';
        document.getElementById('mult-display').style.display = 'none';
        document.getElementById('main-timer').innerText = sec;
        document.getElementById('camel').style.left = "0%";
        hasCashedOut = false; userInBet = false;
        lastLoggedRound = rid - 1;

        if (document.getElementById('auto-bet-toggle').checked && !betPlaced) {
            const amt = parseFloat(document.getElementById('bet-amount').value);
            if (amt >= 1 && amt <= user.balance) betPlaced = true;
        }
        if (!betPlaced) updateButton("رهان للجولة القادمة", "btn-bet");
        else updateButton("إلغاء الرهان", "btn-cancel");
    }

    function renderRacing(elapsed, rid) {
        document.getElementById('main-timer').style.display = 'none';
        document.getElementById('mult-display').style.display = 'block';
        
        // سرعة حركة الجمل: يقطع الطريق كاملاً عند وصوله لـ 10.00x
        const currentMult = Math.pow(1.15, elapsed); 

        if (currentMult >= crashPoint) {
            document.getElementById('mult-display').innerText = crashPoint.toFixed(2) + "x";
            document.getElementById('mult-display').style.color = "var(--error)";
            updateButton("انتهت الجولة", "btn-waiting");
            if (lastLoggedRound !== rid) { addToHistory(crashPoint.toFixed(2)); lastLoggedRound = rid; betPlaced = false; userInBet = false; }
        } else {
            document.getElementById('mult-display').innerText = currentMult.toFixed(2) + "x";
            document.getElementById('mult-display').style.color = "var(--accent)";
            
            // حساب مكان الجمل: 0% عند 1x و 90% عند 10x
            let position = (currentMult - 1) * 10; 
            document.getElementById('camel').style.left = Math.min(position, 90) + "%";

            if (betPlaced && !userInBet) {
                userInBet = true; betPlaced = false;
                lastBetAmount = parseFloat(document.getElementById('bet-amount').value);
                user.balance -= lastBetAmount; updateUI();
            }

            if (userInBet && !hasCashedOut) {
                if (document.getElementById('auto-cash-toggle').checked) {
                    const target = parseFloat(document.getElementById('auto-cash-val').value);
                    if (currentMult >= target) cashOut();
                }
                updateButton("سحب الآن", "btn-cashout", `اربح: ${(lastBetAmount * currentMult).toFixed(2)}`);
            }
        }
    }

    function handleAction() {
        if (document.getElementById('main-timer').style.display === 'block') {
            const amt = parseFloat(document.getElementById('bet-amount').value);
            if (!betPlaced) {
                if (isNaN(amt) || amt < 1) return showAlert("⚠️ أقل رهان هو 1");
                if (amt > user.balance) return showAlert("⚠️ الرصيد ناقص");
                betPlaced = true;
            } else { betPlaced = false; }
        } else if (userInBet && !hasCashedOut) cashOut();
    }

    function cashOut() {
        hasCashedOut = true;
        const mult = parseFloat(document.getElementById('mult-display').innerText);
        const win = lastBetAmount * mult;
        showWinBadge(Math.floor(win));
        user.balance += win; updateUI(); updateDB();
        updateButton("تم السحب", "btn-waiting");
    }

    function showWinBadge(amt) {
        const b = document.createElement('div'); b.className='win-badge'; b.innerText=`ربحت ${amt}!`;
        document.getElementById('track').appendChild(b); setTimeout(() => b.remove(), 1000);
    }

    function addToHistory(v) {
        const l = document.getElementById('history-list'); const i = document.createElement('div');
        i.className = `history-item ${v < 2 ? 'hist-crash' : ''}`; i.innerText = v + 'x';
        if (l.children.length >= 12) l.removeChild(l.lastChild);
        l.insertBefore(i, l.firstChild);
        localStorage.setItem('global_camel_history_v5', l.innerHTML);
    }

    function updateUI() { document.getElementById('player-balance').innerText = parseFloat(user.balance).toFixed(2); document.getElementById('player-name').innerText = user.username; }
    function updateButton(t, c, s="") { const b = document.getElementById('action-btn'); b.className = c; b.innerHTML = s ? `<span>${t}</span><br><small style="font-size:11px;">${s}</small>` : t; }
    async function updateDB() { await supabaseClient.from('Profiles').update({ balance: user.balance }).eq('id', user.id); }
</script>
</body>
</html>
