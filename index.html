<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن العالمي | Pro</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 400px; background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #333; position: relative; }
        .auth-container h2 { color: var(--accent); text-align: center; }
        .input-field { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #444; background: #0b141a; color: white; text-align: center; }
        .header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .balance-box { color: var(--gold); font-weight: bold; font-size: 1.2rem; }
        #main-timer { font-size: 80px; color: var(--gold); text-align: center; font-weight: bold; }
        .multiplier { font-size: 70px; color: var(--accent); text-align: center; font-weight: bold; display: none; }
        .track { height: 120px; background: #12191f; border-radius: 15px; position: relative; overflow: hidden; margin: 15px 0; border: 1px solid #333; }
        .camel-wrapper { position: absolute; bottom: 10px; left: 0; transition: left 0.1s linear; font-size: 50px; }
        .explosion { position: absolute; width: 80px; height: 80px; background: radial-gradient(circle, #ffcc00, #ff4b4b, transparent); border-radius: 50%; display: none; z-index: 10; animation: explode 0.5s forwards; }
        @keyframes explode { 0% { transform: scale(0.1); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
        .controls { display: flex; flex-direction: column; gap: 10px; }
        .main-btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cashout { background: var(--error); color: white; }
        .btn-waiting { background: #444; color: #888; cursor: not-allowed; }
        .history-list { display: flex; gap: 8px; overflow-x: auto; margin-top: 15px; padding: 5px; flex-direction: row-reverse; }
        .history-item { min-width: 60px; background: #0b141a; padding: 5px; border-radius: 8px; text-align: center; color: var(--accent); border: 1px solid #333; font-size: 0.9rem; }
        .hist-crash { color: var(--error); }
    </style>
</head>
<body>

<div class="app-container">
    <div id="auth-screen">
        <h2>سباق الهجن 🐪</h2>
        <input type="text" id="username" class="input-field" placeholder="اسم المستخدم">
        <input type="password" id="password" class="input-field" placeholder="كلمة المرور">
        <button class="main-btn btn-bet" onclick="processAuth()">دخول / تسجيل</button>
    </div>

    <div id="game-screen" style="display:none;">
        <div class="header">
            <span id="player-name">---</span>
            <div class="balance-box">💰 <span id="balance">0.00</span></div>
        </div>

        <div id="main-timer">5</div>
        <div id="mult-display" class="multiplier">1.00x</div>
        
        <div class="track" id="track-box">
            <div id="camel-wrap" class="camel-wrapper">🐪</div>
            <div id="boom-fx" class="explosion"></div>
        </div>

        <div class="controls">
            <div style="display: flex; gap: 5px;">
                <input type="number" id="bet-amount" class="input-field" value="10" style="flex:1">
                <input type="number" id="auto-cashout" class="input-field" value="2.00" step="0.1" style="flex:1">
            </div>
            <button id="action-btn" class="main-btn btn-bet" onclick="handleAction()">وضع رهان</button>
        </div>

        <div id="history-list" class="history-list"></div>
    </div>
</div>

<script>
    const CONF = { URL: 'https://uqmfwgdrlcqywxvdljlb.supabase.co', KEY: 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT' };
    const supabaseClient = supabase.createClient(CONF.URL, CONF.KEY);

    let user = null, betPlaced = false, userInRace = false, cashed = false, currentBet = 0;
    const CYCLE = 20, WAIT = 5, MAX_LIMIT = 850.00;

    async function processAuth() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if(u.length < 3) return alert("الاسم قصير");

        let { data } = await supabaseClient.from('Profiles').select('*').eq('username', u).maybeSingle();
        if(!data) {
            const { data: newUser } = await supabaseClient.from('Profiles').insert([{ username: u, password: p, balance: 100 }]).select().single();
            data = newUser;
        }
        user = data;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('player-name').innerText = user.username;
        document.getElementById('balance').innerText = user.balance.toFixed(2);
        
        syncHistory();
        setInterval(syncHistory, 5000);
        requestAnimationFrame(tick);
    }

    function tick() {
        const now = Date.now() / 1000;
        const pos = now % CYCLE;
        const roundId = Math.floor(now / CYCLE);
        let crashAt = getCrash(roundId);

        if (pos < WAIT) {
            renderWait(Math.ceil(WAIT - pos));
            window.isLogged = false;
        } else {
            const elapsed = pos - WAIT;
            let mult = Math.pow(1.15, elapsed);

            if (mult >= MAX_LIMIT) {
                mult = MAX_LIMIT;
                if(userInRace && !cashed) doCashout(MAX_LIMIT);
            }

            if (mult >= crashAt || mult >= 850.01) {
                const final = Math.min(crashAt, 850.01);
                if(!window.isLogged) {
                    window.isLogged = true;
                    addLocalHistory(final);
                    saveRound(final);
                }
                renderCrash(final);
            } else {
                renderRace(mult, elapsed);
                if (userInRace && !cashed) {
                    if (mult >= parseFloat(document.getElementById('auto-cashout').value)) doCashout(mult);
                }
                if (betPlaced && !userInRace) joinRace();
            }
        }
        requestAnimationFrame(tick);
    }

    function getCrash(id) {
        let r = Math.abs(Math.sin(id * 567.890) * 10000) % 1;
        if (r < 0.03) return 1.00;
        let res = 0.98 / (1 - r);
        return res > 850 ? 850.01 : parseFloat(res.toFixed(2));
    }

    function renderWait(s) {
        document.getElementById('main-timer').style.display = 'block';
        document.getElementById('main-timer').innerText = s;
        document.getElementById('mult-display').style.display = 'none';
        document.getElementById('camel-wrap').style.left = "0%";
        document.getElementById('camel-wrap').style.opacity = "1";
        document.getElementById('boom-fx').style.display = "none";
        const btn = document.getElementById('action-btn');
        btn.innerText = betPlaced ? "تم التجهيز..." : "وضع رهان";
        btn.className = "main-btn " + (betPlaced ? "btn-waiting" : "btn-bet");
    }

    function renderRace(m, e) {
        document.getElementById('main-timer').style.display = 'none';
        const d = document.getElementById('mult-display');
        d.style.display = 'block'; d.innerText = m.toFixed(2) + "x";
        d.style.color = "var(--accent)";
        document.getElementById('camel-wrap').style.left = Math.min(e * 5, 85) + "%";
        if (userInRace && !cashed) {
            const btn = document.getElementById('action-btn');
            btn.innerText = "سحب: " + (m * currentBet).toFixed(2);
            btn.className = "main-btn btn-cashout";
        }
    }

    function renderCrash(cp) {
        const d = document.getElementById('mult-display');
        d.innerText = cp.toFixed(2) + "x";
        d.style.color = "var(--error)";
        if (document.getElementById('camel-wrap').style.opacity !== "0") {
            const boom = document.getElementById('boom-fx');
            boom.style.left = document.getElementById('camel-wrap').style.left;
            boom.style.display = "block";
            document.getElementById('camel-wrap').style.opacity = "0";
            userInRace = false; betPlaced = false;
            document.getElementById('action-btn').className = "main-btn btn-waiting";
            document.getElementById('action-btn').innerText = "انفجر!";
        }
    }

    function handleAction() {
        const pos = (Date.now() / 1000) % CYCLE;
        if (pos < WAIT) betPlaced = !betPlaced;
        else if (userInRace && !cashed) doCashout(parseFloat(document.getElementById('mult-display').innerText));
    }

    function joinRace() {
        currentBet = parseFloat(document.getElementById('bet-amount').value);
        if (user.balance >= currentBet) {
            userInRace = true; cashed = false; betPlaced = false;
            user.balance -= currentBet; updateUI(); saveBalance();
        }
    }

    function doCashout(m) {
        if (cashed || !userInRace) return;
        cashed = true;
        user.balance += (currentBet * m);
        updateUI(); saveBalance();
        document.getElementById('action-btn').innerText = "تم السحب ✅";
        document.getElementById('action-btn').className = "main-btn btn-waiting";
    }

    function updateUI() {
        document.getElementById('balance').innerText = user.balance.toFixed(2);
    }

    function addLocalHistory(v) {
        const list = document.getElementById('history-list');
        const item = document.createElement('div');
        const val = parseFloat(v).toFixed(2);
        item.className = `history-item ${val < 2 ? 'hist-crash' : ''}`;
        item.innerText = val + "x";
        list.insertBefore(item, list.firstChild);
        if (list.children.length > 10) list.lastChild.remove();
    }

    async function syncHistory() {
        const { data } = await supabaseClient.from('GameHistory').select('crash_point').order('id', { ascending: false }).limit(10);
        if (data) {
            document.getElementById('history-list').innerHTML = data.map(r => {
                const v = r.crash_point.toFixed(2);
                return `<div class="history-item ${v < 2 ? 'hist-crash' : ''}">${v}x</div>`;
            }).join('');
        }
    }

    async function saveRound(p) { await supabaseClient.rpc('add_crash_record', { crash_val: p }); }
    async function saveBalance() { await supabaseClient.from('Profiles').update({ balance: user.balance }).eq('id', user.id); }
</script>
</body>
</html>
