<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن - النسخة الاحترافية</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-y: auto; padding: 20px 0; }
        .app-container { width: 95%; max-width: 420px; background: var(--card); padding: 20px; border-radius: 24px; border: 1px solid #2d333b; text-align: center; position: relative; }
        
        #main-timer { font-size: 80px; font-weight: 900; color: var(--gold); margin: 20px 0; display: none; }
        .multiplier { font-size: 65px; font-weight: 900; color: var(--accent); margin: 15px 0; }
        
        .track { height: 100px; background: #12191f; border-radius: 18px; position: relative; overflow: hidden; border: 2px solid #2d333b; margin: 15px 0; }
        .camel { position: absolute; bottom: 10px; left: 0; font-size: 50px; transition: left 0.1s linear; }
        
        .controls { background: #0d1117; padding: 15px; border-radius: 18px; margin-bottom: 20px; }
        .input-field { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #1c262d; color: white; text-align: center; font-size: 18px; }
        
        button { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 20px; font-weight: 900; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cancel { background: #444; color: white; }
        .btn-cashout { background: var(--error); color: white; display: flex; flex-direction: column; line-height: 1.2; }
        .btn-cashout .sub-text { font-size: 14px; font-weight: normal; opacity: 0.9; margin-top: 4px; }
        .btn-waiting { background: #222; color: #555; cursor: not-allowed; }

        .balance-container { color: var(--gold); font-weight: bold; font-size: 18px; transition: all 0.3s ease; }
        .balance-up { transform: scale(1.3); color: var(--accent) !important; }
        
        /* سجل الجولات */
        .history-section { text-align: right; margin-top: 10px; border-top: 1px solid #2d333b; padding-top: 15px; }
        .history-title { font-size: 14px; color: #888; margin-bottom: 10px; display: block; }
        .history-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; flex-wrap: wrap; justify-content: center; }
        .history-item { padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 14px; background: #12191f; min-width: 50px; text-align: center; }
        .hist-green { color: var(--accent); border: 1px solid rgba(0,255,136,0.3); }
        .hist-red { color: var(--error); border: 1px solid rgba(255,75,75,0.3); }

        .win-float { position: absolute; font-weight: bold; color: var(--accent); animation: floatUp 1s forwards; pointer-events: none; z-index: 100; text-shadow: 0 0 10px rgba(0,255,136,0.5); }
        @keyframes floatUp { 
            0% { transform: translate(-50%, 0); opacity: 1; font-size: 20px; }
            100% { transform: translate(-50%, -120px); opacity: 0; font-size: 35px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div id="auth-screen">
        <h2>تسجيل الدخول 🐪</h2>
        <input type="text" id="username" class="input-field" placeholder="اسم المستخدم">
        <input type="password" id="password" class="input-field" placeholder="كلمة السر">
        <button class="btn-bet" onclick="handleLogin()">دخول</button>
    </div>

    <div id="game-screen" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span id="player-name" style="color: #888;">---</span>
            <div id="balance-wrap" class="balance-container">💰 <span id="player-balance">0.00</span></div>
        </div>

        <div id="main-timer">5</div>
        <div id="mult-display" class="multiplier">1.00x</div>
        
        <div class="track"><div id="camel" class="camel">🐪</div></div>

        <div class="controls">
            <input type="number" id="bet-amount" class="input-field" value="10">
            <button id="action-btn" class="btn-bet" onclick="handleAction()">رهان</button>
        </div>

        <div class="history-section">
            <span class="history-title">الجولات السابقة:</span>
            <div id="history-list" class="history-list">
                </div>
        </div>
    </div>
</div>

<script>
    const CONF = { URL: 'https://uqmfwgdrlcqywxvdljlb.supabase.co', KEY: 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT' };
    const supabaseClient = supabase.createClient(CONF.URL, CONF.KEY);

    let user = null, currentMult = 1.0, gameActive = false, userInBet = false, betPlaced = false, hasCashedOut = false;
    let startTime, crashPoint;
    let history = [];

    async function handleLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        try {
            const { data, error } = await supabaseClient.from('Profiles').select('*').eq('username', u).eq('password', p).maybeSingle();
            if (data) {
                user = data;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
                updateUI();
                autoLoop();
            } else { alert("بيانات الدخول غير صحيحة"); }
        } catch (e) { alert("حدث خطأ في الاتصال"); }
    }

    function updateUI() {
        document.getElementById('player-balance').innerText = parseFloat(user.balance).toFixed(2);
        document.getElementById('player-name').innerText = user.username;
    }

    async function autoLoop() {
        while(true) {
            resetRace();
            const timerDisplay = document.getElementById('main-timer');
            const multDisplay = document.getElementById('mult-display');
            
            multDisplay.style.display = 'none';
            timerDisplay.style.display = 'block';
            
            for(let i=5; i>0; i--) {
                timerDisplay.innerText = i;
                if (!betPlaced) updateButton("رهان للسباق القادم", "btn-bet");
                await new Promise(r => setTimeout(r, 1000));
            }
            
            timerDisplay.style.display = 'none';
            multDisplay.style.display = 'block';
            await startRace();
            await new Promise(r => setTimeout(r, 3000));
        }
    }

    function resetRace() {
        gameActive = false; hasCashedOut = false; currentMult = 1.0;
        document.getElementById('mult-display').innerText = "1.00x";
        document.getElementById('mult-display').style.color = "var(--accent)";
        document.getElementById('camel').style.left = "0";
        if (!betPlaced) { userInBet = false; updateButton("رهان للسباق القادم", "btn-bet"); }
    }

    function handleAction() {
        const amt = parseFloat(document.getElementById('bet-amount').value);
        if (gameActive && userInBet && !hasCashedOut) {
            cashOut();
        } else if (!gameActive && !betPlaced) {
            if (amt > user.balance || amt <= 0) return alert("رصيد ناقص");
            betPlaced = true; updateButton("إلغاء الرهان", "btn-cancel");
        } else if (!gameActive && betPlaced) {
            betPlaced = false; updateButton("رهان للسباق القادم", "btn-bet");
        }
    }

    function updateButton(text, className, subText = "") {
        const btn = document.getElementById('action-btn');
        btn.className = className;
        if (subText) {
            btn.innerHTML = `<span>${text}</span><small class="sub-text">${subText}</small>`;
        } else {
            btn.innerHTML = text;
        }
    }

    async function startRace() {
        gameActive = true; 
        startTime = Date.now();
        // معادلة حظ متغيرة
        crashPoint = (Math.random() * Math.random() * 10 + 1.1);
        
        if (betPlaced) {
            userInBet = true; betPlaced = false;
            const betAmt = parseFloat(document.getElementById('bet-amount').value);
            user.balance -= betAmt;
            updateUI();
        }

        return new Promise(resolve => {
            function frame() {
                if (!gameActive) return resolve();
                let elapsed = (Date.now() - startTime) / 1000;
                currentMult = Math.pow(Math.E, 0.085 * elapsed);
                
                document.getElementById('mult-display').innerText = currentMult.toFixed(2) + "x";
                document.getElementById('camel').style.left = Math.min((currentMult - 1) * 15, 88) + "%";

                if (userInBet && !hasCashedOut) {
                    const bet = parseFloat(document.getElementById('bet-amount').value);
                    const currentWin = (bet * currentMult).toFixed(2);
                    updateButton("سحب الأرباح", "btn-cashout", `اربح الآن: ${currentWin} 💰`);
                } else if (!userInBet) {
                    updateButton("شاهد السباق...", "btn-waiting");
                }

                if (currentMult >= crashPoint) {
                    gameActive = false;
                    onCrash();
                    resolve();
                } else { requestAnimationFrame(frame); }
            }
            requestAnimationFrame(frame);
        });
    }

    function cashOut() {
        hasCashedOut = true;
        const bet = parseFloat(document.getElementById('bet-amount').value);
        const winAmount = bet * currentMult;
        animateWin(winAmount.toFixed(2));
        user.balance = parseFloat(user.balance) + winAmount;
        updateButton("تم السحب بنجاح", "btn-waiting");
        updateDB();
    }

    function animateWin(amount) {
        const btn = document.getElementById('action-btn');
        const rect = btn.getBoundingClientRect();
        const float = document.createElement('div');
        float.className = 'win-float';
        float.innerText = `+${amount}`;
        float.style.left = (rect.left + rect.width / 2) + 'px';
        float.style.top = rect.top + 'px';
        document.body.appendChild(float);
        
        const bWrap = document.getElementById('balance-wrap');
        bWrap.classList.add('balance-up');
        
        setTimeout(() => {
            updateUI();
            bWrap.classList.remove('balance-up');
            float.remove();
        }, 1000);
    }

    function onCrash() {
        const finalMult = currentMult.toFixed(2);
        document.getElementById('mult-display').innerText = "💥 " + finalMult + "x";
        document.getElementById('mult-display').style.color = "var(--error)";
        updateButton("انتهى السباق", "btn-waiting");
        
        // إضافة النتيجة للسجل
        addToHistory(finalMult);
        
        if (userInBet) updateDB();
    }

    function addToHistory(val) {
        const list = document.getElementById('history-list');
        const item = document.createElement('div');
        item.className = `history-item ${val >= 2 ? 'hist-green' : 'hist-red'}`;
        item.innerText = val + 'x';
        
        // إبقاء آخر 10 نتائج فقط
        if (list.children.length >= 12) {
            list.removeChild(list.lastChild);
        }
        list.insertBefore(item, list.firstChild);
    }

    async function updateDB() {
        await supabaseClient.from('Profiles').update({ balance: user.balance }).eq('id', user.id);
    }
</script>
</body>
</html>
