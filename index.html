<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام سباق الهجن</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; text-align: center; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 320px; border: 1px solid #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #252525; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #27ae60; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        #game-screen { display: none; }
        .balance { font-size: 28px; color: #f1c40f; margin: 20px 0; }
        .status { color: #2ecc71; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <div id="login-screen">
        <h2 style="color: #27ae60;">تسجيل الدخول</h2>
        <input type="text" id="user-input" placeholder="اسم المستخدم">
        <input type="password" id="pass-input" placeholder="كلمة السر">
        <button onclick="login()">دخول ومزامنة</button>
        <p id="msg" style="color: #e74c3c; font-size: 14px; margin-top: 10px;"></p>
    </div>

    <div id="game-screen">
        <h3 id="welcome-msg"></h3>
        <div class="balance">رصيدك: <span id="user-balance">0</span> 💰</div>
        <p class="status">متصل بقاعدة البيانات ✅</p>
        <button onclick="location.reload()" style="background: #e67e22;">تسجيل الخروج</button>
    </div>
</div>

<script>
    // المعلومات المستخرجة من صورتك الأخيرة
    const SUPABASE_URL = 'https://uqmfwgdrlcqywxvdljlb.supabase.co';
    
    // ملاحظة: بما أن المفتاح مخفي في صورتك، ستحتاج لوضع المفتاح الذي يظهر في صفحة API Settings 
    // تحت مسمى "anon public" مكان النص أدناه.
    const SUPABASE_KEY = 'ضـع_مـفـتـاح_ANON_هـنـا'; 

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function login() {
        const u = document.getElementById('user-input').value;
        const p = document.getElementById('pass-input').value;
        const msg = document.getElementById('msg');

        msg.innerText = "جاري التحقق...";

        // استعلام من جدول Profiles (كما أنشأته في الصورة 1000009795.jpg)
        const { data, error } = await _supabase
            .from('Profiles')
            .select('*')
            .eq('username', u)
            .eq('password', p)
            .single();

        if (data) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('welcome-msg').innerText = "أهلاً بك " + data.username;
            document.getElementById('user-balance').innerText = data.balance;
        } else {
            msg.innerText = "خطأ: تأكد من الاسم وكلمة السر!";
            console.error(error);
        }
    }
</script>

</body>
</html>
