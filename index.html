<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هجن كراش - Camel Crash</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 10px; }
        .card { background: #1e272e; padding: 20px; border-radius: 15px; max-width: 400px; margin: 10px auto; box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
        input { width: 80%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #34495e; background: #000; color: #fff; direction: ltr; text-align: center; font-size: 18px; }
        
        #multiplier { font-size: 60px; color: #2ecc71; font-weight: bold; margin: 20px 0; }
        .track { background: #edc9af; height: 120px; border-radius: 15px; position: relative; overflow: hidden; border: 4px solid #d4a373; margin: 20px 0; }
        .camel { font-size: 50px; position: absolute; left: 10%; bottom: 10px; transition: transform 0.1s; }
        
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        #bet-btn { background: #27ae60; color: white; }
        #cashout-btn { background: #e67e22; color: white; display: none; }
        
        .status-msg { margin-top: 15px; font-weight: bold; }
        #login-ui { display: block; }
        #game-ui { display: none; }
    </style>
</head>
<body>

<div id="login-ui" class="card">
    <h2>تسجيل الدخول</h2>
    <input type="text" id="u" placeholder="Username">
    <input type="password" id="p" placeholder="Password">
    <button onclick="login()" style="background:#2ecc71;">دخول</button>
    <p id="login-msg" style="color:#e74c3c;"></p>
</div>

<div id="game-ui">
    <div class="card">
        <h3>المتسابق: <span id="user-display"></span></h3>
        <div style="font-size: 24px; color: #f1c40f;">رصيدك: <span id="balance-display">0</span> 💰</div>
        
        <div id="multiplier">1.00x</div>
        
        <div class="track">
            <div id="camel-actor" class="camel">🐪</div>
        </div>

        <div id="bet-controls">
            <p>حدد مبلغ الرهان:</p>
            <input type="number" id="bet-amount" value="10" min="1">
            <button id="bet-btn" onclick="startGame()">ابدأ الرهان</button>
            <button id="cashout-btn" onclick="cashOut()">اسحب الأرباح!</button>
        </div>
        
        <p id="game-msg" class="status-msg"></p>
    </div>
</div>

<script>
    const S_URL = 'https://uqmfwgdrlcqywxvdljlb.supabase.co';
    const S_KEY = 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT'; // مفتاحك الأحمر
    const _supabase = supabase.createClient(S_URL, S_KEY);

    let currentBalance = 0;
    let username = "";
    let gameInterval;
    let currentMultiplier = 1.0;
    let crashPoint = 0;
    let isPlaying = false;
    let currentBet = 0;

    async function login() {
        const u = document.getElementById('u').value.trim();
        const p = document.getElementById('p').value.trim();
        const { data } = await _supabase.from('Profiles').select('*').eq('username', u).eq('password', p).single();

        if (data) {
            username = data.username;
            currentBalance = data.balance;
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            updateUI();
        } else {
            document.getElementById('login-msg').innerText = "خطأ في البيانات!";
        }
    }

    function updateUI() {
        document.getElementById('user-display').innerText = username;
        document.getElementById('balance-display').innerText = Math.floor(currentBalance);
    }

    async function startGame() {
        currentBet = parseFloat(document.getElementById('bet-amount').value);
        if (currentBet > currentBalance || currentBet <= 0) return alert("الرصيد غير كافٍ!");

        isPlaying = true;
        currentBalance -= currentBet; // خصم الرهان فوراً
        updateUI();

        // إخفاء زر الرهان وإظهار زر الانسحاب
        document.getElementById('bet-btn').style.display = 'none';
        document.getElementById('cashout-btn').style.display = 'block';
        document.getElementById('game-msg').innerText = "ركضت الهجن.. انتبه!";
        document.getElementById('game-msg').style.color = "#f1c40f";

        currentMultiplier = 1.0;
        crashPoint = (Math.random() * 5 + 1.1).toFixed(2); // نقطة الانفجار عشوائية بين 1.1 و 6.0
        
        gameInterval = setInterval(() => {
            currentMultiplier += 0.02;
            document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2) + "x";
            
            // تحريك الناقة بشكل اهتزازي
            let shake = Math.random() * 5;
            document.getElementById('camel-actor').style.transform = `translateX(${shake}px)`;

            if (currentMultiplier >= crashPoint) {
                gameOver();
            }
        }, 100);
    }

    async function cashOut() {
        if (!isPlaying) return;
        
        let winAmount = currentBet * currentMultiplier;
        currentBalance += winAmount;
        isPlaying = false;
        clearInterval(gameInterval);

        document.getElementById('game-msg').innerText = `تم السحب! ربحت ${Math.floor(winAmount)} 💰`;
        document.getElementById('game-msg').style.color = "#2ecc71";
        
        await finishGame();
    }

    async function gameOver() {
        isPlaying = false;
        clearInterval(gameInterval);
        document.getElementById('multiplier').style.color = "#e74c3c";
        document.getElementById('game-msg').innerText = "انفجرت (CRASH)! لقد خسرت الرهان.";
        document.getElementById('game-msg').style.color = "#e74c3c";
        
        await finishGame();
    }

    async function finishGame() {
        document.getElementById('bet-btn').style.display = 'block';
        document.getElementById('cashout-btn').style.display = 'none';
        
        // تحديث الرصيد في قاعدة البيانات
        await _supabase.from('Profiles').update({ balance: Math.floor(currentBalance) }).eq('username', username);
        updateUI();

        setTimeout(() => {
            document.getElementById('multiplier').innerText = "1.00x";
            document.getElementById('multiplier').style.color = "#2ecc71";
        }, 3000);
    }
</script>
</body>
</html>
