<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن | الإصدار المستقر</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 420px; background: var(--card); padding: 25px; border-radius: 30px; border: 1px solid #2d333b; position: relative; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .balance-box { background: rgba(255, 204, 0, 0.15); padding: 10px 18px; border-radius: 14px; border: 1px solid var(--gold); color: var(--gold); font-weight: 900; }

        #main-timer { font-size: 80px; font-weight: 900; color: var(--gold); text-align: center; }
        .multiplier { font-size: 75px; font-weight: 900; color: var(--accent); display: none; text-align: center; }
        
        .track { 
            height: 140px; background: #12191f; border-radius: 20px; position: relative; overflow: hidden; border: 2px solid #2d333b; margin: 15px 0;
            background-image: linear-gradient(90deg, #1c262d 1px, transparent 1px); background-size: 50px 100%;
        }
        .camel-box { position: absolute; bottom: 15px; left: 0; z-index: 5; transition: left 0.1s linear; }
        .camel-icon { font-size: 50px; transform: scaleX(-1); display: inline-block; }

        .controls { background: #0d1117; padding: 20px; border-radius: 22px; display: flex; flex-direction: column; gap: 12px; }
        .input-row { display: flex; gap: 10px; }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: #888; margin-right: 5px; }
        .field { width: 100%; background: #1c262d; border: 1px solid #333; color: white; padding: 12px; border-radius: 12px; text-align: center; font-weight: bold; }

        button.main-btn { width: 100%; padding: 18px; border-radius: 16px; border: none; font-size: 19px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cashout { background: var(--error); color: white; }
        .btn-off { background: #222; color: #555; pointer-events: none; }

        .history-bar { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; flex-direction: row-reverse; }
        .history-tag { min-width: 65px; padding: 8px; border-radius: 10px; background: #12191f; color: var(--accent); border: 1px solid rgba(0,255,136,0.1); text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <span style="opacity: 0.6;">لاعب: <span id="u-name">Admin</span></span>
        <div id="bal-card" class="balance-box">💰 <span id="balance">100.00</span></div>
    </div>

    <div id="main-timer">5</div>
    <div id="mult-display" class="multiplier">1.00x</div>
    
    <div class="track" id="track-ui">
        <div id="camel-move" class="camel-box"><span class="camel-icon">🐪</span></div>
    </div>

    <div class="controls">
        <div class="input-row">
            <div class="input-group">
                <label>الرهان</label>
                <input type="number" id="bet-val" class="field" value="10">
            </div>
            <div class="input-group">
                <label>Auto Cashout</label>
                <input type="number" id="auto-val" class="field" value="2.00" step="0.01">
            </div>
        </div>
        <button id="btn-action" class="main-btn btn-bet" onclick="handleAction()">وضع رهان</button>
    </div>

    <div id="history-ui" class="history-bar"></div>
</div>

<script>
    // الإعدادات المتقدمة
    let bal = 100.00, betActive = false, inRace = false, isCashed = false, currentBet = 0, bgX = 0;
    const WAIT_TIME = 5; 
    const MAX_CRASH = 700.00; // حد الأمان لمنع تعليق اللعبة

    function startEngine() {
        setInterval(() => {
            const now = Date.now() / 1000, pos = now % 25; // دورة 25 ثانية
            const roundId = Math.floor(now / 25);
            const crashPoint = getSecureCrash(roundId);

            if (pos < WAIT_TIME) {
                resetRace(Math.ceil(WAIT_TIME - pos));
            } else {
                const elapsed = pos - WAIT_TIME;
                const m = Math.pow(1.12, elapsed); // معادلة النمو

                // التحقق من الانفجار أو تجاوز حد الأمان
                if (m >= crashPoint || m >= MAX_CRASH) {
                    processCrash(Math.min(m, crashPoint));
                } else {
                    updateRace(m, elapsed);
                }
            }
        }, 50);
    }

    function getSecureCrash(id) {
        // خوارزمية تضمن عدم التوقف عند رقم معين
        let r = Math.abs(Math.sin(id * 12.9898) * 43758.5453) % 1;
        let val = 0.99 / (1 - r);
        return Math.min(Math.max(val, 1.00), MAX_CRASH);
    }

    function resetRace(s) {
        window.hasSaved = false;
        document.getElementById('main-timer').style.display = 'block';
        document.getElementById('mult-display').style.display = 'none';
        document.getElementById('main-timer').innerText = s;
        document.getElementById('camel-move').style.left = "0%";
        document.getElementById('camel-move').style.opacity = "1";
        if (!inRace) setBtn(betActive ? "تم التجهيز" : "وضع رهان", betActive ? "btn-off" : "btn-bet");
    }

    function updateRace(m, e) {
        document.getElementById('main-timer').style.display = 'none';
        const txt = document.getElementById('mult-display');
        txt.style.display = 'block'; 
        txt.innerText = m.toFixed(2) + "x";
        txt.style.color = "var(--accent)";
        
        // تحريك الجمل بحدود آمنة
        document.getElementById('camel-move').style.left = Math.min(e * 8, 80) + "%";
        bgX -= (2 + m);
        document.getElementById('track-ui').style.backgroundPosition = bgX + "px 0px";

        // ميزة Auto Cashout
        const autoLimit = parseFloat(document.getElementById('auto-val').value);
        if (inRace && !isCashed && m >= autoLimit) {
            triggerWin(autoLimit);
        }

        if (inRace && !isCashed) setBtn("سحب الأرباح", "btn-cashout", (m * currentBet).toFixed(2));
    }

    function processCrash(cp) {
        const txt = document.getElementById('mult-display');
        txt.innerText = cp.toFixed(2) + "x";
        txt.style.color = "var(--error)";
        document.getElementById('camel-move').style.opacity = "0.2";
        setBtn("انفجر الجمل!", "btn-off");
        
        if (!window.hasSaved) {
            pushHistory(cp.toFixed(2));
            window.hasSaved = true;
            inRace = false; 
            betActive = false;
        }
    }

    function handleAction() {
        const pos = (Date.now() / 1000) % 25;
        if (pos < WAIT_TIME) {
            betActive = !betActive;
        } else if (inRace && !isCashed) {
            const m = parseFloat(document.getElementById('mult-display').innerText);
            triggerWin(m);
        }
    }

    function triggerWin(m) {
        isCashed = true;
        bal += (currentBet * m);
        document.getElementById('balance').innerText = bal.toFixed(2);
        setBtn("تم السحب ✅", "btn-off");
    }

    function pushHistory(v) {
        const h = document.getElementById('history-ui');
        const tag = document.createElement('div');
        tag.className = 'history-tag';
        tag.innerText = v + 'x';
        h.insertBefore(tag, h.firstChild);
        if (h.children.length > 10) h.removeChild(h.lastChild);
    }

    function setBtn(t, c, s="") {
        const b = document.getElementById('btn-action'); b.className = `main-btn ${c}`;
        b.innerHTML = s ? `<span>${t}</span><br><small>💰 ${s}</small>` : t;
    }

    startEngine();
</script>
</body>
</html>
