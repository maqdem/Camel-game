<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن Ultimate | نظام السحب المفتوح</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-y: auto; padding: 20px 0; }
        .app-container { width: 95%; max-width: 420px; background: var(--card); padding: 25px; border-radius: 30px; border: 1px solid #2d333b; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .balance-box { background: rgba(255, 204, 0, 0.15); padding: 10px 18px; border-radius: 14px; border: 1px solid var(--gold); color: var(--gold); font-weight: 900; font-size: 18px; }
        #main-timer { font-size: 80px; font-weight: 900; color: var(--gold); text-align: center; }
        .multiplier { font-size: 80px; font-weight: 900; color: var(--accent); display: none; text-align: center; }
        .track { height: 140px; background: #12191f; border-radius: 20px; position: relative; overflow: hidden; border: 2px solid #2d333b; margin: 15px 0; background-image: linear-gradient(90deg, transparent 45%, rgba(255,255,255,0.03) 50%); background-size: 60px 100%; }
        .camel-wrapper { position: absolute; bottom: 15px; left: 0; z-index: 5; transition: left 0.05s linear; }
        .camel { font-size: 55px; transform: scaleX(-1); }
        .explosion { position: absolute; width: 100px; height: 100px; background: radial-gradient(circle, #ffcc00, #ff4b4b, transparent); border-radius: 50%; display: none; z-index: 6; animation: explode 0.5s ease-out; }
        @keyframes explode { 0% { transform: scale(0.1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        .controls { background: #0d1117; padding: 20px; border-radius: 22px; display: flex; flex-direction: column; gap: 12px; }
        .input-row { display: flex; gap: 10px; }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .field-small { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #333; background: #12191f; color: white; text-align: center; font-weight: bold; outline: none; }
        .toggle-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .toggle-btn { padding: 4px 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #888; font-size: 11px; cursor: pointer; font-weight: 900; }
        .toggle-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
        button.main-btn { width: 100%; padding: 18px; border-radius: 16px; border: none; font-size: 20px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cashout { background: var(--error); color: white; }
        .btn-waiting { background: #222; color: #555; pointer-events: none; }
        
        /* سجل النتائج */
        .history-list { display: flex; gap: 8px; overflow-x: auto; margin-top: 15px; padding: 5px; flex-direction: row-reverse; scrollbar-width: none; }
        .history-item { min-width: 65px; background: #12191f; padding: 8px; border-radius: 10px; text-align: center; color: var(--accent); border: 1px solid rgba(0,255,136,0.1); font-weight: bold; font-size: 13px; }
        .hist-crash { color: var(--error); border-color: rgba(255,75,75,0.1); }

        /* جدول الرهانات الحية - الجديد */
        .live-bets { margin-top: 20px; background: #0d1117; border-radius: 15px; padding: 10px; }
        .bets-header { display: flex; justify-content: space-between; font-size: 12px; color: #666; padding: 5px 10px; border-bottom: 1px solid #222; }
        .bets-container { max-height: 150px; overflow-y: auto; }
        .bet-row { display: flex; justify-content: space-between; padding: 8px 10px; font-size: 13px; border-bottom: 1px solid #1a1a1a; transition: 0.3s; }
        .bet-row.cashed { color: var(--accent); background: rgba(0, 255, 136, 0.05); }
        .bet-row.lost { color: #555; }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <div id="auth-screen">
        <h2 style="text-align:center; color:var(--accent);">دخول اللاعب</h2>
        <input type="text" id="username" class="field-small" placeholder="اسم المستخدم" style="margin-bottom:10px;">
        <input type="password" id="password" class="field-small" placeholder="كلمة المرور" style="margin-bottom:15px;">
        <button class="main-btn btn-bet" onclick="processAuth()">ابدأ</button>
    </div>

    <div id="game-screen" style="display:none;">
        <div class="header">
            <span id="player-display" style="opacity: 0.7;">---</span>
            <div class="balance-box">💰 <span id="balance">0.00</span></div>
        </div>
        <div id="main-timer">5</div>
        <div id="mult-display" class="multiplier">1.00x</div>
        <div class="track" id="track-box">
            <div id="camel-wrap" class="camel-wrapper"><div class="camel">🐪</div></div>
            <div id="boom-fx" class="explosion"></div>
        </div>
        <div class="controls">
            <div class="input-row">
                <div class="input-group">
                    <label style="font-size:12px; color:#888;">الرهان</label>
                    <input type="number" id="bet-amount" class="field-small" value="10">
                </div>
                <div class="input-group">
                    <div class="toggle-container">
                        <label style="font-size:12px; color:#888;">سحب تلقائي</label>
                        <button id="auto-toggle" class="toggle-btn active" onclick="toggleAuto()">ON</button>
                    </div>
                    <input type="number" id="auto-cashout" class="field-small" value="2.00" step="0.1">
                </div>
            </div>
            <button id="action-btn" class="main-btn btn-bet" onclick="handleAction()">وضع رهان</button>
        </div>
        
        <div id="history-list" class="history-list"></div>

        <div class="live-bets">
            <div class="bets-header">
                <span>اللاعب</span>
                <span>الرهان</span>
                <span>الربح</span>
            </div>
            <div id="bets-container" class="bets-container">
                </div>
        </div>
    </div>
</div>

<script>
    const CONF = { URL: 'https://uqmfwgdrlcqywxvdljlb.supabase.co', KEY: 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT' };
    const supabaseClient = supabase.createClient(CONF.URL, CONF.KEY);

    let user = null, betPlaced = false, userInRace = false, cashed = false, currentBet = 0, bgPos = 0;
    let autoEnabled = true, gameState = "WAITING", currentMult = 1.00, crashAt = 0;
    let localHistory = [];
    let liveBets = {}; // لتخزين رهانات اللاعبين الآخرين في الجولة الحالية

    // قناة Realtime للتواصل بين اللاعبين
    const gameChannel = supabaseClient.channel('race-room', {
        config: { broadcast: { self: true } }
    });

    gameChannel
        .on('broadcast', { event: 'player_bet' }, (payload) => {
            addLiveBetUI(payload.payload);
        })
        .on('broadcast', { event: 'player_cashout' }, (payload) => {
            updateLiveBetUI(payload.payload);
        })
        .subscribe();

    function toggleAuto() {
        autoEnabled = !autoEnabled;
        document.getElementById('auto-toggle').innerText = autoEnabled ? "ON" : "OFF";
        document.getElementById('auto-toggle').classList.toggle('active', autoEnabled);
    }

    async function processAuth() {
        const u = document.getElementById('username').value, p = document.getElementById('password').value;
        const { data } = await supabaseClient.from('Profiles').select('*').eq('username', u).maybeSingle();
        if (data) { user = data; launch(); } else alert("المستخدم غير موجود");
    }

    function launch() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        updateUI();
        syncHistory();
        runGameLoop();
    }

    function generateNewCrash() {
        let r = Math.random();
        if (r < 0.05) return 1.00; 
        let result = 0.97 / (1 - r); 
        return Math.min(parseFloat(result.toFixed(2)), 700.00); 
    }

    function runGameLoop() {
        gameState = "WAITING";
        crashAt = generateNewCrash();
        document.getElementById('bets-container').innerHTML = ''; // تصفير قائمة الرهانات
        liveBets = {};
        
        let timer = 5;
        const waitInterval = setInterval(() => {
            renderWait(timer);
            timer--;
            if (timer < 0) {
                clearInterval(waitInterval);
                startRace();
            }
        }, 1000);
    }

    function startRace() {
        gameState = "RACING";
        currentMult = 1.00;
        let startTime = Date.now();
        
        const raceInterval = setInterval(() => {
            let elapsed = (Date.now() - startTime) / 1000;
            currentMult = Math.pow(1.08, elapsed); 

            if (currentMult >= crashAt) {
                clearInterval(raceInterval);
                renderCrash(crashAt);
                setTimeout(runGameLoop, 3000);
            } else {
                renderRace(currentMult, elapsed);
                if (userInRace && !cashed && autoEnabled) {
                    if (currentMult >= parseFloat(document.getElementById('auto-cashout').value)) {
                        doCashout(currentMult);
                    }
                }
                if (betPlaced && !userInRace) joinRace();
            }
        }, 50);
    }

    function renderWait(s) {
        document.getElementById('main-timer').style.display = 'block';
        document.getElementById('main-timer').innerText = s;
        document.getElementById('mult-display').style.display = 'none';
        document.getElementById('camel-wrap').style.left = "0%";
        document.getElementById('boom-fx').style.display = "none";
        document.getElementById('camel-wrap').style.opacity = "1";
        const btn = document.getElementById('action-btn');
        btn.innerText = betPlaced ? "تم التجهيز..." : "وضع رهان";
        btn.className = "main-btn " + (betPlaced ? "btn-waiting" : "btn-bet");
    }

    function renderRace(m, e) {
        document.getElementById('main-timer').style.display = 'none';
        const d = document.getElementById('mult-display');
        d.style.display = 'block'; d.innerText = m.toFixed(2) + "x";
        d.style.color = "var(--accent)";
        document.getElementById('camel-wrap').style.left = Math.min(e * 4, 75) + "%";
        bgPos -= (2 + m * 0.2);
        document.getElementById('track-box').style.backgroundPosition = bgPos + "px 0px";
        if (userInRace && !cashed) {
            const btn = document.getElementById('action-btn');
            btn.innerText = "سحب: " + (m * currentBet).toFixed(2);
            btn.className = "main-btn btn-cashout";
        }
    }

    function renderCrash(cp) {
        const d = document.getElementById('mult-display');
        d.innerText = cp.toFixed(2) + "x";
        d.style.color = "var(--error)";
        const boom = document.getElementById('boom-fx');
        boom.style.left = document.getElementById('camel-wrap').style.left;
        boom.style.display = "block";
        document.getElementById('camel-wrap').style.opacity = "0";
        document.getElementById('action-btn').innerText = "انفجر!";
        document.getElementById('action-btn').className = "main-btn btn-waiting";
        
        addLocalHistory(cp);
        saveRound(cp);
        userInRace = false; betPlaced = false; cashed = false;
    }

    function handleAction() {
        if (gameState === "WAITING") betPlaced = !betPlaced;
        else if (userInRace && !cashed) doCashout(currentMult);
    }

    function joinRace() {
        currentBet = parseFloat(document.getElementById('bet-amount').value);
        if (user.balance >= currentBet) {
            userInRace = true; cashed = false; betPlaced = false;
            user.balance -= currentBet; updateUI(); saveBalance();
            
            // إرسال رهانك للآخرين
            gameChannel.send({
                type: 'broadcast',
                event: 'player_bet',
                payload: { username: user.username, amount: currentBet }
            });
        }
    }

    function doCashout(m) {
        if (cashed || !userInRace) return;
        cashed = true;
        let profit = currentBet * m;
        user.balance += profit;
        updateUI(); saveBalance();
        document.getElementById('action-btn').innerText = "تم السحب ✅";
        document.getElementById('action-btn').className = "main-btn btn-waiting";

        // إرسال السحب للآخرين
        gameChannel.send({
            type: 'broadcast',
            event: 'player_cashout',
            payload: { username: user.username, multiplier: m.toFixed(2), win: profit.toFixed(2) }
        });
    }

    // دوال إدارة واجهة المراهنين الآخرين
    function addLiveBetUI(data) {
        const container = document.getElementById('bets-container');
        const row = document.createElement('div');
        row.className = 'bet-row';
        row.id = `bet-${data.username}`;
        row.innerHTML = `
            <span>${data.username}</span>
            <span>💰${data.amount}</span>
            <span class="win-val">-</span>
        `;
        container.prepend(row);
    }

    function updateLiveBetUI(data) {
        const row = document.getElementById(`bet-${data.username}`);
        if (row) {
            row.classList.add('cashed');
            row.querySelector('.win-val').innerText = `${data.multiplier}x (+${data.win})`;
        }
    }

    function updateUI() { document.getElementById('balance').innerText = user.balance.toFixed(2); document.getElementById('player-display').innerText = user.username; }

    function addLocalHistory(v) {
        const val = parseFloat(v).toFixed(2);
        localHistory.unshift(val);
        if (localHistory.length > 10) localHistory.pop();
        renderHistoryUI();
    }

    async function syncHistory() {
        try {
            const { data } = await supabaseClient.from('GameHistory').select('crash_point').order('created_at', { ascending: false }).limit(10);
            if (data) {
                localHistory = data.map(r => r.crash_point.toFixed(2));
                renderHistoryUI();
            }
        } catch(e) {}
    }

    function renderHistoryUI() {
        const list = document.getElementById('history-list');
        list.innerHTML = localHistory.map(v => `<div class="history-item ${parseFloat(v) < 2 ? 'hist-crash' : ''}">${v}x</div>`).join('');
    }

    async function saveRound(p) { await supabaseClient.rpc('add_crash_record', { crash_val: p }); }
    async function saveBalance() { await supabaseClient.from('Profiles').update({ balance: user.balance }).eq('id', user.id); }
</script>
</body>
</html>
