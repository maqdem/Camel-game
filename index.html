<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن العالمي | Camel Dash Pro</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 420px; background: var(--card); padding: 25px; border-radius: 30px; border: 1px solid #2d333b; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        
        .shake { animation: shakeAnim 0.4s ease-in-out; }
        @keyframes shakeAnim { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }

        .auth-container h2 { color: var(--accent); margin-bottom: 20px; text-align: center; }
        .input-field { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #333; background: #12191f; color: white; margin-bottom: 15px; font-size: 16px; text-align: center; outline: none; }
        .input-field:focus { border-color: var(--accent); }
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: #2d333b; border-radius: 8px; cursor: pointer; border: none; color: white; font-weight: bold; }
        .tab-btn.active { background: var(--accent); color: #000; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .balance-box { background: rgba(255, 204, 0, 0.15); padding: 10px 18px; border-radius: 14px; border: 1px solid var(--gold); color: var(--gold); font-weight: 900; font-size: 18px; transition: 0.3s; }
        .win-glow { box-shadow: 0 0 20px var(--accent); transform: scale(1.05); }

        #main-timer { font-size: 90px; font-weight: 900; color: var(--gold); text-align: center; text-shadow: 0 0 20px rgba(255,204,0,0.3); }
        .multiplier { font-size: 80px; font-weight: 900; color: var(--accent); display: none; text-align: center; }
        
        .track { height: 140px; background: #12191f; border-radius: 20px; position: relative; overflow: hidden; border: 2px solid #2d333b; margin: 15px 0; background-image: linear-gradient(90deg, transparent 45%, rgba(255,255,255,0.03) 50%); background-size: 60px 100%; }
        .camel-wrapper { position: absolute; bottom: 15px; left: 0; transition: left 0.1s linear; z-index: 5; display: flex; align-items: center; }
        .camel { font-size: 55px; transform: scaleX(-1); }
        .dust { position: absolute; bottom: 5px; left: -10px; width: 20px; height: 10px; background: rgba(255,255,255,0.1); border-radius: 50%; filter: blur(5px); display: none; }

        .explosion { position: absolute; width: 100px; height: 100px; background: radial-gradient(circle, #ffcc00, #ff4b4b, transparent); border-radius: 50%; display: none; z-index: 6; animation: explode 0.5s ease-out; }
        @keyframes explode { 0% { transform: scale(0.1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

        .controls { background: #0d1117; padding: 20px; border-radius: 22px; display: flex; flex-direction: column; gap: 12px; }
        .input-row { display: flex; gap: 10px; }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 12px; color: #888; }
        .field-small { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #333; background: #12191f; color: white; text-align: center; font-weight: bold; outline: none; }

        /* زر السحب التلقائي المطور */
        .auto-cash-control { display: flex; gap: 5px; }
        .toggle-btn { padding: 0 15px; border-radius: 10px; border: 2px solid #333; background: #2d333b; color: #888; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.3s; display: flex; align-items: center; }
        .toggle-btn.active { background: var(--accent); border-color: var(--accent); color: #000; }

        button.main-btn { width: 100%; padding: 18px; border-radius: 16px; border: none; font-size: 20px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cashout { background: var(--error); color: white; }
        .btn-waiting { background: #222; color: #555; pointer-events: none; }

        .live-bets { margin-top: 10px; font-size: 12px; background: rgba(0,0,0,0.2); border-radius: 15px; padding: 10px; }
        .bet-row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #222; }

        .history-list { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; flex-direction: row-reverse; scrollbar-width: none; min-height: 45px; }
        .history-item { min-width: 65px; padding: 8px; border-radius: 10px; background: #12191f; color: var(--accent); border: 1px solid rgba(0,255,136,0.2); font-size: 13px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <div id="auth-screen" class="auth-container">
        <h2>سباق الهجن العالمي 🐪</h2>
        <div class="auth-tabs">
            <button class="tab-btn active" id="login-tab" onclick="switchAuth('login')">تسجيل دخول</button>
            <button class="tab-btn" id="signup-tab" onclick="switchAuth('signup')">تسجيل جديد</button>
        </div>
        <input type="text" id="username" class="input-field" placeholder="اسم المستخدم">
        <input type="password" id="password" class="input-field" placeholder="كلمة المرور">
        <button class="main-btn btn-bet" id="auth-submit" onclick="processAuth()">ابدأ اللعب الآن</button>
    </div>

    <div id="game-screen" style="display:none;">
        <div class="header">
            <span id="player-display" style="opacity: 0.7;">---</span>
            <div id="bal-box" class="balance-box">💰 <span id="balance">0.00</span></div>
        </div>

        <div id="main-timer">5</div>
        <div id="mult-display" class="multiplier">1.00x</div>
        
        <div class="track" id="track-box">
            <div id="camel-wrap" class="camel-wrapper">
                <div class="camel">🐪</div>
                <div id="dust-fx" class="dust"></div>
            </div>
            <div id="boom-fx" class="explosion"></div>
        </div>

        <div class="controls">
            <div class="input-row">
                <div class="input-group">
                    <label>الرهان</label>
                    <input type="number" id="bet-amount" class="field-small" value="10" min="1">
                </div>
                <div class="input-group">
                    <label>سحب تلقائي</label>
                    <div class="auto-cash-control">
                        <input type="number" id="auto-cashout" class="field-small" value="2.00" min="1.01" step="0.01">
                        <button id="auto-toggle" class="toggle-btn" onclick="toggleAuto()">OFF</button>
                    </div>
                </div>
            </div>
            <button id="action-btn" class="main-btn btn-bet" onclick="handleAction()">وضع رهان</button>
        </div>

        <div class="live-bets">
            <div id="live-bets-list"></div>
        </div>

        <div id="history-list" class="history-list"></div>
    </div>
</div>

<script>
    const CONF = { URL: 'https://uqmfwgdrlcqywxvdljlb.supabase.co', KEY: 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT' };
    const supabaseClient = supabase.createClient(CONF.URL, CONF.KEY);

    let user = null, betPlaced = false, userInRace = false, cashed = false, currentBet = 0, bgPos = 0, roundActive = false, autoEnabled = false;
    let roundData = { status: 'wait', startTime: Date.now(), crashAt: 2.0 };
    
    function toggleAuto() {
        autoEnabled = !autoEnabled;
        const btn = document.getElementById('auto-toggle');
        btn.classList.toggle('active', autoEnabled);
        btn.innerText = autoEnabled ? 'ON' : 'OFF';
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, duration) {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        } catch(e){}
    }

    function switchAuth(mode) {
        document.getElementById('login-tab').classList.toggle('active', mode === 'login');
        document.getElementById('signup-tab').classList.toggle('active', mode === 'signup');
        document.getElementById('auth-submit').innerText = mode === 'login' ? 'دخول' : 'إنشاء حساب';
        window.authMode = mode;
    }

    async function processAuth() {
        const u = document.getElementById('username').value, p = document.getElementById('password').value;
        if (u.length < 3) return alert("الاسم قصير!");
        if (window.authMode === 'signup') {
            const { data: n } = await supabaseClient.from('Profiles').insert([{ username: u, password: p, balance: 100.00 }]).select().single();
            if (n) launch(n);
        } else {
            const { data } = await supabaseClient.from('Profiles').select('*').eq('username', u).eq('password', p).maybeSingle();
            if (data) launch(data); else alert("خطأ في البيانات");
        }
    }

    function launch(profile) {
        user = profile;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        updateUI(); syncHistory(); 
        setupRealtime();
        engineLoop();
    }

    function setupRealtime() {
        supabaseClient.channel('game-room')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'GameHistory' }, payload => {
                triggerCrashLocally(payload.new.crash_point);
            }).subscribe();
    }
