<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Ahoul - النسخة المستقرة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00ff88; --danger: #ff4d4d; --bg: #0b0e14; --card: #161b22; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; overflow-x: hidden; }
        .container { max-width: 420px; margin: auto; background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* شاشة السباق */
        .game-view { height: 240px; background: linear-gradient(180deg, #0d1117 0%, #161b22 100%); position: relative; overflow: hidden; border-bottom: 3px solid #f08a1d; }
        .moon-icon { position: absolute; top: 20px; right: 30px; font-size: 30px; opacity: 0.5; }
        #mult-text { position: absolute; top: 25%; left: 50%; transform: translateX(-50%); font-size: 55px; font-weight: 800; color: var(--primary); z-index: 10; text-shadow: 0 0 20px rgba(0,255,136,0.3); }

        /* الجمل المطور SVG */
        .camel-wrap { position: absolute; left: 10%; bottom: 15px; width: 100px; transform: scaleX(-1); transition: left 0.1s linear; }
        .leg { stroke: #d97706; stroke-width: 7; stroke-linecap: round; }
        .running .leg-front { animation: legMove 0.25s infinite alternate; transform-origin: top; }
        .running .leg-back { animation: legMove 0.25s infinite alternate-reverse; transform-origin: top; }
        @keyframes legMove { from { transform: rotate(-25deg); } to { transform: rotate(25deg); } }
        
        /* الأزرار والمدخلات */
        .controls { padding: 20px; background: #0d1117; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        input { background: #161b22; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 10px; text-align: center; font-size: 16px; width: 100%; box-sizing: border-box; }
        button { grid-column: span 2; padding: 16px; border-radius: 12px; border: none; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.2s; }
        .run-btn { background: var(--primary); color: #000; }
        .cash-btn { background: var(--danger); color: white; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        /* حالة المستخدم */
        .user-bar { padding: 12px 15px; display: flex; justify-content: space-between; font-size: 14px; background: #0d1117; border-bottom: 1px solid #30363d; }
    </style>
</head>
<body>

<div id="login-page" style="text-align:center; padding-top:100px;">
    <h2 style="color:var(--primary)">Bet Ahoul</h2>
    <input type="text" id="user-in" placeholder="اسم المستخدم" style="max-width:300px; margin-bottom:10px;"><br>
    <input type="password" id="pass-in" placeholder="كلمة السر" style="max-width:300px;"><br>
    <button onclick="doLogin()" class="run-btn" style="max-width:300px; margin-top:10px;">دخول</button>
</div>

<div id="game-page" class="container" style="display:none;">
    <div class="user-bar">
        <span id="u-name"></span>
        <span style="color:#e3b341">💰 <span id="u-bal">0</span></span>
    </div>

    <div class="game-view">
        <div class="moon-icon">🌙</div>
        <div id="mult-text">1.00x</div>
        
        <div id="camel-id" class="camel-wrap">
            <svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
                <line class="leg leg-back" x1="40" y1="60" x2="35" y2="85" />
                <line class="leg leg-front" x1="80" y1="60" x2="85" y2="85" />
                <path d="M20 60 Q 50 10 80 60 L 100 60 Q 115 60 110 30" fill="#f59e0b" />
                <path d="M110 30 Q 115 5 125 15" stroke="#f59e0b" stroke-width="10" fill="none" stroke-linecap="round"/>
                <circle cx="125" cy="15" r="7" fill="#f59e0b"/>
                <circle cx="127" cy="13" r="1.5" fill="black"/>
            </svg>
        </div>
    </div>

    <div class="controls">
        <input type="number" id="bet-val" value="100">
        <input type="number" id="guess-val" value="2.0">
        <button id="action-btn" onclick="play()" class="run-btn">Run</button>
    </div>
</div>

<script>
    const S_URL = 'https://uqmfwgdrlcqywxvdljlb.supabase.co';
    const S_KEY = 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT';
    let _s, bal, user, timer, m = 1.0;

    // تهيئة Supabase عند التحميل لضمان الاستجابة
    window.onload = () => { _s = supabase.createClient(S_URL, S_KEY); };

    async function doLogin() {
        const u = document.getElementById('user-in').value;
        const p = document.getElementById('pass-in').value;
        const { data, error } = await _s.from('Profiles').select('*').eq('username', u.trim()).eq('password', p.trim()).single();
        
        if (data) {
            user = data.username; bal = data.balance;
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('game-page').style.display = 'block';
            sync();
        } else alert("خطأ في الدخول");
    }

    function sync() {
        document.getElementById('u-name').innerText = user;
        document.getElementById('u-bal').innerText = Math.floor(bal);
    }

    function play() {
        const btn = document.getElementById('action-btn');
        if (btn.innerText === "Run") start(); else cash();
    }

    function start() {
        let b = parseFloat(document.getElementById('bet-val').value);
        if (b > bal) return alert("الرصيد ضعيف");
        bal -= b; sync();

        m = 1.0;
        let crash = (Math.random() * 5 + 1.1).toFixed(2);
        const camel = document.getElementById('camel-id');
        const btn = document.getElementById('action-btn');

        btn.innerText = "Cash Out";
        btn.className = "cash-btn";
        camel.classList.add('running');

        timer = setInterval(() => {
            m = parseFloat((m + 0.05).toFixed(2));
            document.getElementById('mult-text').innerText = m + "x";
            camel.style.left = Math.min(10 + (m * 10), 80) + "%";
            if (m >= crash) stop(false);
        }, 100);
    }

    async function cash() {
        clearInterval(timer);
        let win = m * parseFloat(document.getElementById('bet-val').value);
        bal += win; sync();
        await _s.from('Profiles').update({ balance: Math.floor(bal) }).eq('username', user);
        stop(true);
    }

    function stop(win) {
        clearInterval(timer);
        const camel = document.getElementById('camel-id');
        const btn = document.getElementById('action-btn');
        camel.classList.remove('running');
        if(!win) document.getElementById('mult-text').style.color = "var(--danger)";
        btn.disabled = true;
        setTimeout(() => {
            btn.disabled = false;
            btn.innerText = "Run";
            btn.className = "run-btn";
            document.getElementById('mult-text').style.color = "var(--primary)";
            camel.style.left = "10%";
        }, 2000);
    }
</script>
</body>
</html>
