<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن - النسخة الاحترافية الموحدة</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-y: auto; padding: 20px 0; }
        .app-container { width: 95%; max-width: 420px; background: var(--card); padding: 20px; border-radius: 24px; border: 1px solid #2d333b; text-align: center; position: relative; }
        
        #main-timer { font-size: 80px; font-weight: 900; color: var(--gold); margin: 20px 0; }
        .multiplier { font-size: 65px; font-weight: 900; color: var(--accent); margin: 15px 0; display: none; }
        
        .track { height: 120px; background: #12191f; border-radius: 18px; position: relative; overflow: hidden; border: 2px solid #2d333b; margin: 15px 0; }
        .camel { position: absolute; bottom: 10px; left: 0; font-size: 50px; transition: left 0.1s linear; z-index: 2; }
        
        .controls { background: #0d1117; padding: 15px; border-radius: 18px; margin-bottom: 20px; }
        .input-field { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #1c262d; color: white; text-align: center; font-size: 18px; box-sizing: border-box; }
        
        button { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 20px; font-weight: 900; cursor: pointer; transition: 0.2s; position: relative; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cancel { background: #444; color: white; }
        .btn-cashout { background: var(--error); color: white; display: flex; flex-direction: column; line-height: 1.2; }
        .btn-waiting { background: #222; color: #555; cursor: not-allowed; }

        .balance-container { color: var(--gold); font-weight: bold; font-size: 18px; }
        .balance-up { animation: pulse 0.5s ease-in-out; color: var(--accent) !important; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        /* سجل الجولات السابقة */
        .history-section { text-align: right; margin-top: 10px; border-top: 1px solid #2d333b; padding-top: 15px; }
        .history-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .history-item { padding: 6px; border-radius: 8px; font-weight: bold; font-size: 13px; background: #12191f; text-align: center; border: 1px solid rgba(0,255,136,0.2); color: var(--accent); }
        .hist-crash { color: var(--error); border-color: rgba(255,75,75,0.2); }

        /* أنيميشن ربحت! */
        .win-badge { position: absolute; background: var(--accent); color: black; padding: 5px 15px; border-radius: 10px; font-weight: bold; font-size: 18px; animation: popUp 1s forwards; z-index: 10; left: 50%; transform: translateX(-50%); }
        @keyframes popUp { 0% { bottom: 50px; opacity: 1; } 100% { bottom: 100px; opacity: 0; } }
    </style>
</head>
<body>

<div class="app-container">
    <div id="auth-screen">
        <h2>تسجيل الدخول 🐪</h2>
        <input type="text" id="username" class="input-field" placeholder="اسم المستخدم">
        <input type="password" id="password" class="input-field" placeholder="كلمة السر">
        <button class="btn-bet" onclick="handleLogin()">دخول</button>
    </div>

    <div id="game-screen" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span id="player-name" style="color: #888;">Admin</span>
            <div id="balance-wrap" class="balance-container">💰 <span id="player-balance">0.00</span></div>
        </div>

        <div id="main-timer">5</div>
        <div id="mult-display" class="multiplier">1.00x</div>
        
        <div class="track" id="track">
            <div id="camel" class="camel">🐪</div>
        </div>

        <div class="controls">
            <input type="number" id="bet-amount" class="input-field" value="10">
            <button id="action-btn" class="btn-bet" onclick="handleAction()">رهان</button>
        </div>

        <div class="history-section">
            <span style="font-size: 12px; color:#888;">الجولات السابقة:</span>
            <div id="history-list" class="history-list"></div>
        </div>
    </div>
</div>

<script>
    const CONF = { URL: 'https://uqmfwgdrlcqywxvdljlb.supabase.co', KEY: 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT' };
    const supabaseClient = supabase.createClient(CONF.URL, CONF.KEY);

    let user = null, betPlaced = false, userInBet = false, hasCashedOut = false;
    let crashPoint = 0, lastBetAmount = 0, lastLoggedRound = -1;
    const CYCLE_TIME = 20; // الدورة الإجمالية: 5 ثوانٍ عد تنازلي + 15 ثانية سباق كحد أقصى

    window.onload = () => {
        const saved = localStorage.getItem('global_history');
        if (saved) document.getElementById('history-list').innerHTML = saved;
    };

    async function handleLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        const { data } = await supabaseClient.from('Profiles').select('*').eq('username', u).eq('password', p).maybeSingle();
        if (data) {
            user = data;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            updateUI();
            startEngine();
        } else { alert("بيانات الدخول خاطئة"); }
    }

    function updateUI() {
        document.getElementById('player-balance').innerText = parseFloat(user.balance).toFixed(2);
    }

    function startEngine() {
        setInterval(() => {
            const now = Date.now() / 1000;
            const cyclePos = now % CYCLE_TIME;
            const roundId = Math.floor(now / CYCLE_TIME);
            
            // حساب رقم التحطم الموحد لهذه الجولة
            crashPoint = generateGlobalCrash(roundId);

            if (cyclePos < 5) {
                renderWaiting(Math.ceil(5 - cyclePos));
                lastLoggedRound = roundId - 1; // السماح بتسجيل الجولة فور انتهائها
            } else {
                renderRacing(cyclePos - 5, roundId);
            }
        }, 100);
    }

    function generateGlobalCrash(seed) {
        let h = Math.abs(Math.sin(seed) * 10000);
        let r = h - Math.floor(h);
        return parseFloat((98 / (100 - (r * 100) * 0.99)).toFixed(2));
    }

    function renderWaiting(sec) {
        document.getElementById('main-timer').style.display = 'block';
        document.getElementById('mult-display').style.display = 'none';
        document.getElementById('main-timer').innerText = sec;
        document.getElementById('camel').style.left = "0%";
        hasCashedOut = false; userInBet = false;
        if (!betPlaced) updateButton("رهان للسباق القادم", "btn-bet");
        else updateButton("إلغاء الرهان", "btn-cancel");
    }

    function renderRacing(elapsed, roundId) {
        document.getElementById('main-timer').style.display = 'none';
        document.getElementById('mult-display').style.display = 'block';
        
        const currentMult = Math.pow(Math.E, 0.08 * elapsed);

        if (currentMult >= crashPoint) {
            // حالة الانفجار
            document.getElementById('mult-display').innerText = crashPoint.toFixed(2) + "x";
            document.getElementById('mult-display').style.color = "var(--error)";
            updateButton("انتهى السباق", "btn-waiting");
            
            // إضافة للسجل مرة واحدة فقط لكل جولة
            if (lastLoggedRound !== roundId) {
                addToHistory(crashPoint.toFixed(2));
                lastLoggedRound = roundId;
                betPlaced = false; userInBet = false;
            }
        } else {
            // حالة الجري
            document.getElementById('mult-display').innerText = currentMult.toFixed(2) + "x";
            document.getElementById('mult-display').style.color = "var(--accent)";
            document.getElementById('camel').style.left = Math.min((currentMult - 1) * 25, 85) + "%";

            if (betPlaced && !userInBet) {
                userInBet = true; betPlaced = false;
                lastBetAmount = parseFloat(document.getElementById('bet-amount').value);
                user.balance -= lastBetAmount; updateUI();
            }

            if (userInBet && !hasCashedOut) {
                let currentWin = (lastBetAmount * currentMult).toFixed(2);
                updateButton("سحب الأرباح", "btn-cashout", `اربح الآن: ${currentWin} 💰`);
            }
        }
    }

    function handleAction() {
        if (document.getElementById('main-timer').style.display === 'block') {
            const amt = parseFloat(document.getElementById('bet-amount').value);
            if (!betPlaced) {
                if (amt > user.balance || amt <= 0) return alert("رصيد ناقص");
                betPlaced = true;
            } else { betPlaced = false; }
        } else if (userInBet && !hasCashedOut) {
            cashOut();
        }
    }

    function cashOut() {
        hasCashedOut = true;
        const mult = parseFloat(document.getElementById('mult-display').innerText);
        const winAmount = lastBetAmount * mult;
        
        // أنيميشن ربحت!
        showWinBadge(lastBetAmount);
        
        user.balance += winAmount;
        updateUI(); updateDB();
        updateButton("تم السحب", "btn-waiting");
    }

    function showWinBadge(amt) {
        const badge = document.createElement('div');
        badge.className = 'win-badge';
        badge.innerText = `ربحت ${Math.floor(amt)}!`;
        document.getElementById('track').appendChild(badge);
        document.getElementById('balance-wrap').classList.add('balance-up');
        setTimeout(() => {
            badge.remove();
            document.getElementById('balance-wrap').classList.remove('balance-up');
        }, 1000);
    }

    function addToHistory(val) {
        const list = document.getElementById('history-list');
        const item = document.createElement('div');
        item.className = `history-item ${val < 2 ? 'hist-crash' : ''}`;
        item.innerText = val + 'x';
        if (list.children.length >= 12) list.removeChild(list.lastChild);
        list.insertBefore(item, list.firstChild);
        localStorage.setItem('global_history', list.innerHTML);
    }

    function updateButton(text, cls, sub = "") {
        const btn = document.getElementById('action-btn');
        btn.className = cls;
        btn.innerHTML = sub ? `<span>${text}</span><br><small style="font-size:11px;">${sub}</small>` : text;
    }

    async function updateDB() {
        await supabaseClient.from('Profiles').update({ balance: user.balance }).eq('id', user.id);
    }
</script>
</body>
</html>
