<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن العالمي | Pro Version</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 420px; background: var(--card); padding: 25px; border-radius: 30px; border: 1px solid #2d333b; position: relative; }
        
        /* انميشن الاهتزاز */
        .shake { animation: shakeAnim 0.3s linear; }
        @keyframes shakeAnim { 0% { transform: translate(2px, 1px); } 50% { transform: translate(-2px, -1px); } 100% { transform: translate(0); } }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .balance-box { background: rgba(255, 204, 0, 0.15); padding: 10px 18px; border-radius: 14px; border: 1px solid var(--gold); color: var(--gold); font-weight: 900; font-size: 18px; }

        #main-timer { font-size: 80px; font-weight: 900; color: var(--gold); text-align: center; }
        .multiplier { font-size: 70px; font-weight: 900; color: var(--accent); display: none; text-align: center; }
        
        .track { 
            height: 140px; background: #12191f; border-radius: 20px; position: relative; overflow: hidden; border: 2px solid #2d333b; margin: 15px 0;
            background-image: linear-gradient(90deg, transparent 45%, rgba(255,255,255,0.03) 50%); background-size: 60px 100%;
        }
        
        .camel-wrapper { position: absolute; bottom: 15px; left: 0; z-index: 5; display: flex; align-items: center; transition: left 0.2s linear; }
        .camel { font-size: 50px; transform: scaleX(-1); }
        .dust { position: absolute; bottom: 5px; left: -5px; width: 15px; height: 8px; background: rgba(255,255,255,0.08); border-radius: 50%; filter: blur(4px); display: none; }

        .explosion { position: absolute; width: 80px; height: 80px; background: radial-gradient(circle, #ffcc00, #ff4b4b, transparent); border-radius: 50%; display: none; z-index: 6; animation: explode 0.4s forwards; }
        @keyframes explode { 0% { transform: scale(0.1); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }

        .controls { background: #0d1117; padding: 20px; border-radius: 22px; display: flex; flex-direction: column; gap: 12px; }
        .input-row { display: flex; gap: 10px; }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .field-small { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #333; background: #12191f; color: white; text-align: center; font-weight: bold; outline: none; }

        button.main-btn { width: 100%; padding: 18px; border-radius: 16px; border: none; font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cashout { background: var(--error); color: white; }
        .btn-waiting { background: #222; color: #555; pointer-events: none; }

        .history-list { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; flex-direction: row-reverse; scrollbar-width: none; }
        .history-item { min-width: 60px; padding: 6px; border-radius: 8px; background: #12191f; color: var(--accent); border: 1px solid rgba(0,255,136,0.1); font-size: 12px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <div id="auth-screen" style="padding: 20px;">
        <h2 style="text-align:center; color:var(--accent);">دخول السباق 🐪</h2>
        <input type="text" id="username" class="field-small" placeholder="اسم المستخدم" style="margin-bottom:10px;">
        <input type="password" id="password" class="field-small" placeholder="كلمة المرور" style="margin-bottom:15px;">
        <button class="main-btn btn-bet" onclick="processAuth()">ابدأ اللعب</button>
    </div>

    <div id="game-screen" style="display:none;">
        <div class="header">
            <span id="player-display">---</span>
            <div class="balance-box">💰 <span id="balance">0.00</span></div>
        </div>

        <div id="main-timer">5</div>
        <div id="mult-display" class="multiplier">1.00x</div>
        
        <div class="track" id="track-box">
            <div id="camel-wrap" class="camel-wrapper">
                <div class="camel">🐪</div>
                <div id="dust-fx" class="dust"></div>
            </div>
            <div id="boom-fx" class="explosion"></div>
        </div>

        <div class="controls">
            <div class="input-row">
                <div class="input-group">
                    <label style="font-size:10px; color:#888;">الرهان</label>
                    <input type="number" id="bet-amount" class="field-small" value="10">
                </div>
                <div class="input-group">
                    <label style="font-size:10px; color:#888;">سحب تلقائي</label>
                    <input type="number" id="auto-cashout" class="field-small" value="2.00">
                </div>
            </div>
            <button id="action-btn" class="main-btn btn-bet" onclick="handleAction()">وضع رهان</button>
        </div>
        <div id="history-list" class="history-list"></div>
    </div>
</div>

<script>
    const CONF = { URL: 'https://uqmfwgdrlcqywxvdljlb.supabase.co', KEY: 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT' };
    const supabaseClient = supabase.createClient(CONF.URL, CONF.KEY);

    let user = null, betPlaced = false, userInRace = false, cashed = false, currentBet = 0, bgPos = 0;
    const CYCLE = 20, WAIT = 5;

    // --- المحرك الرئيسي ---
    async function processAuth() {
        const u = document.getElementById('username').value;
        const { data } = await supabaseClient.from('Profiles').select('*').eq('username', u).maybeSingle();
        if (data) { user = data; launch(); } else alert("المستخدم غير موجود");
    }

    function launch() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        updateUI(); syncHistory(); startEngine();
    }

    function startEngine() {
        setInterval(() => {
            const now = Date.now() / 1000, pos = now % CYCLE, roundId = Math.floor(now / CYCLE);
            
            // حساب نقطة الانفجار بشكل ثابت لكل جولة
            let r = Math.abs(Math.sin(roundId * 987.654) * 10000) % 1;
            const crashAt = Math.min(parseFloat((0.99 / (1 - r * 0.99)).toFixed(2)), 500);

            if (pos < WAIT) {
                renderWait(Math.ceil(WAIT - pos));
                window.isLogged = false;
            } else {
                const elapsed = pos - WAIT;
                const mult = Math.pow(1.15, elapsed);

                // تم إصلاح الخطأ: الانفجار يحدث بناءً على الوقت المحسوب أو تجاوز القيمة
                if (mult >= crashAt) {
                    if (!window.isLogged) { 
                        renderCrash(crashAt);
                        saveRound(crashAt.toFixed(2)); 
                        window.isLogged = true; 
                    }
                } else {
                    renderRace(mult, elapsed);
                    if (userInRace && !cashed) {
                        const auto = parseFloat(document.getElementById('auto-cashout').value);
                        if (mult >= auto) doCashout(auto);
                    }
                    if (betPlaced && !userInRace) joinRace();
                }
            }
        }, 50);
    }

    function renderWait(s) {
        document.getElementById('main-timer').style.display = 'block';
        document.getElementById('mult-display').style.display = 'none';
        document.getElementById('main-timer').innerText = s;
        document.getElementById('camel-wrap').style.left = "0%";
        document.getElementById('camel-wrap').style.opacity = "1";
        document.getElementById('boom-fx').style.display = "none";
        updateBtn(betPlaced ? "تم تجهيز الرهان" : "وضع رهان", betPlaced ? "btn-waiting" : "btn-bet");
    }

    function renderRace(m, e) {
        document.getElementById('main-timer').style.display = 'none';
        const d = document.getElementById('mult-display');
        d.style.display = 'block'; d.innerText = m.toFixed(2) + "x";
        d.style.color = "var(--accent)";
        
        // إصلاح الحركة: أبطأ ولا يصطدم بالحافة (حد أقصى 60%)
        document.getElementById('camel-wrap').style.left = Math.min(e * 3.5, 60) + "%";
        document.getElementById('dust-fx').style.display = "block";
        
        bgPos -= (1 + m * 0.5); 
        document.getElementById('track-box').style.backgroundPosition = bgPos + "px 0px";
        
        if (userInRace && !cashed) updateBtn("سحب الأرباح", "btn-cashout", (m * currentBet).toFixed(2));
    }

    function renderCrash(cp) {
        const d = document.getElementById('mult-display');
        d.innerText = cp.toFixed(2) + "x";
        d.style.color = "var(--error)";
        
        const boom = document.getElementById('boom-fx');
        boom.style.left = document.getElementById('camel-wrap').style.left;
        boom.style.display = "block";
        document.getElementById('camel-wrap').style.opacity = "0";
        document.getElementById('app').classList.add('shake');
        setTimeout(() => document.getElementById('app').classList.remove('shake'), 300);

        updateBtn("انفجر الجمل!", "btn-waiting");
        userInRace = false; betPlaced = false;
    }

    function handleAction() {
        const pos = (Date.now() / 1000) % CYCLE;
        if (pos < WAIT) betPlaced = !betPlaced;
        else if (userInRace && !cashed) doCashout(parseFloat(document.getElementById('mult-display').innerText));
    }

    function joinRace() {
        currentBet = parseFloat(document.getElementById('bet-amount').value);
        if (user.balance >= currentBet) {
            userInRace = true; cashed = false; betPlaced = false;
            user.balance -= currentBet; updateUI(); saveBalance();
        }
    }

    function doCashout(m) {
        if (cashed || !userInRace) return;
        cashed = true;
        user.balance += (currentBet * m);
        updateUI(); saveBalance();
        updateBtn("تم السحب ✅", "btn-waiting");
    }

    function updateUI() {
        document.getElementById('balance').innerText = user.balance.toFixed(2);
        document.getElementById('player-display').innerText = user.username;
    }

    function updateBtn(t, c, s="") {
        const b = document.getElementById('action-btn'); b.className = `main-btn ${c}`;
        b.innerHTML = s ? `<span>${t}</span><br><small>💰 ${s}</small>` : t;
    }

    async function saveRound(p) { pushUIHist(p); await supabaseClient.rpc('add_crash_record', { crash_val: parseFloat(p) }); }
    async function syncHistory() {
        const { data } = await supabaseClient.from('GameHistory').select('crash_point').order('created_at', { ascending: false }).limit(10);
        if (data) data.forEach(r => pushUIHist(r.crash_point.toFixed(2)));
    }
    function pushUIHist(v) {
        const l = document.getElementById('history-list'); const i = document.createElement('div');
        i.className = 'history-item'; i.innerText = v + 'x';
        l.insertBefore(i, l.firstChild); if (l.children.length > 10) l.removeChild(l.lastChild);
    }
    async function saveBalance() { await supabaseClient.from('Profiles').update({ balance: user.balance }).eq('id', user.id); }
</script>
</body>
</html>
