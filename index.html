<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Camel Dash Pro – Ultimate</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
:root{
--bg:#0b141a;--card:#1c262d;--accent:#00ff88;
--danger:#ff4b4b;--gold:#ffcc00;--text:#e1e1e1
}
*{box-sizing:border-box;font-family:system-ui}
body{
margin:0;background:var(--bg);color:var(--text);
display:flex;justify-content:center;align-items:center;
min-height:100vh
}
.app{width:100%;max-width:420px;
background:var(--card);padding:20px;
border-radius:24px;border:1px solid #333}

h2{text-align:center;color:var(--accent)}

input,button{
width:100%;padding:14px;border-radius:14px;
border:none;margin-bottom:10px;font-size:16px
}
input{background:#12191f;color:#fff;border:1px solid #333}

button{font-weight:900;cursor:pointer}
.btn-main{background:var(--accent);color:#000}
.btn-danger{background:var(--danger);color:#fff}
.btn-wait{background:#222;color:#555}

.header{
display:flex;justify-content:space-between;
align-items:center;margin-bottom:10px
}
.balance{
background:rgba(255,204,0,.15);
border:1px solid var(--gold);
padding:6px 14px;border-radius:14px;
color:var(--gold);font-weight:900
}

#timer,#mult{
text-align:center;font-size:64px;
font-weight:900;margin:10px 0
}
#mult{display:none}

.track{
height:140px;background:#12191f;
border-radius:20px;overflow:hidden;
position:relative;border:2px solid #333
}
.camel{
position:absolute;bottom:10px;left:0;
font-size:60px;
animation:run .4s infinite alternate
}
@keyframes run{
from{transform:translateY(0)}
to{transform:translateY(-4px)}
}

.popup{
position:absolute;font-size:24px;
font-weight:900;color:var(--accent);
animation:fly 1.4s forwards
}
@keyframes fly{
0%{opacity:0;transform:translateY(0)}
20%{opacity:1}
100%{opacity:0;transform:translateY(-120px)}
}

.panel{margin-top:10px}

.history{
display:flex;gap:6px;
overflow-x:auto;margin-top:10px
}
.hist{
padding:6px 10px;border-radius:10px;
background:#12191f;font-size:12px;
border:1px solid rgba(0,255,136,.3)
}
.low{color:var(--danger);border-color:rgba(255,75,75,.4)}

.small{font-size:12px;opacity:.7;text-align:center}
</style>
</head>

<body>
<div class="app">

<div id="auth">
<h2>🐪 Camel Dash Pro</h2>
<input id="user" placeholder="اسم المستخدم">
<input id="pass" type="password" placeholder="كلمة المرور">
<button class="btn-main" onclick="login()">دخول / تسجيل</button>
</div>

<div id="game" style="display:none">

<div class="header">
<span id="name"></span>
<div class="balance">💰 <span id="bal">0</span></div>
</div>

<div id="timer">5</div>
<div id="mult">1.00x</div>

<div class="track">
<div id="camel" class="camel">🐪</div>
</div>

<div class="panel">
<input id="bet" type="number" value="10" min="1">
<input id="auto" type="number" placeholder="Auto Cashout (اختياري)">
<button id="btn" class="btn-main" onclick="action()">وضع رهان</button>
</div>

<div class="history" id="history"></div>

<div class="small">
المستوى: <span id="lvl">1</span> |
XP: <span id="xp">0</span>
</div>

</div>
</div>

<script>
const sb=supabase.createClient(
'https://uqmfwgdrlcqywxvdljlb.supabase.co',
'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT'
)

let user=null,bet=0,joined=false,cashed=false
let xp=0,level=1
const WAIT=5,CYCLE=20

async function login(){
const u=user=document.getElementById('user').value
const p=document.getElementById('pass').value
let {data}=await sb.from('Profiles')
.select('*').eq('username',u).eq('password',p).maybeSingle()

if(!data){
let res=await sb.from('Profiles')
.insert([{username:u,password:p,balance:100,xp:0,level:1}])
.select().single()
data=res.data
}
start(data)
}

function start(d){
user=d;xp=d.xp||0;level=d.level||1
auth.style.display='none'
game.style.display='block'
updateUI()
engine()
}

function updateUI(){
name.innerText=user.username
bal.innerText=user.balance.toFixed(2)
xpEl=xp;lvl.innerText=level
xp.innerText=xp
}

function engine(){
setInterval(()=>{
let t=(Date.now()/1000)%CYCLE
let crash=getCrash(Math.floor(Date.now()/1000/CYCLE))

if(t<WAIT){
timer.style.display='block'
mult.style.display='none'
timer.innerText=Math.ceil(WAIT-t)
camel.style.left='0%'
btn.className='btn-main'
btn.innerText='وضع رهان'
joined=false;cashed=false
}else{
timer.style.display='none'
mult.style.display='block'
let m=Math.pow(1.15,t-WAIT)
mult.innerText=m.toFixed(2)+'x'
camel.style.left=Math.min((t-WAIT)*6,45)+'%'
if(joined&&!cashed){
btn.className='btn-danger'
btn.innerText='سحب'
let a=parseFloat(auto.value)
if(a&&m>=a)cash(m)
}
if(m>=crash&&!cashed){
mult.style.color='var(--danger)'
joined=false
addHist(crash)
}
}
},60)
}

function getCrash(id){
let r=Math.abs(Math.sin(id*999))*0.97
return Math.min((0.99/(1-r)),400)
}

function action(){
let t=(Date.now()/1000)%CYCLE
if(t<WAIT&&!joined){
bet=parseFloat(betInput.value)
if(user.balance<bet)return
user.balance-=bet
joined=true
updateUI()
}
else if(joined&&!cashed){
let m=parseFloat(mult.innerText)
cash(m)
}
}

function cash(m){
cashed=true
let win=bet*m
user.balance+=win
xp+=Math.floor(win/10)
if(xp>level*100){level++}
popup(win)
updateUI()
save()
}

function popup(v){
let p=document.createElement('div')
p.className='popup'
p.innerText='+'+v.toFixed(2)
camel.parentNode.appendChild(p)
p.style.left=camel.offsetLeft+'px'
setTimeout(()=>p.remove(),1400)
}

function addHist(v){
let h=document.createElement('div')
h.className='hist '+(v<2?'low':'')
h.innerText=v.toFixed(2)+'x'
history.prepend(h)
if(history.children.length>10)history.lastChild.remove()
}

async function save(){
await sb.from('Profiles')
.update({balance:user.balance,xp:xp,level:level})
.eq('id',user.id)
}
</script>
</body>
</html>
