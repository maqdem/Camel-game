<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سباق الهجن الاحترافي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --green: #22c55e; --red: #ef4444; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; overflow-x: hidden; }
        .card { background: var(--card); border-radius: 15px; padding: 15px; max-width: 450px; margin: auto; border: 1px solid #334155; position: relative; }
        
        .race-track { 
            height: 220px; background: linear-gradient(to bottom, #020617, #1e293b); 
            border-radius: 12px; position: relative; overflow: hidden; margin-bottom: 15px;
            border-bottom: 4px solid #c2914d;
        }

        /* الجمل المتحرك - SVG للأرجل */
        .camel-container {
            position: absolute; left: 10%; bottom: 20px; width: 80px; height: 80px;
            transform: scaleX(-1); /* جعل الجمل ينظر لليمين */
            transition: left 0.2s linear;
        }

        /* أنيميشن الركض للأرجل والجسم */
        .running .camel-body { animation: body-shake 0.3s infinite alternate; }
        @keyframes body-shake {
            from { transform: translateY(0) rotate(0deg); }
            to { transform: translateY(-10px) rotate(5deg); }
        }

        #multiplier { 
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            font-size: 50px; font-weight: 900; color: var(--green); z-index: 10; display: none;
            text-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
        }

        /* الغبار */
        .dust {
            position: absolute; bottom: 5px; right: -10px; font-size: 20px; opacity: 0;
        }
        .running .dust { animation: dust-move 0.3s infinite; }
        @keyframes dust-move {
            0% { transform: scale(0.5); opacity: 0.8; }
            100% { transform: scale(1.5) translateX(20px); opacity: 0; }
        }

        .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        input { background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; text-align: center; width: 100%; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 18px; transition: 0.2s; }
        .btn-go { background: var(--green); color: white; }
        .btn-stop { background: var(--red); color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .hist-table { width: 100%; margin-top: 20px; border-top: 1px solid #334155; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

<div id="login-ui" class="card" style="margin-top: 50px;">
    <h2>تسجيل الدخول</h2>
    <input type="text" id="u" placeholder="اسم المستخدم">
    <input type="password" id="p" placeholder="كلمة السر" style="margin-top:10px">
    <button onclick="login()" class="btn-go">دخول</button>
</div>

<div id="game-ui" class="card" style="display:none;">
    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
        <span id="user-name"></span>
        <span style="color:#fbbf24">💰 <span id="user-balance"></span></span>
    </div>

    <div class="race-track">
        <div id="multiplier">1.00x</div>
        <div id="camel-box" class="camel-container">
            <div class="camel-body" style="font-size: 60px;">🐪</div>
            <div class="dust">💨</div>
        </div>
    </div>

    <div class="inputs">
        <div><small>الرهان</small><input type="number" id="bet-amt" value="10"></div>
        <div><small>التوقع</small><input type="number" id="guess-amt" value="2.0"></div>
    </div>
    
    <button id="main-btn" onclick="toggleRace()" class="btn-go">ابدأ السباق</button>

    <table class="hist-table">
        <tbody id="hist-body"></tbody>
    </table>
</div>

<script>
    const S_URL = 'https://uqmfwgdrlcqywxvdljlb.supabase.co';
    const S_KEY = 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT';
    const _s = supabase.createClient(S_URL, S_KEY);

    let bal, user, gameInt, mult = 1.0, crashPt;

    async function login() {
        const u = document.getElementById('u').value, p = document.getElementById('p').value;
        const { data } = await _s.from('Profiles').select('*').eq('username', u).eq('password', p).single();
        if (data) {
            user = data.username; bal = data.balance;
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            updateUI();
        } else alert("بيانات خاطئة!");
    }

    function updateUI() {
        document.getElementById('user-name').innerText = user;
        document.getElementById('user-balance').innerText = Math.floor(bal);
    }

    function toggleRace() {
        const btn = document.getElementById('main-btn');
        if (btn.innerText === "ابدأ السباق") start();
        else cash();
    }

    function start() {
        let amt = parseFloat(document.getElementById('bet-amt').value);
        if (amt > bal || amt <= 0) return alert("الرصيد غير كافٍ");
        
        bal -= amt; updateUI();
        mult = 1.0; 
        // تحديد نقطة الانفجار بشكل عشوائي
        crashPt = (Math.random() * 5 + 1.05).toFixed(2);
        
        const camelBox = document.getElementById('camel-box');
        const btn = document.getElementById('main-btn');
        const mDisplay = document.getElementById('multiplier');

        camelBox.classList.add('running');
        mDisplay.style.display = 'block';
        mDisplay.style.color = 'var(--green)';
        btn.innerText = "سحب الأرباح";
        btn.className = "btn-stop";

        gameInt = setInterval(() => {
            mult = parseFloat((mult + 0.03).toFixed(2));
            mDisplay.innerText = mult + "x";
            
            // تحريك الجمل لليمين (لأننا عكسنا الاتجاه بـ scaleX)
            // بما أن scaleX(-1) تم تطبيقه، left ستزيد للأمام
            let progress = Math.min(10 + (mult * 12), 75);
            camelBox.style.left = progress + "%";

            if (mult >= crashPt) stop(false);
        }, 80);
    }

    async function cash() {
        clearInterval(gameInt);
        let win = mult * parseFloat(document.getElementById('bet-amt').value);
        bal += win; updateUI();
        addHist("فوز", mult, win.toFixed(0));
        await _s.from('Profiles').update({ balance: Math.floor(bal) }).eq('username', user);
        stop(true);
    }

    function stop(win) {
        clearInterval(gameInt);
        const camelBox = document.getElementById('camel-box');
        const btn = document.getElementById('main-btn');
        const mDisplay = document.getElementById('multiplier');

        camelBox.classList.remove('running');
        if (!win) {
            mDisplay.style.color = 'var(--red)';
            mDisplay.innerText = "تعثر! " + mult + "x";
            addHist("خسارة", mult, "-");
        }
        
        btn.disabled = true;
        setTimeout(() => {
            btn.disabled = false;
            btn.innerText = "ابدأ السباق";
            btn.className = "btn-go";
            mDisplay.style.display = 'none';
            camelBox.style.left = "10%";
        }, 2500);
    }

    function addHist(s, m, a) {
        const h = document.getElementById('hist-body');
        h.innerHTML = `<tr><td>${s}</td><td style="color:${s==='فوز'?'#22c55e':'#ef4444'}">${m}x</td><td>${a}</td></tr>` + h.innerHTML;
    }
</script>
</body>
</html>
