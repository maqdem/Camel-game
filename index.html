        body { font-family: 'Segoe UI', sans-serif; background: #0b141a; color: white; text-align: center; margin: 0; padding: 10px; }
        .card { background: #1c262d; padding: 20px; border-radius: 20px; max-width: 400px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #2d333b; }
        
        /* شاشة العرض */
        #multiplier { font-size: 65px; font-weight: 900; color: #00ff88; margin: 20px 0; display: none; height: 80px; align-items: center; justify-content: center; text-shadow: 0 0 20px rgba(0,255,136,0.3); }
        #timer-num { font-size: 60px; color: #ffcc00; font-weight: bold; }
        .sky-area { background: linear-gradient(to top, #1e3a8a, #3b82f6); height: 160px; border-radius: 15px; position: relative; overflow: hidden; margin-bottom: 15px; border: 2px solid #12191f; }
        .plane { font-size: 50px; position: absolute; left: 10%; bottom: 20px; transition: transform 0.1s linear; z-index: 10; }
        
        /* التحكم */
        .controls { background: #12191f; padding: 15px; border-radius: 15px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2d333b; background: #1c262d; color: white; text-align: center; font-size: 18px; margin-bottom: 10px; box-sizing: border-box; }
        .auto-box { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background: #1c262d; padding: 8px; border-radius: 10px; border: 1px solid #2d333b; }
        .auto-box label { font-size: 14px; color: #8b949e; white-space: nowrap; }

        button { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-bet { background: #238636; color: white; }
        .btn-cashout { background: #f85149; color: white; }
        .btn-success { background: #2d333b; color: #3fb950; cursor: default; }

        /* لوحة المتصدرين */
        .leaderboard { margin-top: 20px; background: #12191f; border-radius: 15px; padding: 10px; }
        .leader-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #2d333b; font-size: 14px; }
        .leader-item:last-child { border: none; }
        .gold { color: #ffcc00; font-weight: bold; }
    </style>
</head>

<div id="login-ui" class="card">

    <input type="password" id="p" placeholder="كلمة السر">
    <button onclick="login()" class="btn-bet">دخول وبدء اللعب</button>

<div id="game-ui" style="display:none;" class="card">

    </div>

    <div id="multiplier">1.00x</div>
    <div id="countdown-box"><div id="timer-num">5</div></div>

    </div>

    <div class="controls">

        <div class="auto-box">
            <label>سحب تلقائي عند:</label>

        </div>

        <button id="main-btn" onclick="handleButtonClick()" class="btn-bet">تجهيز الرهان</button>
    </div>

    <div class="leaderboard">
        <h4 style="margin: 5px 0; color: #8b949e;">🏆 أفضل اللاعبين</h4>
        <div id="leader-list"></div>
    </div>
</div>
