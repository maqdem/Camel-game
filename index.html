<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Ahoul - Professional Camel Race</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --green: #22c55e; --red: #ef4444; --accent: #f59e0b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; }
        
        .main-app { max-width: 450px; margin: auto; background: var(--card); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }

        /* منطقة السباق */
        .race-track { 
            height: 250px; background: linear-gradient(to bottom, #020617, #1e293b); 
            position: relative; overflow: hidden; border-bottom: 4px solid var(--accent);
        }
        
        /* تصميم الجمل SVG */
        .camel-container {
            position: absolute; left: 10%; bottom: 20px; width: 110px; height: 90px;
            transition: left 0.1s linear; transform: scaleX(-1); /* ليكون اتجاه الوجه لليمين */
        }

        /* أنيميشن الأرجل والجسم */
        .running .leg { animation: gallop-leg 0.2s infinite alternate ease-in-out; transform-origin: top; }
        .running .body-group { animation: bounce 0.3s infinite alternate; }
        
        @keyframes gallop-leg {
            from { transform: rotate(-25deg); }
            to { transform: rotate(25deg); }
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        /* خطوط السرعة والغبار */
        .speed-line { position: absolute; background: white; height: 2px; border-radius: 2px; opacity: 0; }
        .running .speed-line { animation: speed-fx 0.3s infinite; opacity: 0.4; }
        @keyframes speed-fx {
            0% { width: 0; transform: translateX(0); }
            100% { width: 30px; transform: translateX(50px); }
        }

        #multiplier { 
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            font-size: 50px; font-weight: 900; color: var(--green); z-index: 10;
            text-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
        }

        /* التحكم والجداول */
        .ui-panel { padding: 15px; background: #111827; }
        .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        input { background: #1f2937; border: 1px solid #374151; color: white; padding: 12px; border-radius: 10px; text-align: center; font-size: 16px; width: 100%; box-sizing: border-box; }
        button { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.2s; }
        .btn-run { background: var(--green); color: white; }
        .btn-cash { background: var(--red); color: white; }

        .history-list { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .history-list td { padding: 8px; border-bottom: 1px solid #2d3748; text-align: center; }
    </style>
</head>
<body>

<div id="login-ui" style="text-align:center; padding-top:100px;">
    <input type="text" id="u" placeholder="اسم المستخدم" style="max-width:300px"><br>
    <input type="password" id="p" placeholder="كلمة السر" style="max-width:300px"><br>
    <button onclick="login()" class="btn-run" style="max-width:300px">دخول</button>
</div>
