<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن Pro - الإصدار المحصن</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        /* ... نفس الستايل السابق الخاص بك مع إضافة بسيطة للجمالية ... */
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; --input: #12191f; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 420px; height: 98vh; background: var(--card); padding: 15px; border-radius: 25px; border: 1px solid #2d333b; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        #auth-overlay { position: absolute; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; justify-content: center; padding: 25px; border-radius: 25px; }
        .auth-tabs { display: flex; background: #0d1117; border-radius: 12px; margin-bottom: 15px; padding: 5px; }
        .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; border-radius: 8px; font-weight: bold; color: #666; }
        .auth-tab.active { background: var(--card); color: var(--accent); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 5px; }
        .balance-box { background: rgba(255, 204, 0, 0.1); border: 1px solid var(--gold); padding: 5px 12px; border-radius: 10px; color: var(--gold); font-weight: bold; }
        #display-zone { height: 90px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        #timer-val { font-size: 60px; font-weight: 900; color: var(--gold); }
        #mult-val { font-size: 55px; font-weight: 900; }
        .track { height: 120px; background: #0d1117; border-radius: 15px; position: relative; overflow: hidden; border: 1px solid #2d333b; margin-bottom: 8px; }
        .moving-bg { position: absolute; inset: 0; background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.05) 50%, transparent 100%), repeating-linear-gradient(90deg, #0d1117 0, #0d1117 40px, #222 41px, #222 42px); background-size: 200% 100%; animation: moveGround 0.2s linear infinite; display: none; }
        @keyframes moveGround { from { background-position: 200% 0; } to { background-position: 0% 0; } }
        .camel-wrap { position: absolute; bottom: 10px; left: 0; transition: left 0.1s linear; }
        .camel { font-size: 50px; transform: scaleX(-1); }
        .controls { background: #0d1117; padding: 10px; border-radius: 15px; margin-bottom: 10px; }
        .input-group { display: flex; gap: 5px; margin-bottom: 8px; align-items: flex-end; }
        .field { flex: 1; text-align: center; }
        .field label { display: block; font-size: 8px; color: #888; margin-bottom: 2px; }
        .field input { width: 100%; background: var(--input); border: 1px solid #333; color: white; padding: 8px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 14px; }
        .main-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 18px; font-weight: 900; cursor: pointer; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cash { background: var(--error); color: white; }
        .btn-wait { background: #222; color: #555; cursor: not-allowed; }
        .tabs-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #0d1117; border-radius: 15px; border: 1px solid #333; }
        .tab-headers { display: flex; border-bottom: 1px solid #222; }
        .tab-h { flex: 1; padding: 10px; text-align: center; font-size: 11px; cursor: pointer; color: #666; font-weight: bold; }
        .tab-h.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        .tab-body { flex: 1; overflow-y: auto; padding: 5px; }
        .history-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #222; font-size: 11px; }
        .hi-badge { padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:3000; justify-content:center; align-items:center; padding:20px; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 20px; width: 100%; max-width: 340px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="auth-overlay">
        <h2 style="text-align:center; color: var(--gold); margin-bottom: 20px;">🐪 سباق الهجن PRO</h2>
        <div class="auth-tabs">
            <div id="tb-login" class="auth-tab active" onclick="switchAuth('login')">دخول</div>
            <div id="tb-signup" class="auth-tab" onclick="switchAuth('signup')">تسجيل</div>
        </div>
        <input type="text" id="ui" placeholder="اسم المستخدم" style="width:100%; padding:12px; background:#12191f; border:1px solid #333; color:white; border-radius:10px; margin-bottom:10px; text-align:center">
        <input type="password" id="pi" placeholder="كلمة المرور" style="width:100%; padding:12px; background:#12191f; border:1px solid #333; color:white; border-radius:10px; margin-bottom:10px; text-align:center">
        <input type="text" id="ri" placeholder="كود الإحالة (اختياري)" style="width:100%; padding:12px; background:#12191f; border:1px solid #333; color:white; border-radius:10px; margin-bottom:20px; text-align:center">
        <button id="auth-bt" class="main-btn btn-bet" onclick="handleAuth()">دخول</button>
    </div>

    <div class="header">
        <div><span id="un" style="color:var(--accent); font-weight:bold;">...</span></div>
        <div style="display: flex; gap: 5px;">
            <button onclick="openModal('withdraw-modal')" style="background:var(--error); border:none; padding:5px 10px; border-radius:8px; color:white; font-size:10px; cursor:pointer;">سحب</button>
            <button onclick="openModal('deposit-modal')" style="background:var(--gold); border:none; padding:5px 10px; border-radius:8px; color:black; font-size:10px; font-weight:bold; cursor:pointer;">إيداع</button>
            <div class="balance-box">💰 <span id="ub">0.00</span></div>
        </div>
    </div>

    <div id="display-zone">
        <div id="timer-val">--</div>
        <div id="mult-val" style="display: none;">1.00x</div>
    </div>

    <div class="track" id="tr-container">
        <div class="moving-bg" id="bg-move"></div>
        <div id="cw" class="camel-wrap"><div class="camel">🐪</div></div>
    </div>

    <div class="controls">
        <div class="input-group">
            <div class="field"><label>المبلغ</label><input type="number" id="ba" value="10"></div>
            <div class="field"><label>هدف آلي</label><input type="number" id="av" value="2.00"></div>
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center;">
                <label style="font-size:7px; color:var(--accent)">سحب آلي</label>
                <input type="checkbox" id="auto-cash-toggle" style="width:20px; height:20px;">
            </div>
        </div>
        <button id="ab" class="main-btn btn-bet" onclick="mainAction()">تحميل الجولة...</button>
    </div>

    <div class="tabs-container">
        <div class="tab-headers">
            <div class="tab-h active" onclick="showTab('game-history')">النتائج</div>
            <div class="tab-h" onclick="showTab('my-bets')">مراهناتي</div>
        </div>
        <div id="game-history" class="tab-body"></div>
        <div id="my-bets" class="tab-body" style="display:none"></div>
    </div>
    
    <div class="ref-section" style="padding:5px; font-size:10px;">كود الإحالة: <b id="my-ref-code" style="color:var(--gold)">---</b></div>
</div>

<div id="deposit-modal" class="modal">
    <div class="modal-content">
        <h3 style="text-align:center; color:var(--gold); margin-bottom:15px;">إيداع USDT (TRC20)</h3>
        <p style="font-size:10px; text-align:center; margin-bottom:10px;">العنوان: <b>TG9gT1pPJK3aETRp1hVu28F5Zayu4oVyEg</b></p>
        <input type="text" id="tx-hash" placeholder="رقم العملية (Hash)" style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="number" id="dep-amount" placeholder="المبلغ" style="width:100%; padding:10px; margin-bottom:15px;">
        <button class="main-btn btn-bet" onclick="submitDeposit()">تأكيد الإيداع</button>
        <button onclick="closeModal('deposit-modal')" style="width:100%; margin-top:10px;">إلغاء</button>
    </div>
</div>

<script>
    const SB_URL = "https://uqmfwgdrlcqywxvdljlb.supabase.co";
    const SB_KEY = "sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT";
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let user = null, state = 'syncing', mode = 'login';
    let nextT = 0, startT = 0, crashP = 0, currentGameId = null;
    let betted = false, cashed = false, currentMult = 1.00;

    // --- المحرك المحدث (يرتبط بالسيرفر) ---
    async function fetchNextRound() {
        state = 'syncing';
        // جلب الجولة القادمة التي تم إنشاؤها بواسطة Edge Function
        const { data, error } = await sb.from('Games').select('*').eq('status', 'pending').order('start_at', {ascending:true}).limit(1).single();
        
        if (data) {
            currentGameId = data.id;
            crashP = data.crash_point;
            nextT = new Date(data.start_at).getTime();
            state = 'waiting';
        } else {
            // إذا لم توجد جولة، انتظر ثانية وحاول مجدداً
            setTimeout(fetchNextRound, 2000);
        }
    }

    function engine() {
        setInterval(() => {
            const now = Date.now();
            if (state === 'paused' || state === 'syncing') return;

            if (now < nextT) {
                // حالة الانتظار
                state = 'waiting';
                document.getElementById('timer-val').innerText = Math.ceil((nextT - now)/1000);
                document.getElementById('timer-val').style.display = 'block';
                document.getElementById('mult-val').style.display = 'none';
                document.getElementById('bg-move').style.display = 'none';
                document.getElementById('cw').style.display = 'block';
                if(!betted) toggleControls(false);
                updateBtnUI(); resetScene();
            } else {
                // حالة السباق
                if (startT === 0) startT = nextT; 
                state = 'racing';
                document.getElementById('bg-move').style.display = 'block';
                
                let elapsed = (now - startT)/1000;
                currentMult = Math.pow(1.08, elapsed); // المعادلة الرياضية للنمو
                
                if (currentMult >= crashP) { 
                    explosion(); 
                } else {
                    document.getElementById('timer-val').style.display = 'none';
                    const mv = document.getElementById('mult-val');
                    mv.style.display = 'block'; mv.innerText = currentMult.toFixed(2)+'x';
                    document.getElementById('cw').style.left = Math.min(elapsed * 10, 80) + '%';
                    updateBtnUI();
                    
                    // سحب آلي
                    if(betted && !cashed && document.getElementById('auto-cash-toggle').checked) {
                        if(currentMult >= parseFloat(document.getElementById('av').value)) doCashout();
                    }
                }
            }
        }, 60);
    }

    async function mainAction() {
        if(state === 'waiting' && !betted) {
            const amt = parseFloat(document.getElementById('ba').value);
            if(user.balance >= amt && amt > 0) {
                betted = true; 
                user.balance -= amt;
                document.getElementById('ub').innerText = user.balance.toFixed(2);
                
                // حفظ الرهان في السيرفر
                await sb.from('Profiles').update({ balance: user.balance }).eq('id', user.id);
                await sb.from('Bets').insert([{ user_id: user.id, game_id: currentGameId, amount: amt, status: 'pending' }]);
                
                toggleControls(true);
                updateBtnUI();
            } else { alert("الرصيد غير كافٍ"); }
        } else if (state === 'racing' && betted && !cashed) {
            doCashout();
        }
    }

    async function doCashout() {
        if(cashed || !betted || state !== 'racing') return;
        cashed = true;
        let win = parseFloat(document.getElementById('ba').value) * currentMult;
        user.balance += win; 
        document.getElementById('ub').innerText = user.balance.toFixed(2);
        
        // تحديث السيرفر
        await sb.from('Profiles').update({ balance: user.balance }).eq('id', user.id);
        await sb.from('Bets').update({ cashout_mult: currentMult, status: 'won' }).eq('game_id', currentGameId).eq('user_id', user.id);
        
        updateBtnUI(); syncMyBets();
    }

    async function explosion() {
        state = 'paused';
        document.getElementById('bg-move').style.display = 'none';
        document.getElementById('cw').style.display = 'none';
        
        const mv = document.getElementById('mult-val');
        mv.innerText = crashP.toFixed(2) + 'x';
        mv.style.color = 'var(--error)';
        
        // تحديث حالة الجولة في قاعدة البيانات (للمرة الأولى فقط)
        await sb.from('Games').update({ status: 'finished' }).eq('id', currentGameId);

        if(betted && !cashed) {
            await sb.from('Bets').update({ status: 'lost', cashout_mult: crashP }).eq('game_id', currentGameId).eq('user_id', user.id);
        }

        sync(); syncMyBets();
        
        setTimeout(() => {
            mv.style.color = 'var(--text)';
            startT = 0; betted = false; cashed = false;
            fetchNextRound(); // جلب الجولة التالية
        }, 3000);
    }

    // --- وظائف المساعدة والـ UI ---
    function toggleControls(lock) {
        document.getElementById('ba').disabled = lock;
        document.getElementById('av').disabled = lock;
    }

    function updateBtnUI() {
        const btn = document.getElementById('ab');
        if (state === 'syncing') btn.innerText = "جاري الاتصال...";
        else if (state === 'waiting') btn.innerText = betted ? "في انتظار الانطلاق..." : "وضع رهان";
        else if (state === 'racing') {
            btn.innerText = (betted && !cashed) ? `سحب ${(currentMult * parseFloat(document.getElementById('ba').value)).toFixed(2)}` : "سباق جارٍ...";
            btn.className = (betted && !cashed) ? "main-btn btn-cash" : "main-btn btn-wait";
        }
    }

    async function handleAuth() {
        const u = document.getElementById('ui').value, p = document.getElementById('pi').value;
        const email = `${u.trim()}@camel.com`;
        try {
            if(mode === 'signup') {
                const { data, error } = await sb.auth.signUp({ email, password: p });
                if(error) throw error;
                const rc = Math.random().toString(36).substring(2, 7).toUpperCase();
                await sb.from('Profiles').insert([{ id: data.user.id, username: u, balance: 10, referral_code: rc }]); // هدية 10 دولار للتجربة
                alert("تم التسجيل بنجاح!"); switchAuth('login');
            } else {
                const { data, error } = await sb.auth.signInWithPassword({ email, password: p });
                if(error) throw error;
                const { data: pr } = await sb.from('Profiles').select('*').eq('id', data.user.id).single();
                user = pr; startApp();
            }
        } catch(e) { alert(e.message); }
    }

    function startApp() {
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('un').innerText = user.username;
        document.getElementById('ub').innerText = user.balance.toFixed(2);
        document.getElementById('my-ref-code').innerText = user.referral_code;
        fetchNextRound();
        engine();
        sync();
        syncMyBets();
    }

    function resetScene() { document.getElementById('cw').style.left = '0%'; }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function switchAuth(m) { mode = m; document.getElementById('tb-login').classList.toggle('active', m==='login'); document.getElementById('tb-signup').classList.toggle('active', m==='signup'); }
    function showTab(id) { 
        document.getElementById('game-history').style.display = id === 'game-history' ? 'block' : 'none';
        document.getElementById('my-bets').style.display = id === 'my-bets' ? 'block' : 'none';
    }

    // مزامنة البيانات
    async function sync() {
        const { data } = await sb.from('Games').select('*').eq('status', 'finished').order('start_at', {ascending:false}).limit(10);
        if(data) document.getElementById('game-history').innerHTML = data.map(g => `<div class="history-item"><span>جولة #${g.id.slice(0,4)}</span><b style="color:${g.crash_point>2?'#00ff88':'#ff4b4b'}">${g.crash_point}x</b></div>`).join('');
    }

    async function syncMyBets() {
        if(!user) return;
        const { data } = await sb.from('Bets').select('*').eq('user_id', user.id).order('created_at', {ascending:false}).limit(10);
        if(data) document.getElementById('my-bets').innerHTML = data.map(b => `<div class="history-item"><span>💰 ${b.amount}</span><b style="color:${b.status==='won'?'#00ff88':'#ff4b4b'}">${b.status==='won'?'فوز':'خسارة'}</b></div>`).join('');
    }
</script>
</body>
</html>
