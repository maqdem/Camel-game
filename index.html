<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سباق الهجن - المزامنة العالمية</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        /* التنسيقات كما هي في النسخة السابقة لضمان المظهر الجميل */
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 95%; max-width: 420px; background: var(--card); padding: 20px; border-radius: 24px; text-align: center; }
        #main-timer { font-size: 80px; font-weight: 900; color: var(--gold); }
        .multiplier { font-size: 70px; font-weight: 900; color: var(--accent); display: none; }
        .track { height: 130px; background: #12191f; border-radius: 18px; position: relative; overflow: hidden; border: 2px solid #2d333b; }
        .camel { position: absolute; bottom: 15px; left: 0; font-size: 50px; transition: left 0.1s linear; }
        .history-list { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; flex-direction: row-reverse; }
        .history-item { min-width: 60px; padding: 6px; border-radius: 8px; background: #12191f; color: var(--accent); border: 1px solid rgba(0,255,136,0.2); }
    </style>
</head>
<body>

<div class="app-container">
    <div id="game-screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span id="player-name">---</span>
            <div style="color: var(--gold); font-weight: bold;">💰 <span id="player-balance">0.00</span></div>
        </div>

        <div id="main-timer">5</div>
        <div id="mult-display" class="multiplier">1.00x</div>
        
        <div class="track" id="track-box">
            <div id="camel" class="camel">🐪</div>
        </div>

        <div style="margin-top:20px;">
            <input type="number" id="bet-amount" style="width:80%; padding:10px; border-radius:10px; border:none;" value="10">
            <button id="action-btn" onclick="handleAction()" style="width:85%; padding:15px; margin-top:10px; border-radius:15px; background:var(--accent); font-weight:bold;">وضع رهان</button>
        </div>

        <div id="history-list" class="history-list"></div>
    </div>
</div>

<script>
    // إعدادات الربط
    const CONF = { URL: 'https://uqmfwgdrlcqywxvdljlb.supabase.co', KEY: 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT' };
    const supabaseClient = supabase.createClient(CONF.URL, CONF.KEY);

    let currentRoundId = -1;
    const CYCLE_TIME = 20; // الدورة الكاملة (ثواني)
    const WAIT_TIME = 5;   // وقت الانتظار قبل الانطلاق

    // دالة توليد رقم التحطم بناءً على وقت الجولة (ثابتة لجميع اللاعبين)
    function generateGlobalCrash(roundId) {
        let seed = roundId * 12345.678; 
        let x = Math.abs(Math.sin(seed) * 10000);
        let r = x - Math.floor(x);
        return Math.min(parseFloat((0.98 / (1 - r * 0.98)).toFixed(2)), 500);
    }

    function startGlobalEngine() {
        setInterval(() => {
            // الحصول على التوقيت العالمي بالثواني
            const now = Math.floor(Date.now() / 1000);
            const cyclePos = Date.now() / 1000 % CYCLE_TIME; 
            const roundId = Math.floor(now / CYCLE_TIME);
            const crashPoint = generateGlobalCrash(roundId);

            if (cyclePos < WAIT_TIME) {
                // مرحلة الانتظار - الجميع يرى نفس العداد
                if (currentRoundId !== roundId) {
                    currentRoundId = roundId;
                    resetUI();
                }
                renderWaiting(Math.ceil(WAIT_TIME - cyclePos));
            } else {
                // مرحلة السباق
                const elapsed = cyclePos - WAIT_TIME;
                const currentMult = Math.pow(1.15, elapsed);

                if (currentMult >= crashPoint) {
                    renderCrash(crashPoint);
                    if (!window.isSaved) {
                        saveToHistory(crashPoint.toFixed(2));
                        window.isSaved = true;
                    }
                } else {
                    window.isSaved = false;
                    renderRacing(currentMult, elapsed);
                }
            }
        }, 50);
    }

    function renderWaiting(sec) {
        document.getElementById('main-timer').style.display = 'block';
        document.getElementById('mult-display').style.display = 'none';
        document.getElementById('main-timer').innerText = sec;
        document.getElementById('camel').style.left = "0%";
    }

    function renderRacing(mult, elapsed) {
        document.getElementById('main-timer').style.display = 'none';
        const d = document.getElementById('mult-display');
        d.style.display = 'block';
        d.innerText = mult.toFixed(2) + "x";
        document.getElementById('camel').style.left = Math.min(elapsed * 5, 45) + "%";
    }

    function renderCrash(cp) {
        const d = document.getElementById('mult-display');
        d.innerText = cp.toFixed(2) + "x";
        d.style.color = "var(--error)";
    }

    function resetUI() {
        document.getElementById('mult-display').style.color = "var(--accent)";
    }

    async function saveToHistory(p) {
        const l = document.getElementById('history-list');
        const i = document.createElement('div');
        i.className = 'history-item';
        i.innerText = p + 'x';
        l.insertBefore(i, l.firstChild);
        if (l.children.length > 10) l.removeChild(l.lastChild);
        
        // استدعاء وظيفة النظام التي أنشأتها في Supabase
        await supabaseClient.rpc('add_crash_record', { crash_val: parseFloat(p) });
    }

    // تشغيل المحرك العالمي
    startGlobalEngine();
</script>
</body>
</html>
