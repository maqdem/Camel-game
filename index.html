<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Ahoul - سباق الهجن</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-dark: #1a1d21; --card-bg: #24292e; --green: #2ecc71; --red: #e74c3c; --text-muted: #94a3b8; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-dark); color: white; margin: 0; padding: 10px; }
        
        .main-container { max-width: 450px; margin: auto; background: var(--card-bg); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* الهيدر العلوي */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #121518; border-bottom: 1px solid #334155; }
        .agent-tag { background: #3c444d; padding: 5px 12px; border-radius: 8px; font-size: 14px; display: flex; align-items: center; gap: 5px; }

        /* منطقة السباق */
        .race-screen { 
            height: 250px; background: linear-gradient(to bottom, #0f172a, #24292e); 
            position: relative; overflow: hidden; border-bottom: 5px solid #c2914d;
        }
        .moon { position: absolute; top: 20px; right: 40px; font-size: 30px; opacity: 0.6; }
        
        #multiplier { 
            position: absolute; top: 35%; left: 50%; transform: translateX(-50%);
            font-size: 55px; font-weight: 900; color: var(--green); z-index: 10;
        }

        /* الجمل والأنيميشن */
        .camel-wrapper { position: absolute; left: 10%; bottom: 15px; width: 80px; transition: left 0.1s linear; transform: scaleX(-1); }
        .camel-emoji { font-size: 60px; display: inline-block; }
        .running { animation: camel-run 0.4s infinite alternate ease-in-out; }
        @keyframes camel-run {
            0% { transform: translateY(0) rotate(-5deg); }
            100% { transform: translateY(-12px) rotate(5deg); }
        }

        /* التحكم */
        .controls { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .input-box { display: flex; flex-direction: column; gap: 5px; }
        .input-box label { font-size: 13px; color: var(--text-muted); }
        input { background: #121518; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; font-size: 16px; width: 100%; box-sizing: border-box; }
        
        .action-btns { grid-column: span 2; display: flex; gap: 10px; }
        button { flex: 1; padding: 15px; border-radius: 10px; border: none; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.2s; }
        .btn-green { background: var(--green); color: white; }
        .btn-red { background: var(--red); color: white; }

        /* الجدول السفلي كما في الصورة */
        .stats-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .stats-table th { color: var(--text-muted); padding: 10px; border-bottom: 1px solid #334155; }
        .stats-table td { padding: 12px 10px; text-align: center; border-bottom: 1px solid #2a2f35; }
        .win-tag { background: rgba(46, 204, 113, 0.2); color: var(--green); padding: 4px 8px; border-radius: 5px; }
        .loss-tag { background: rgba(231, 76, 60, 0.2); color: var(--red); padding: 4px 8px; border-radius: 5px; }
    </style>
</head>
<body>

<div id="login-screen" style="max-width:400px; margin: 100px auto; text-align: center;">
    <input type="text" id="u" placeholder="اسم المستخدم" style="margin-bottom:10px"><br>
    <input type="password" id="p" placeholder="كلمة السر" style="margin-bottom:15px"><br>
    <button onclick="login()" class="btn-green" style="width:100%">دخول</button>
</div>

<div id="game-container" class="main-container" style="display:none;">
    <div class="header">
        <div style="font-weight:bold">Bet Ahoul</div>
        <div class="agent-tag">💰 <span id="balance">0</span></div>
        <div id="user-tag" style="font-size:12px; color:var(--text-muted)"></div>
    </div>

    <div class="race-screen">
        <div class="moon">🌙</div>
        <div id="multiplier">1.00x</div>
        <div id="camel-box" class="camel-wrapper">
            <span class="camel-emoji">🐪</span>
        </div>
    </div>

    <div class="controls">
        <div class="input-box">
            <label>Bet Amount</label>
            <input type="number" id="bet-amt" value="100">
        </div>
        <div class="input-box">
            <label>Guess</label>
            <input type="number" id="guess-amt" value="5">
        </div>
        <div class="action-btns">
            <button id="main-btn" onclick="handleGame()" class="btn-green">Run</button>
        </div>
    </div>

    <table class="stats-table">
        <thead>
            <tr>
                <th>
