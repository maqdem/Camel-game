<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camel Dash Ultimate | 850x</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .app-container { width: 95%; max-width: 400px; background: var(--card); padding: 20px; border-radius: 25px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .balance-box { background: rgba(255, 204, 0, 0.1); padding: 8px 15px; border-radius: 12px; border: 1px solid var(--gold); color: var(--gold); font-weight: bold; }
        #main-timer { font-size: 80px; color: var(--gold); text-align: center; font-weight: 900; text-shadow: 0 0 15px rgba(255,204,0,0.3); }
        .multiplier { font-size: 75px; color: var(--accent); text-align: center; font-weight: 900; display: none; }
        .track { height: 130px; background: #12191f; border-radius: 18px; position: relative; overflow: hidden; margin: 15px 0; border: 2px solid #252d33; }
        .camel-wrapper { position: absolute; bottom: 15px; left: 0; transition: left 0.1s linear; font-size: 55px; z-index: 5; }
        .explosion { position: absolute; width: 100px; height: 100px; background: radial-gradient(circle, #ffcc00, #ff4b4b, transparent); border-radius: 50%; display: none; z-index: 10; animation: explode 0.5s forwards; }
        @keyframes explode { 0% { transform: scale(0.1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        .controls { background: #0d1117; padding: 15px; border-radius: 18px; display: flex; flex-direction: column; gap: 10px; }
        .input-row { display: flex; gap: 8px; }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 11px; color: #888; margin-right: 5px; }
        .field { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #12191f; color: white; text-align: center; font-weight: bold; outline: none; }
        .main-btn { width: 100%; padding: 16px; border-radius: 15px; border: none; font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cashout { background: var(--error); color: white; }
        .btn-waiting { background: #222; color: #555; pointer-events: none; }
        .toggle-btn { padding: 5px 10px; border-radius: 8px; border: 1px solid #444; background: #222; color: #888; font-size: 10px; cursor: pointer; font-weight: bold; }
        .toggle-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
        .history-list { display: flex; gap: 8px; overflow-x: auto; margin-top: 15px; padding-bottom: 5px; flex-direction: row-reverse; scrollbar-width: none; }
        .history-item { min-width: 65px; background: #12191f; padding: 7px; border-radius: 10px; text-align: center; color: var(--accent); border: 1px solid rgba(0,255,136,0.1); font-weight: bold; }
        .hist-crash { color: var(--error); border-color: rgba(255,75,75,0.1); }
    </style>
</head>
<body>

<div class="app-container">
    <div id="auth-screen">
        <h2 style="text-align:center; color:var(--accent);">سباق الهجن Pro</h2>
        <input type="text" id="username" class="field" placeholder="اسم المستخدم" style="margin-bottom:10px;">
        <input type="password" id="password" class="field" placeholder="كلمة المرور" style="margin-bottom:15px;">
        <button class="main-btn btn-bet" onclick="processAuth()">ابدأ اللعب</button>
    </div>

    <div id="game-screen" style="display:none;">
        <div class="header">
            <span id="player-name" style="opacity:0.7;">---</span>
            <div class="balance-box">💰 <span id="balance">0.00</span></div>
        </div>

        <div id="main-timer">5</div>
        <div id="mult-display" class="multiplier">1.00x</div>
        
        <div class="track">
            <div id="camel-wrap" class="camel-wrapper">🐪</div>
            <div id="boom-fx" class="explosion"></div>
        </div>

        <div class="controls">
            <div class="input-row">
                <div class="input-group">
                    <label>مبلغ الرهان</label>
                    <input type="number" id="bet-amount" class="field" value="10">
                </div>
                <div class="input-group">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <label>سحب تلقائي</label>
                        <button id="auto-toggle" class="toggle-btn active" onclick="toggleAuto()">ON</button>
                    </div>
                    <input type="number" id="auto-limit" class="field" value="2.00" step="0.1">
                </div>
            </div>
            <button id="action-btn" class="main-btn btn-bet" onclick="handleAction()">وضع رهان</button>
        </div>

        <div id="history-list" class="history-list"></div>
    </div>
</div>

<script>
    const CONF = { URL: 'https://uqmfwgdrlcqywxvdljlb.supabase.co', KEY: 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT' };
    const supabaseClient = supabase.createClient(CONF.URL, CONF.KEY);

    let user = null, betPlaced = false, userInRace = false, cashed = false, currentBet = 0;
    let autoEnabled = true;
    const CYCLE = 20, WAIT = 5, MAX_LIMIT = 850.00;

    function toggleAuto() {
        autoEnabled = !autoEnabled;
        const btn = document.getElementById('auto-toggle');
        btn.innerText = autoEnabled ? "ON" : "OFF";
        btn.classList.toggle('active', autoEnabled);
    }

    async function processAuth() {
        const u = document.getElementById('username').value, p = document.getElementById('password').value;
        if(u.length < 3) return alert("الاسم قصير");
        let { data } = await supabaseClient.from('Profiles').select('*').eq('username', u).maybeSingle();
        if(!data) {
            const { data: n } = await supabaseClient.from('Profiles').insert([{username: u, password: p, balance: 100}]).select().single();
            data = n;
        }
        user = data;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('player-name').innerText = user.username;
        updateUI();
        syncHistory();
        setInterval(syncHistory, 4000);
        requestAnimationFrame(tick);
    }

    function tick() {
        const now = Date.now() / 1000, pos = now % CYCLE, roundId = Math.floor(now / CYCLE);
        const crashAt = getCrash(roundId);

        if (pos < WAIT) {
            renderWait(Math.ceil(WAIT - pos));
            window.isLogged = false;
        } else {
            const elapsed = pos - WAIT;
            let mult = Math.pow(1.15, elapsed);

            // تطبيق السقف الإجباري عند 850
            if (mult >= MAX_LIMIT) {
                mult = MAX_LIMIT;
                if(userInRace && !cashed) doCashout(MAX_LIMIT);
            }

            if (mult >= crashAt || mult >= 850.01) {
                const final = Math.min(crashAt, 850.01);
                if(!window.isLogged) {
                    window.isLogged = true;
                    addLocalHistory(final);
                    saveRound(final);
                }
                renderCrash(final);
            } else {
                renderRace(mult, elapsed);
                // السحب التلقائي (فقط إذا كان الزر ON)
                if (userInRace && !cashed && autoEnabled) {
                    const limit = parseFloat(document.getElementById('auto-limit').value);
                    if (mult >= limit) doCashout(mult);
                }
                if (betPlaced && !userInRace) joinRace();
            }
        }
        requestAnimationFrame(tick);
    }

    // معادلة عشوائية جديدة تماماً لكسر النمط القديم
    function getCrash(id) {
        let seed = id * 789.123 + 0.456;
        let r = Math.abs(Math.sin(seed) * 10000) % 1;
        if (r < 0.03) return 1.00;
        let res = 0.98 / (1 - r);
        return res > 850 ? 850.01 : parseFloat(res.toFixed(2));
    }

    function renderWait(s) {
        document.getElementById('main-timer').style.display = 'block';
        document.getElementById('main-timer').innerText = s;
        document.getElementById('mult-display').style.display = 'none';
        document.getElementById('camel-wrap').style.left = "0%";
        document.getElementById('camel-wrap').style.opacity = "1";
        document.getElementById('boom-fx').style.display = "none";
        const btn = document.getElementById('action-btn');
        btn.innerText = betPlaced ? "في انتظار الجولة..." : "وضع رهان";
        btn.className = "main-btn " + (betPlaced ? "btn-waiting" : "btn-bet");
    }

    function renderRace(m, e) {
        document.getElementById('main-timer').style.display = 'none';
        const d = document.getElementById('mult-display');
        d.style.display = 'block'; d.innerText = m.toFixed(2) + "x";
        d.style.color = "var(--accent)";
        document.getElementById('camel-wrap').style.left = Math.min(e * 4.5, 82) + "%";
        if (userInRace && !cashed) {
            const btn = document.getElementById('action-btn');
            btn.innerText = "سحب: " + (m * currentBet).toFixed(2);
            btn.className = "main-btn btn-cashout";
        }
    }

    function renderCrash(cp) {
        const d = document.getElementById('mult-display');
        d.innerText = cp.toFixed(2) + "x";
        d.style.color = "var(--error)";
        if (document.getElementById('camel-wrap').style.opacity !== "0") {
            const boom = document.getElementById('boom-fx');
            boom.style.left = document.getElementById('camel-wrap').style.left;
            boom.style.display = "block";
            document.getElementById('camel-wrap').style.opacity = "0";
            userInRace = false; betPlaced = false;
            document.getElementById('action-btn').className = "main-btn btn-waiting";
            document.getElementById('action-btn').innerText = "انتهى السباق";
        }
    }

    function handleAction() {
        const pos = (Date.now() / 1000) % CYCLE;
        if (pos < WAIT) betPlaced = !betPlaced;
        else if (userInRace && !cashed) doCashout(parseFloat(document.getElementById('mult-display').innerText));
    }

    function joinRace() {
        currentBet = parseFloat(document.getElementById('bet-amount').value);
        if (user.balance >= currentBet) {
            userInRace = true; cashed = false; betPlaced = false;
            user.balance -= currentBet; updateUI(); saveBalance();
        }
    }

    function doCashout(m) {
        if (cashed || !userInRace) return;
        cashed = true;
        user.balance += (currentBet * m);
        updateUI(); saveBalance();
        document.getElementById('action-btn').innerText = "تم السحب ✅";
        document.getElementById('action-btn').className = "main-btn btn-waiting";
    }

    function updateUI() { document.getElementById('balance').innerText = user.balance.toFixed(2); }

    function addLocalHistory(v) {
        const list = document.getElementById('history-list');
        const item = document.createElement('div');
        const val = parseFloat(v).toFixed(2);
        item.className = `history-item ${val < 2 ? 'hist-crash' : ''}`;
        item.innerText = val + "x";
        list.insertBefore(item, list.firstChild);
        if (list.children.length > 10) list.lastChild.remove();
    }

    async function syncHistory() {
        const { data } = await supabaseClient.from('GameHistory').select('crash_point').order('id', { ascending: false }).limit(10);
        if (data) {
            document.getElementById('history-list').innerHTML = data.map(r => {
                const v = r.crash_point.toFixed(2);
                return `<div class="history-item ${v < 2 ? 'hist-crash' : ''}">${v}x</div>`;
            }).join('');
        }
    }

    async function saveRound(p) { await supabaseClient.rpc('add_crash_record', { crash_val: p }); }
    async function saveBalance() { await supabaseClient.from('Profiles').update({ balance: user.balance }).eq('id', user.id); }
</script>
</body>
</html>
