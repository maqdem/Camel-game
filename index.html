<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار الطيران - نسخة الـ 700x</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b141a; color: white; text-align: center; margin: 0; padding: 10px; }
        .card { background: #1c262d; padding: 20px; border-radius: 20px; max-width: 400px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #multiplier { font-size: 65px; font-weight: 900; color: #00ff88; margin: 20px 0; display: none; height: 80px; align-items: center; justify-content: center; }
        #countdown-box { margin: 20px 0; display: block; }
        #timer-num { font-size: 60px; color: #ffcc00; font-weight: bold; }
        .sky-area { background: linear-gradient(to top, #1e3a8a, #3b82f6); height: 150px; border-radius: 15px; position: relative; overflow: hidden; margin-bottom: 15px; }
        .plane { font-size: 45px; position: absolute; left: 10%; bottom: 20px; transition: transform 0.1s linear; }
        .controls { background: #12191f; padding: 15px; border-radius: 15px; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: none; background: #1c262d; color: white; text-align: center; font-size: 20px; margin-bottom: 10px; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        #main-btn { width: 100%; }
        .btn-bet { background: #238636; color: white; }
        .btn-cashout { background: #f85149; color: white; }
        .btn-success { background: #2d333b; color: #3fb950; cursor: default; }
        .history { display: flex; justify-content: center; gap: 5px; margin-top: 15px; flex-wrap: wrap; }
        .hist-tag { padding: 4px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; background: #2d333b; }
        .red { color: #f85149; } .green { color: #3fb950; }
    </style>
</head>
<body>

<div id="login-ui" class="card">
    <h2>تسجيل الدخول</h2>
    <input type="text" id="u" placeholder="اسم المستخدم">
    <input type="password" id="p" placeholder="كلمة السر">
    <button onclick="login()" class="btn-bet">دخول</button>
</div>

<div id="game-ui" style="display:none;" class="card">
    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
        <span id="user-name" style="color:#8b949e"></span>
        <span style="color:#e3b341">💰 <span id="user-balance">0</span></span>
    </div>

    <div id="multiplier">1.00x</div>
    <div id="countdown-box">
        <div style="color: #8b949e; font-size: 14px;">الرحلة القادمة في</div>
        <div id="timer-num">5</div>
    </div>

    <div class="sky-area">
        <div id="plane-img" class="plane">✈️</div>
    </div>

    <div class="controls">
        <div id="bet-input-area">
            <input type="number" id="bet-amount" value="10">
        </div>
        <button id="main-btn" onclick="handleButtonClick()" class="btn-bet">تجهيز الرهان</button>
    </div>

    <div id="history-list" class="history"></div>
</div>

<script>
    const S_URL = 'https://uqmfwgdrlcqywxvdljlb.supabase.co';
    const S_KEY = 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT';
    const _supabase = supabase.createClient(S_URL, S_KEY);

    const s_tick = new Audio('https://www.soundjay.com/buttons/sounds/button-50.mp3');
    const s_music = new Audio('https://www.soundjay.com/transportation/sounds/jet-passing-by-01.mp3'); 
    const s_crash = new Audio('https://www.soundjay.com/mechanical/sounds/explosion-02.mp3');
    const s_win = new Audio('https://www.soundjay.com/buttons/sounds/button-37.mp3');

    function unlockAudio() {
        [s_tick, s_music, s_crash, s_win].forEach(s => {
            s.play().then(() => { s.pause(); s.currentTime = 0; }).catch(() => {});
        });
    }

    async function login() {
        unlockAudio();
        const u = document.getElementById('u').value.trim();
        const p = document.getElementById('p').value.trim();
        const { data } = await _supabase.from('Profiles').select('*').eq('username', u).eq('password', p).single();
        if (data) {
            username = data.username; currentBalance = data.balance;
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            updateDisplay(); startNewRound();
        } else { alert("خطأ في البيانات"); }
    }

    function updateDisplay() {
        document.getElementById('user-name').innerText = username;
        document.getElementById('user-balance').innerText = Math.floor(currentBalance);
    }

    function startNewRound() {
        clearInterval(gameInterval); clearInterval(countdownInterval);
        betPlaced = false; cashedOut = false; currentMultiplier = 1.0;
        
        document.getElementById('multiplier').style.display = 'none';
        document.getElementById('multiplier').style.color = "#00ff88";
        document.getElementById('countdown-box').style.display = 'block';
        document.getElementById('bet-input-area').style.display = 'block';
        
        const btn = document.getElementById('main-btn');
        btn.className = 'btn-bet';
        btn.innerText = "تجهيز الرهان";
        btn.disabled = false;
        
        document.getElementById('plane-img').style.transform = "translate(0,0)";

        let timeLeft = 5;
        document.getElementById('timer-num').innerText = timeLeft;
        countdownInterval = setInterval(() => {
            timeLeft--;
            if(timeLeft >= 1) s_tick.play().catch(()=>{});
            document.getElementById('timer-num').innerText = timeLeft;
            if (timeLeft <= 0) { clearInterval(countdownInterval); launchPlane(); }
        }, 1000);
    }

    function handleButtonClick() {
        const btn = document.getElementById('main-btn');
        if (btn.innerText === "تجهيز الرهان") {
            placeBet();
        } else if (btn.className.includes('btn-cashout')) {
            cashOut();
        }
    }

    function placeBet() {
        unlockAudio();
        let amt = parseFloat(document.getElementById('bet-amount').value);
        if (amt > currentBalance || amt <= 0) return alert("الرصيد غير كافٍ");
        currentBet = amt; betPlaced = true;
        const btn = document.getElementById('main-btn');
        btn.innerText = "انتظار الإقلاع..";
        btn.disabled = true;
    }

    function launchPlane() {
        document.getElementById('countdown-box').style.display = 'none';
        document.getElementById('multiplier').style.display = 'flex';
        document.getElementById('multiplier').innerText = "1.00x";
        
        s_music.currentTime = 0; s_music.loop = true; s_music.play().catch(() => {});

        const btn = document.getElementById('main-btn');
        if (betPlaced) {
            currentBalance -= currentBet; updateDisplay();
            document.getElementById('bet-input-area').style.display = 'none';
            btn.className = 'btn-cashout';
            btn.disabled = false;
            updateCashoutText();
        } else {
            btn.innerText = "بدأت الرحلة.."; btn.disabled = true;
        }

        // منطق الاحتمالات المتطور مع حد أقصى 700x
        let chance = Math.random() * 100;
        if (chance <= 70) {
            crashPoint = (Math.random() * (4 - 1.1) + 1.1).toFixed(2);
        } else if (chance <= 90) {
            crashPoint = (Math.random() * (10 - 4) + 4).toFixed(2);
        } else if (chance <= 99.9) {
            crashPoint = (Math.random() * (100 - 10) + 10).toFixed(2);
        } else {
            // فرصة 0.1% للوصول إلى 700x
            crashPoint = (Math.random() * (700 - 100) + 100).toFixed(2);
        }

        gameInterval = setInterval(() => {
            // تسريع العداد تدريجياً لضمان عدم استغراق الجولات الطويلة وقتاً مملاً
            let increment = 0.02;
            if (currentMultiplier > 10) increment = 0.5;
            if (currentMultiplier > 50) increment = 2.0;
            if (currentMultiplier > 200) increment = 5.0;

            currentMultiplier += increment;
            document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2) + "x";
            
            if (betPlaced && !cashedOut) updateCashoutText();

            // تحريك الطائرة بشكل انسيابي
            let lift = Math.min(currentMultiplier * 6, 80);
            let drift = Math.min(currentMultiplier * 3, 50);
            document.getElementById('plane-img').style.transform = `translate(${drift}px, -${lift}px)`;

            if (currentMultiplier >= crashPoint) triggerCrash();
        }, 100);
    }

    function updateCashoutText() {
        let win = (currentBet * currentMultiplier).toFixed(2);
        document.getElementById('main-btn').innerHTML = `اسحب <span style="color:#ffcc00">${win}</span> 💰`;
    }

    async function cashOut() {
        if (!betPlaced || cashedOut) return;
        cashedOut = true; s_win.play().catch(()=>{});
        let winAmount = currentBet * currentMultiplier;
        currentBalance += winAmount; updateDisplay();
        
        const btn = document.getElementById('main-btn');
        btn.className = 'btn-success';
        btn.innerHTML = `تم السحب بنجاح ✅ <br><small>+${winAmount.toFixed(2)}</small>`;
        btn.disabled = true;

        await _supabase.from('Profiles').update({ balance: Math.floor(currentBalance) }).eq('username', username);
    }

    function triggerCrash() {
        clearInterval(gameInterval); s_music.pause(); s_crash.play().catch(()=>{}); 
        const final = currentMultiplier.toFixed(2);
        document.getElementById('multiplier').innerText = "💥 " + final + "x";
        document.getElementById('multiplier').style.color = "#f85149";
        
        const btn = document.getElementById('main-btn');
        if (!cashedOut) {
            btn.className = 'btn-bet'; btn.innerText = "انفجرت!"; btn.disabled = true;
        }
        
        addHistory(final);
        if (betPlaced && !cashedOut) {
            _supabase.from('Profiles').update({ balance: Math.floor(currentBalance) }).eq('username', username).then();
        }
        setTimeout(startNewRound, 3000);
    }

    function addHistory(val) {
        const list = document.getElementById('history-list');
        const item = document.createElement('div');
        // تلوين التاريخ بناءً على قوة الرقم
        let colorClass = 'red';
        if (val >= 2) colorClass = 'green';
        if (val >= 10) item.style.border = "1px solid #ffcc00"; // تمييز الأرقام الكبيرة
        
        item.className = `hist-tag ${colorClass}`;
        item.innerText = val + "x";
        list.prepend(item);
        if (list.children.length > 8) list.lastChild.remove();
    }
</script>
</body>
</html>
