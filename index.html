<script>
    // إعدادات الاتصال
    const CONF = { URL: 'https://uqmfwgdrlcqywxvdljlb.supabase.co', KEY: 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT' };
    const supabaseClient = supabase.createClient(CONF.URL, CONF.KEY);

    let user = null, betPlaced = false, userInRace = false, cashed = false, currentBet = 0, bgPos = 0;
    const CYCLE = 20, WAIT = 5;
    const MAX_LIMIT = 850.00;
    let gameChannel;

    // --- نظام المزامنة القوي ---
    function launch(profile) {
        user = profile;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        updateUI(); 
        
        // جلب التاريخ لأول مرة
        syncHistory(); 
        
        // تحديث السجل كل 3 ثوانٍ بشكل إجباري من السيرفر
        setInterval(syncHistory, 3000); 
        
        initPresence();
        requestAnimationFrame(tick);
    }

    function tick() {
        const now = Date.now() / 1000;
        const pos = now % CYCLE;
        const roundId = Math.floor(now / CYCLE);
        
        // حساب نقطة الانفجار
        let crashAt = getCrash(roundId);

        if (pos < WAIT) {
            renderWait(Math.ceil(WAIT - pos));
            window.isLogged = false;
        } else {
            const elapsed = pos - WAIT;
            let mult = Math.pow(1.15, elapsed);

            // 1. تطبيق سقف الـ 850
            if (mult >= MAX_LIMIT) {
                mult = MAX_LIMIT; 
                if (userInRace && !cashed) doCashout(MAX_LIMIT); // سحب تلقائي إجباري
            }

            // 2. التحقق من الانفجار (بما في ذلك الانفجار الإجباري عند 850.01)
            if (mult >= crashAt || mult >= 850.01) {
                const finalCrash = Math.min(crashAt, 850.01);
                
                if (!window.isLogged) {
                    window.isLogged = true;
                    // إضافة للـ History المحلي فوراً قبل السيرفر لضمان الظهور
                    addLocalHistory(finalCrash);
                    // إرسال للسيرفر
                    saveRound(finalCrash);
                }
                renderCrash(finalCrash);
            } else {
                renderRace(mult, elapsed);
                if (userInRace && !cashed) {
                    const autoLimit = parseFloat(document.getElementById('auto-cashout').value);
                    if (mult >= autoLimit) doCashout(autoLimit);
                }
                if (betPlaced && !userInRace) joinRace();
            }
        }
        requestAnimationFrame(tick);
    }

    // دالة عشوائية جديدة تماماً تتجاوز رقم 8
    function getCrash(id) {
        // استخدام معامل متغير لكسر النمط القديم
        let r = Math.abs(Math.sin(id * 1234.567) * 10000) % 1;
        if (r < 0.03) return 1.00; // نسبة خسارة فورية 3%
        
        let res = 0.98 / (1 - r);
        // إذا زاد عن 850، نثبته عند 850.01 للانفجار
        return res > 850 ? 850.01 : parseFloat(res.toFixed(2));
    }

    // إضافة الرقم للسجل (محلياً) لضمان عدم اختفاءه
    function addLocalHistory(val) {
        const list = document.getElementById('history-list');
        const v = parseFloat(val).toFixed(2);
        
        // منع التكرار إذا كان الرقم موجوداً بالفعل
        if (list.firstChild && list.firstChild.innerText === v + "x") return;

        const newItem = document.createElement('div');
        newItem.className = `history-item ${v < 2 ? 'hist-crash' : ''}`;
        newItem.innerText = v + "x";
        list.insertBefore(newItem, list.firstChild);
        if (list.children.length > 10) list.lastChild.remove();
    }

    // جلب السجل من السيرفر
    async function syncHistory() {
        try {
            const { data } = await supabaseClient
                .from('GameHistory')
                .select('crash_point')
                .order('id', { ascending: false })
                .limit(10);
            
            if (data && data.length > 0) {
                const list = document.getElementById('history-list');
                // نحدث القائمة فقط إذا كانت البيانات مختلفة عن المعروض حالياً
                list.innerHTML = data.map(r => {
                    const val = parseFloat(r.crash_point).toFixed(2);
                    return `<div class="history-item ${val < 2 ? 'hist-crash' : ''}">${val}x</div>`;
                }).join('');
            }
        } catch (e) { console.error("History sync error"); }
    }

    // حفظ الجولة في قاعدة البيانات
    async function saveRound(p) {
        try {
            await supabaseClient.rpc('add_crash_record', { crash_val: parseFloat(p) });
        } catch (e) { console.error("Save error"); }
    }

    // --- الوظائف الرسومية ---
    function renderWait(s) {
        document.getElementById('main-timer').style.display = 'block';
        document.getElementById('main-timer').innerText = s;
        document.getElementById('mult-display').style.display = 'none';
        document.getElementById('camel-wrap').style.left = "0%";
        document.getElementById('camel-wrap').style.opacity = "1";
        document.getElementById('boom-fx').style.display = "none";
        updateBtn(betPlaced ? "تم التجهيز..." : "وضع رهان", betPlaced ? "btn-waiting" : "btn-bet");
    }

    function renderRace(m, e) {
        document.getElementById('main-timer').style.display = 'none';
        const d = document.getElementById('mult-display');
        d.style.display = 'block';
        d.innerText = m.toFixed(2) + "x";
        d.style.color = "var(--accent)";
        document.getElementById('camel-wrap').style.left = Math.min(e * 4, 80) + "%";
        bgPos -= (2 + m * 0.3);
        document.getElementById('track-box').style.backgroundPosition = bgPos + "px 0px";
    }

    function renderCrash(cp) {
        const d = document.getElementById('mult-display');
        d.innerText = cp.toFixed(2) + "x";
        d.style.color = "var(--error)";
        if (document.getElementById('camel-wrap').style.opacity !== "0") {
            document.getElementById('boom-fx').style.left = document.getElementById('camel-wrap').style.left;
            document.getElementById('boom-fx').style.display = "block";
            document.getElementById('camel-wrap').style.opacity = "0";
            updateBtn("انفجر الجمل!", "btn-waiting");
            userInRace = false; 
            betPlaced = false;
        }
    }

    // الدوال المتبقية (لا تتغير)
    function handleAction() {
        const pos = (Date.now() / 1000) % CYCLE;
        if (pos < WAIT) { betPlaced = !betPlaced; } 
        else if (userInRace && !cashed) { doCashout(parseFloat(document.getElementById('mult-display').innerText)); }
    }

    function joinRace() {
        currentBet = parseFloat(document.getElementById('bet-amount').value);
        if (user.balance >= currentBet) {
            userInRace = true; cashed = false; betPlaced = false;
            user.balance -= currentBet; updateUI(); saveBalance();
        }
    }

    function doCashout(m) {
        if (cashed || !userInRace) return;
        cashed = true;
        const win = currentBet * m;
        user.balance += win;
        updateUI(); saveBalance();
        updateBtn("تم السحب ✅", "btn-waiting");
    }

    function updateUI() {
        document.getElementById('balance').innerText = user.balance.toFixed(2);
        document.getElementById('player-display').innerText = user.username;
    }

    function updateBtn(t, c, s="") {
        const b = document.getElementById('action-btn'); b.className = `main-btn ${c}`;
        b.innerHTML = s ? `<span>${t}</span><br><small>💰 ${s}</small>` : t;
    }

    async function saveBalance() { if(user) await supabaseClient.from('Profiles').update({ balance: user.balance }).eq('id', user.id); }

    function initPresence() {
        gameChannel = supabaseClient.channel('gameroom', { config: { presence: { key: user.username } } });
        gameChannel.on('presence', { event: 'sync' }, () => {
            const state = gameChannel.presenceState();
            document.getElementById('count-val').innerText = Object.keys(state).length;
        }).subscribe();
    }
</script>
