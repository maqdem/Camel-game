<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camel Race Pro - Elite Edition</title>
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; --input: #12191f; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 420px; height: 95vh; background: var(--card); padding: 15px; border-radius: 25px; border: 1px solid #2d333b; position: relative; display: flex; flex-direction: column; }
        
        /* UI Elements */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 5px; }
        .balance-box { background: rgba(255, 204, 0, 0.1); border: 1px solid var(--gold); padding: 5px 12px; border-radius: 10px; color: var(--gold); font-weight: bold; }
        
        #display-zone { height: 100px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #timer-val { font-size: 70px; font-weight: 900; color: var(--gold); }
        #mult-val { font-size: 65px; font-weight: 900; transition: all 0.3s; }
        
        /* Pause Effect */
        .paused-result { animation: flash 0.5s ease-in-out infinite alternate; scale: 1.2; text-shadow: 0 0 20px var(--error); }
        @keyframes flash { from { opacity: 1; } to { opacity: 0.7; } }

        .track { height: 130px; background: #0d1117; border-radius: 15px; position: relative; overflow: hidden; border: 1px solid #2d333b; margin-bottom: 10px; }
        .camel-wrap { position: absolute; bottom: 10px; left: 0; transition: left 0.1s linear; }
        .camel { font-size: 50px; transform: scaleX(-1); }

        .controls { background: #0d1117; padding: 12px; border-radius: 15px; margin-bottom: 10px; transition: filter 0.3s; }
        .locked { filter: grayscale(1) blur(1px); pointer-events: none; }
        
        .input-group { display: flex; gap: 8px; margin-bottom: 10px; }
        .field { flex: 1; text-align: center; }
        .field label { display: block; font-size: 10px; color: #888; margin-bottom: 3px; }
        .field input { width: 100%; background: var(--input); border: 1px solid #333; color: white; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; }
        
        .main-btn { width: 100%; padding: 18px; border-radius: 12px; border: none; font-size: 20px; font-weight: 900; cursor: pointer; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cash { background: var(--error); color: white; }
        .btn-wait { background: #222; color: #555; }

        #history-box { display: flex; flex-wrap: wrap; gap: 5px; height: 70px; overflow-y: auto; }
        .hi { padding: 4px 10px; border-radius: 6px; font-size: 11px; background: #0d1117; font-weight: bold; border: 1px solid #222; }

        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:3000; justify-content:center; align-items:center; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 20px; width: 90%; max-width: 340px; text-align: center; }
        
        /* Hide Wallet Link Style */
        .secure-addr { background:#0d1117; padding:12px; border-radius:8px; word-break:break-all; color:var(--accent); font-family: monospace; font-size: 13px; border: 1px solid #333; margin: 15px 0; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div id="un" style="font-weight:bold; color:var(--accent)">Guest</div>
        <div style="display: flex; align-items: center;">
            <div class="balance-box">💰 <span id="ub">0.00</span></div>
            <button onclick="openDeposit()" style="background:var(--gold); border:none; width:30px; height:30px; border-radius:8px; margin-left:8px; cursor:pointer">+</button>
        </div>
    </div>

    <div id="display-zone">
        <div id="timer-val">5</div>
        <div id="mult-val" style="display: none;">1.00x</div>
    </div>

    <div class="track" id="tr">
        <div id="cw" class="camel-wrap"><div class="camel">🐪</div></div>
    </div>

    <div class="controls" id="ctrl">
        <div class="input-group">
            <div class="field"><label>Amount</label><input type="number" id="ba" value="10"></div>
            <div class="field"><label>Auto</label><input type="number" id="av" value="2.00"></div>
            <div class="field" style="flex:0.4"><label>Auto-ON</label>
                <input type="checkbox" id="auto-on" style="width:20px; height:20px; margin-top:5px;">
            </div>
        </div>
        <button id="ab" class="main-btn btn-bet" onclick="mainAction()">Place Bet</button>
    </div>

    <div id="history-box"></div>
</div>

<div id="deposit-modal" class="modal">
    <div class="modal-content">
        <h3 style="color:var(--gold)">Deposit USDT (TRC20)</h3>
        <p style="font-size:11px; color:#888; margin-top:10px;">Send USDT to the address below:</p>
        <div id="wallet-display" class="secure-addr">Loading...</div>
        <input type="text" id="tx-hash" placeholder="Transaction Hash" style="width:100%; padding:10px; margin-bottom:10px; background:#12191f; border:1px solid #333; color:white; border-radius:8px;">
        <button class="main-btn btn-bet" style="padding:12px; font-size:16px;" onclick="alert('Submitted for review')">Confirm Transfer</button>
        <button onclick="closeDeposit()" style="background:none; border:none; color:var(--error); margin-top:15px; cursor:pointer;">Close</button>
    </div>
</div>

<script>
    // Wallet Obfuscation (إخفاء الرابط عن طريق التشفير البسيط Base64)
    const _0x4f22 = "VEc5Z1QxcFBKSzNhRVRScDFoVnUyOEY1WmF5dTRvVnlFZw==";
    function getAddr() { return atob(_0x4f22); }

    const SB_URL = "https://uqmfwgdrlcqywxvdljlb.supabase.co";
    const SB_KEY = "sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT";
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let user = { balance: 1000, id: 'test' }; // Default for demo
    let state = 'waiting', nextT = 0, startT = 0, crashP = 0;
    let betted = false, cashed = false;

    function openDeposit() { 
        document.getElementById('wallet-display').innerText = getAddr();
        document.getElementById('deposit-modal').style.display = 'flex'; 
    }
    function closeDeposit() { document.getElementById('deposit-modal').style.display = 'none'; }

    function getCrash() {
        let r = Math.random() * 100;
        if (r <= 3) return 1.00;
        let s = Math.random() * 100;
        if (s <= 70) return parseFloat((1.01 + Math.random() * 1.5).toFixed(2));
        return parseFloat((2.0 + Math.random() * 48.0).toFixed(2));
    }

    function engine() {
        setInterval(() => {
            const now = Date.now();
            
            if (state === 'paused') {
                // نظام التوقف المؤقت لرؤية النتيجة
                return; 
            }

            if (now < nextT) {
                state = 'waiting';
                document.getElementById('timer-val').innerText = Math.ceil((nextT - now)/1000);
                document.getElementById('timer-val').style.display = 'block';
                document.getElementById('mult-val').style.display = 'none';
                document.getElementById('mult-val').classList.remove('paused-result');
                document.getElementById('ctrl').classList.remove('locked');
                resetScene();
            } else if (startT > 0) {
                state = 'racing';
                document.getElementById('ctrl').classList.add('locked');
                let el = (now - startT)/1000;
                let m = Math.pow(1.09, el);

                if (m >= crashP) {
                    doExplosion(crashP);
                } else {
                    document.getElementById('timer-val').style.display = 'none';
                    const mv = document.getElementById('mult-val');
                    mv.style.display = 'block'; 
                    mv.innerText = m.toFixed(2) + 'x';
                    document.getElementById('cw').style.left = Math.min(el * 6, 85) + '%';
                    
                    // Auto Cashout Logic
                    if (betted && !cashed && document.getElementById('auto-on').checked) {
                        if (m >= parseFloat(document.getElementById('av').value)) doCashout(m);
                    }
                }
            } else { 
                crashP = getCrash(); 
                startT = Date.now(); 
                cashed = false; 
            }
        }, 50);
    }

    function doExplosion(p) {
        state = 'paused'; // تفعيل وضع التوقف
        const mv = document.getElementById('mult-val');
        mv.innerText = p.toFixed(2) + 'x';
        mv.style.color = 'var(--error)';
        mv.classList.add('paused-result'); // تمييز النتيجة
        
        // حفظ النتيجة في السجل
        addHistory(p);

        // العودة للعد التنازلي بعد 3 ثوانٍ من التوقف
        setTimeout(() => {
            startT = 0;
            cashed = false;
            betted = false;
            nextT = Date.now() + 5000;
            state = 'waiting';
        }, 3000); 
    }

    function doCashout(m) {
        if (cashed || !betted) return;
        cashed = true;
        let win = parseFloat(document.getElementById('ba').value) * m;
        user.balance += win;
        document.getElementById('ub').innerText = user.balance.toFixed(2);
        document.getElementById('ab').innerText = "WON: " + win.toFixed(2);
        document.getElementById('ab').className = "main-btn btn-wait";
    }

    function mainAction() {
        if (state === 'waiting' && !betted) {
            let amt = parseFloat(document.getElementById('ba').value);
            if (user.balance >= amt) {
                user.balance -= amt;
                betted = true;
                document.getElementById('ub').innerText = user.balance.toFixed(2);
                document.getElementById('ab').innerText = "Betting...";
                document.getElementById('ab').className = "main-btn btn-wait";
            }
        } else if (state === 'racing' && betted && !cashed) {
            doCashout(parseFloat(document.getElementById('mult-val').innerText));
        }
    }

    function resetScene() {
        document.getElementById('cw').style.left = '0%';
        document.getElementById('cw').style.opacity = '1';
        document.getElementById('mult-val').style.color = 'white';
        if (!betted) {
            document.getElementById('ab').innerText = "Place Bet";
            document.getElementById('ab').className = "main-btn btn-bet";
        }
    }

    function addHistory(p) {
        const box = document.getElementById('history-box');
        const item = document.createElement('div');
        item.className = 'hi';
        item.style.color = p < 2 ? 'var(--error)' : 'var(--accent)';
        item.innerText = p.toFixed(2) + 'x';
        box.prepend(item);
        if (box.children.length > 50) box.lastChild.remove(); // الالتزام بآخر 50 دخول كما في ذاكرتك
    }

    // Start
    engine();
</script>
</body>
</html>
