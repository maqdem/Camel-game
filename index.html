<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Ahoul - سباق الهجن</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --green: #22c55e; --red: #ef4444; }
        body { font-family: sans-serif; background: var(--bg-dark); color: white; margin: 0; padding: 10px; text-align: center; }
        
        .login-card { max-width: 400px; margin: 80px auto; background: var(--card-bg); padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .main-game { max-width: 450px; margin: auto; background: var(--card-bg); border-radius: 20px; overflow: hidden; display: none; }
        
        /* واجهة الدخول */
        input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; text-align: center; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 18px; }
        .btn-login { background: var(--green); color: white; }

        /* منطقة السباق */
        .race-track { height: 220px; background: linear-gradient(to bottom, #020617, #1e293b); position: relative; overflow: hidden; border-bottom: 4px solid #c2914d; }
        #multiplier { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); font-size: 50px; font-weight: bold; color: var(--green); z-index: 10; }
        
        /* الجمل المتحرك */
        .camel-box { position: absolute; left: 10%; bottom: 20px; width: 70px; transform: scaleX(-1); transition: left 0.1s linear; }
        .camel-body { font-size: 60px; display: inline-block; }
        .running { animation: run-shake 0.3s infinite alternate; }
        @keyframes run-shake { from { transform: translateY(0); } to { transform: translateY(-10px); } }

        .controls { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>

<div id="login-ui" class="login-card">
    <h2 style="margin-bottom:20px;">تسجيل الدخول</h2>
    <input type="text" id="user-input" placeholder="اسم المستخدم (eya)">
    <input type="password" id="pass-input" placeholder="كلمة السر">
    <button onclick="attemptLogin()" class="btn-login" id="login-btn">دخول</button>
</div>

<div id="game-ui" class="main-game">
    <div style="padding:15px; display:flex; justify-content:space-between; background:#111827;">
        <span id="display-name"></span>
        <span style="color:#fbbf24">💰 <span id="display-balance">0</span></span>
    </div>

    <div class="race-track">
        <div id="multiplier">1.00x</div>
        <div id="camel-div" class="camel-box">
            <span class="camel-body">🐪</span>
        </div>
    </div>

    <div class="controls">
        <input type="number" id="bet-amt" value="10">
        <input type="number" id="guess-amt" value="2.0">
        <button id="action-btn" onclick="handleGame()" class="btn-login" style="grid-column: span 2;">Run</button>
    </div>
</div>

<script>
    // إعدادات Supabase
    const S_URL = 'https://uqmfwgdrlcqywxvdljlb.supabase.co';
    const S_KEY = 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT';
    const _supabase = supabase.createClient(S_URL, S_KEY);

    let currentBalance, currentUser, gameLoop, mult = 1.0;

    async function attemptLogin() {
        const u = document.getElementById('user-input').value.trim();
        const p = document.getElementById('pass-input').value.trim();
        const btn = document.getElementById('login-btn');

        if(!u || !p) return alert("يرجى إدخال البيانات");

        btn.innerText = "جاري الاتصال...";
        btn.disabled = true;

        try {
            const { data, error } = await _supabase
                .from('Profiles')
                .select('*')
                .eq('username', u)
                .eq('password', p)
                .single();

            if (error || !data) {
                alert("فشل الدخول: تأكد من اسم المستخدم وكلمة السر");
                btn.innerText = "دخول";
                btn.disabled = false;
            } else {
                currentUser = data.username;
                currentBalance = data.balance;
                document.getElementById('login-ui').style.display = 'none';
                document.getElementById('game-ui').style.display = 'block';
                updateHeader();
            }
        } catch (err) {
            console.error(err);
            alert("خطأ في الاتصال بالسيرفر");
            btn.innerText = "دخول";
            btn.disabled = false;
        }
    }

    function updateHeader() {
        document.getElementById('display-name').innerText = currentUser;
        document.getElementById('display-balance').innerText = Math.floor(currentBalance);
    }

    function handleGame() {
        const btn = document.getElementById('action-btn');
        if (btn.innerText === "Run") startRound();
        else cashOut();
    }

    function startRound() {
        let bet = parseFloat(document.getElementById('bet-amt').value);
        if (bet > currentBalance) return alert("رصيدك غير كافٍ");

        currentBalance -= bet;
        updateHeader();

        const btn = document.getElementById('action-btn');
        const camel = document.getElementById('camel-div');
        const mText = document.getElementById('multiplier');

        btn.innerText = "Cash Out";
        btn.style.background = "#ef4444";
        camel.classList.add('running');
        mult = 1.0;
        let crashPoint = (Math.random() * 4 + 1.1).toFixed(2);

        gameLoop = setInterval(() => {
            mult = parseFloat((mult + 0.04).toFixed(2));
            mText.innerText = mult + "x";
            camel.style.left = Math.min(10 + (mult * 10), 80) + "%";

            if (mult >= crashPoint) stopGame(false);
        }, 100);
    }

    async function cashOut() {
        clearInterval(gameLoop);
        let win = mult * parseFloat(document.getElementById('bet-amt').value);
        currentBalance += win;
        updateHeader();
        await _supabase.from('Profiles').update({ balance: Math.floor(currentBalance) }).eq('username', currentUser);
        stopGame(true);
    }

    function stopGame(isWin) {
        clearInterval(gameLoop);
        const btn = document.getElementById('action-btn');
        const camel = document.getElementById('camel-div');
        
        camel.classList.remove('running');
        if (!isWin) {
            document.getElementById('multiplier').style.color = "#ef4444";
            document.getElementById('multiplier').innerText = "💥 " + mult + "x";
        }

        btn.disabled = true;
        setTimeout(() => {
            btn.disabled = false;
            btn.innerText = "Run";
            btn.style.background = "#22c55e";
            document.getElementById('multiplier').style.color = "#22c55e";
            camel.style.left = "10%";
        }, 2000);
    }
</script>

</body>
</html>
