<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bet Ahoul - Camel Rider Edition</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --main-bg:#0d1117;
  --card-bg:#161b22;
  --accent:#00ff88;
  --danger:#ff4d4d;
  --gold:#fbbf24;
}

body {
  font-family:'Segoe UI',sans-serif;
  background:var(--main-bg);
  color:white;
  margin:0;
  padding:10px;
  display:flex;
  justify-content:center;
}

.app {
  width:100%;
  max-width:450px;
  background:var(--card-bg);
  border-radius:24px;
  overflow:hidden;
  border:1px solid #30363d;
  box-shadow:0 15px 40px rgba(0,0,0,.6);
}

/* ===== السباق ===== */
.race-arena {
  height:260px;
  background:linear-gradient(180deg,#020617 0%,#161b22 100%);
  position:relative;
  overflow:hidden;
  border-bottom:5px solid #8c5a2b;
}

#multiplier {
  position:absolute;
  top:15%;
  left:50%;
  transform:translateX(-50%);
  font-size:55px;
  font-weight:900;
  color:var(--accent);
  z-index:10;
  text-shadow:0 0 20px rgba(0,255,136,.4);
}

/* ===== الجمل ===== */
.camel-container {
  position:absolute;
  left:10%;
  bottom:10px;
  width:160px;
  transform:scaleX(-1);
  transition:left .1s linear;
}

.running svg {
  animation:bounce .4s infinite alternate;
}

@keyframes bounce {
  from { transform:translateY(0); }
  to   { transform:translateY(-6px); }
}

/* ===== الواجهة ===== */
.stats-bar {
  padding:12px 18px;
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  background:#0d1117;
  border-bottom:1px solid #30363d;
}

.controls {
  padding:20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

input {
  background:#0d1117;
  border:1px solid #30363d;
  color:white;
  padding:14px;
  border-radius:12px;
  text-align:center;
  font-size:18px;
}

button {
  grid-column:span 2;
  padding:18px;
  border-radius:15px;
  border:none;
  font-weight:900;
  font-size:20px;
  cursor:pointer;
}

.run-btn {
  background:var(--accent);
  color:#000;
}

.cash-btn {
  background:var(--danger);
  color:white;
}
</style>
</head>

<body>

<!-- ===== تسجيل الدخول ===== -->
<div id="login-ui" style="text-align:center;padding-top:100px;width:320px;">
  <h2 style="color:var(--accent);margin-bottom:25px;">Bet Ahoul</h2>
  <input id="user-in" placeholder="اسم المستخدم" style="margin-bottom:12px;">
  <input id="pass-in" type="password" placeholder="كلمة السر">
  <button onclick="login()" class="run-btn" style="margin-top:15px;">دخول</button>
</div>

<!-- ===== اللعبة ===== -->
<div id="game-ui" class="app" style="display:none;">
  <div class="stats-bar">
    <span style="color:var(--gold)">💰 <span id="u-bal">0</span></span>
    <span id="u-name" style="opacity:.8"></span>
  </div>

  <div class="race-arena">
    <div id="multiplier">1.00x</div>

    <!-- الجمل بالصورة الأصلية داخل SVG -->
    <div id="camel-actor" class="camel-container">
      <svg viewBox="0 0 400 287" xmlns="http://www.w3.org/2000/svg">
        <image href="camel.png"
               width="400"
               height="287"
               preserveAspectRatio="xMidYMid meet"/>
