<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سباق الهجن - جاهز للتشغيل</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b141a; color: white; text-align: center; margin: 0; padding: 20px; }
        .box { background: #1c262d; padding: 25px; border-radius: 20px; max-width: 380px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #2d333b; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #2d333b; background: #12191f; color: white; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 18px; transition: 0.3s; margin-top: 10px; }
        .btn-login { background: #238636; color: white; }
        .btn-login:hover { background: #2ea043; }
        #game-ui { display: none; }
        .sky { background: linear-gradient(to top, #2c1e12, #5d4037); height: 160px; border-radius: 15px; position: relative; margin: 15px 0; overflow: hidden; border: 2px solid #12191f; }
        .camel { width: 80px; height: 80px; position: absolute; left: 10px; bottom: 10px; background-size: contain; background-repeat: no-repeat; 
            background-image: url('data:image/jpeg;base64,/9j/4QCARXhpZgAATU0AKgAAAAgABAEAAAQAAAABAAABkAEBAAQAAAABAAABLAEyAAIAAAAUAAAAPodpAAQAAAABAAAAUgAAAAAyMDI2OjAxOjE2IDA3OjE5OjQ1AAABkAMAAgAAABQAAABkAAAAADIwMjY6MDE6MTYgMDc6MTk6MDEA/+AAEEpGSUYAAQEAAAEAAQAA/+IB2ElDQ19QUk9GSUxFAAEBAAAByAAAAAAEMAAAbW50clJHQiBYWVogB+AAAQABAAAAAAAAYWNzcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAAPbWAAEAAAAA0y0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAJZGVzYwAAAPAAAAAkclhZWgAAARQAAAAUZ1hZWgAAASgAAAAUYlhZWgAAATwAAAAUd3RwdAAAAVAAAAAUclRSQwAAAWQAAAAoZ1RSQwAAAWQAAAAoYlRSQwAAAWQAAAAoY3BydAAAAYwAAAA8bWx1YwAAAAAAAAABAAAADGVuVVMAAAAIAAAAHABzAFIARwBCWFlaIAAAAAAAAG+iAAA49QAAA5BYWVogAAAAAAAAYpkAALeFAAAY2lhZWiAAAAAAAAAkoAAAD4QAALbPWFlaIAAAAAAAAPbWAAEAAAAA0y1wYXJhAAAAAAAEAAAAAmZmAADypwAADVkAABPQAAAKWwAAAAAAAAAAbWx1YwAAAAAAAAABAAAADGVuVVMAAAAgAAAAHABHAG8AbwBnAGwAZQAgAEkAbgBjAC4AIAAyADAAMQA2/9sAQwADAgIDAgIDAwMDBAMDBAUIBQUEBAUKBwcGCAwKDAwLCgsLDQ4SEA0OEQ4LCxAWEBETFBUVFQwPFxgWFBgSFBUU/9sAQwEDBAQFBAUJBQUJFA0LDRQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQU/8AAEQgBLAGQAwEiAAIRAQMRAf/EAB4AAQACAgMBAQEAAAAAAAAAAAAGCAUHAwQJAQIK/8QAWRAAAQMDAgQCBgQICAgKCwAAAQACAwQFEQYhBxIxQRNRCBQiQiQMHTHB8P/');
        }
    </style>
</head>
<body>

<div id="login-ui" class="box">
    <h2 style="margin-bottom: 20px;">دخول المتسابقين</h2>
    <input type="text" id="user" placeholder="اسم المستخدم">
    <input type="password" id="pass" placeholder="كلمة السر">
    <button onclick="doLogin()" id="login-btn" class="btn-login">دخول الآن</button>
</div>

<div id="game-ui" class="box">
    <div style="display:flex; justify-content:space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px;">
        <span id="name-tag" style="font-weight: bold; color: #8b949e;"></span>
        <span style="color:#e3b341; font-weight: bold; font-size: 1.2em;">💰 <span id="bal-tag">0</span></span>
    </div>
    <h1 id="mult-text" style="font-size: 60px; color: #00ff88; margin: 20px 0; text-shadow: 0 0 15px rgba(0,255,136,0.2);">1.00x</h1>
    <div class="sky">
        <div id="camel-img" class="camel"></div>
    </div>
    <div style="background: #12191f; padding: 15px; border-radius: 12px;">
        <input type="number" id="amount" value="10" style="text-align: center;">
        <button id="action-btn" class="btn-login" style="margin-top: 5px;">رهان</button>
    </div>
</div>

<script>
    // إعدادات الربط المحدثة
    const URL = 'https://uqmfwgdrlcqywxvdljlb.supabase.co';
    const KEY = 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT';
    const client = supabase.createClient(URL, KEY);

    async function doLogin() {
        const u = document.getElementById('user').value.trim();
        const p = document.getElementById('pass').value.trim();
        const btn = document.getElementById('login-btn');

        if(!u || !p) return alert("الرجاء إدخال البيانات");
        btn.innerText = "جاري الدخول...";

        try {
            // جلب البيانات من جدول Profiles المحدث
            const { data, error } = await client
                .from('Profiles')
                .select('*')
                .eq('username', u)
                .eq('password', p);

            if (error) throw error;

            if (data && data.length > 0) {
                const userData = data[0];
                document.getElementById('login-ui').style.display = 'none';
                document.getElementById('game-ui').style.display = 'block';
                document.getElementById('name-tag').innerText = userData.username;
                document.getElementById('bal-tag').innerText = Math.floor(userData.balance);
                alert("مرحباً بك يا " + userData.username + "! بالتوفيق في السباق.");
            } else {
                alert("اسم المستخدم أو كلمة السر غير صحيحة");
                btn.innerText = "دخول الآن";
            }
        } catch (err) {
            console.error(err);
            alert("فشل في مزامنة البيانات: " + err.message);
            btn.innerText = "دخول الآن";
        }
    }
</script>
</body>
</html>
