<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐪 سباق الهجن برو 2026 | النسخة الاحترافية</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; justify-content: center; height: 100vh; }
        .app-container { width: 100%; max-width: 450px; background: var(--card); position: relative; display: flex; flex-direction: column; padding: 15px; overflow-y: auto; }
        
        /* شاشة السباق */
        .game-display { text-align: center; padding: 40px 0; background: #12191f; border-radius: 20px; margin-bottom: 20px; border: 1px solid #333; }
        #timer-val { font-size: 80px; font-weight: 900; color: var(--gold); }
        #mult-val { font-size: 70px; font-weight: 900; color: var(--accent); display: none; }
        
        /* المضمار */
        .track { height: 120px; background: url('https://www.transparenttextures.com/patterns/sandpaper.png'), #1a2228; border-radius: 15px; position: relative; overflow: hidden; margin-bottom: 20px; border-bottom: 4px solid #3e3121; }
        .camel { position: absolute; bottom: 10px; left: 0%; font-size: 50px; transition: left 0.1s linear; transform: scaleX(-1); }

        /* الأزرار والتحكم */
        .controls { display: grid; gap: 10px; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: none; background: #0b141a; color: white; text-align: center; font-size: 18px; box-sizing: border-box; }
        .btn { width: 100%; padding: 18px; border-radius: 12px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cash { background: var(--error); color: #fff; }
        .btn-disabled { background: #444; color: #888; cursor: not-allowed; }

        /* قسم الإيداع */
        .deposit-box { margin-top: 30px; padding: 15px; background: #12191f; border-radius: 15px; border: 1px dashed #555; }
        .wallet-addr { font-family: monospace; color: var(--gold); background: #000; padding: 5px; border-radius: 5px; font-size: 11px; }
    </style>
</head>
<body>

<div class="app-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <div style="color: var(--gold); font-weight: bold;">💰 رصيدك: $<span id="user-balance">0.00</span></div>
        <div style="font-size: 12px; color: #888;">ID: <span id="user-id">...</span></div>
    </div>

    <div class="game-display">
        <div id="timer-val">5</div>
        <div id="mult-val">1.00x</div>
    </div>

    <div class="track">
        <div id="camel" class="camel">🐪</div>
    </div>

    <div class="controls">
        <input type="number" id="bet-amount" value="10" min="1">
        <button id="main-btn" class="btn btn-bet" onclick="handleMainAction()">وضع رهان</button>
    </div>

    <div class="deposit-box">
        <h4 style="margin-top:0; color: var(--gold);">📥 شحن رصيد آلي (USDT TRC20)</h4>
        <p style="font-size: 11px;">أرسل للمحفظة: <span class="wallet-addr">TG9gT1pPJK3aETRp1hVu28F5Zayu4oVyEg</span></p>
        <input type="text" id="tx-hash" placeholder="الصق الـ Transaction Hash هنا" style="font-size: 14px; margin-bottom: 10px;">
        <button onclick="verifyDeposit()" id="dep-btn" class="btn" style="background: #333; color: white; padding: 10px; font-size: 14px;">تأكيد الإيداع</button>
    </div>
</div>

<script>
    // إعدادات الاتصال بالسيرفر
    const SB_URL = "https://uqmfwgdrlcqywxvdljlb.supabase.co";
    const SB_KEY = "sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT";
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let currentState = 'waiting', crashPoint = 0, serverStartTime = 0;
    let isBetted = false, isCashedOut = false, currentMultiplier = 1.00;
    let user = { id: 'guest-' + Math.floor(Math.random()*1000), balance: 100.00 }; // تجريبي

    // 1. المزامنة مع الـ Edge Function
    async function syncWithServer() {
        try {
            const { data } = await sb.functions.invoke('smart-function');
            crashPoint = data.crashPoint;
            serverStartTime = data.serverTime;
            startRound();
        } catch (e) {
            console.error("Sync Error:", e);
            setTimeout(syncWithServer, 2000);
        }
    }

    function startRound() {
        currentState = 'racing';
        document.getElementById('timer-val').style.display = 'none';
        document.getElementById('mult-val').style.display = 'block';
        document.getElementById('mult-val').style.color = 'var(--accent)';
    }

    // 2. المحرك الرئيسي (Engine) لضمان عدم وجود لاج
    setInterval(() => {
        if (currentState === 'racing') {
            const elapsed = (Date.now() - serverStartTime) / 1000;
            currentMultiplier = Math.pow(1.075, elapsed); // معادلة النمو الأسي

            if (currentMultiplier >= crashPoint) {
                handleCrash();
            } else {
                renderUpdate(elapsed, currentMultiplier);
            }
        }
    }, 30);

    function renderUpdate(elapsed, mult) {
        document.getElementById('mult-val').innerText = mult.toFixed(2) + 'x';
        document.getElementById('camel').style.left = Math.min(elapsed * 10, 85) + '%';
        
        const btn = document.getElementById('main-btn');
        if (isBetted && !isCashedOut) {
            btn.innerText = `سحب ${(mult * document.getElementById('bet-amount').value).toFixed(2)}$`;
            btn.className = "btn btn-cash";
        }
    }

    function handleCrash() {
        currentState = 'crashed';
        const mv = document.getElementById('mult-val');
        mv.innerText = crashPoint.toFixed(2) + 'x';
        mv.style.color = 'var(--error)';
        
        const btn = document.getElementById('main-btn');
        btn.innerText = "انفجار (Crashed)";
        btn.className = "btn btn-disabled";

        setTimeout(() => {
            resetUI();
            syncWithServer();
        }, 4000);
    }

    function resetUI() {
        document.getElementById('timer-val').style.display = 'block';
        document.getElementById('mult-val').style.display = 'none';
        document.getElementById('camel').style.left = '0%';
        isBetted = false; isCashedOut = false;
        document.getElementById('main-btn').innerText = "وضع رهان";
        document.getElementById('main-btn').className = "btn btn-bet";
    }

    // 3. نظام الإيداع والتحقق عبر smooth-processor
    async function verifyDeposit() {
        const hash = document.getElementById('tx-hash').value;
        const btn = document.getElementById('dep-btn');
        if(!hash) return alert("أدخل الهاش أولاً");

        btn.innerText = "جاري التحقق...";
        const { data, error } = await sb.functions.invoke('smooth-processor', {
            body: { txHash: hash, userId: user.id, amount: 1 }
        });

        if(data?.success) {
            alert("تم الشحن بنجاح!");
            location.reload();
        } else {
            alert("فشل التحقق: " + (error || "المعاملة غير صحيحة"));
            btn.innerText = "تأكيد الإيداع";
        }
    }

    async function handleMainAction() {
        if (currentState === 'racing' && isBetted && !isCashedOut) {
            isCashedOut = true;
            alert(`مبروك! ربحت ${(currentMultiplier * document.getElementById('bet-amount').value).toFixed(2)}$`);
            resetUI();
        } else if (!isBetted) {
            isBetted = true;
            document.getElementById('main-btn').innerText = "انتظر السحب...";
        }
    }

    // التشغيل الأولي
    syncWithServer();
    document.getElementById('user-id').innerText = user.id;
</script>

</body>
</html>
