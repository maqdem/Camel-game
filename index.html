<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن - النسخة الاحترافية</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .app-container { width: 95%; max-width: 420px; background: var(--card); padding: 20px; border-radius: 24px; text-align: center; position: relative; }
        
        #main-timer { font-size: 90px; font-weight: 900; color: var(--gold); margin: 20px 0; }
        .multiplier { font-size: 70px; font-weight: 900; color: var(--accent); margin: 15px 0; display: none; }
        
        .track { 
            height: 140px; background: #12191f; border-radius: 18px; position: relative; border: 2px solid #2d333b; margin: 15px 0; overflow: hidden; 
            background-image: linear-gradient(90deg, transparent 50%, rgba(255,255,255,0.05) 50%);
            background-size: 40px 100%;
        }
        .camel { position: absolute; bottom: 20px; left: 0; font-size: 55px; z-index: 2; transition: left 0.1s linear; }

        .controls { background: #0d1117; padding: 15px; border-radius: 18px; margin-bottom: 20px; }
        .input-field { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #333; background: #1c262d; color: white; text-align: center; margin: 8px 0; font-size: 18px; }
        
        button { width: 100%; padding: 18px; border-radius: 14px; border: none; font-size: 20px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cashout { background: var(--error); color: white; }
        .btn-waiting { background: #222; color: #555; }

        /* سجل الجولات المطور */
        .history-list { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; justify-content: flex-start; flex-direction: row-reverse; }
        .history-item { min-width: 65px; padding: 8px; border-radius: 10px; font-weight: bold; font-size: 13px; background: #12191f; border: 1px solid rgba(0,255,136,0.2); color: var(--accent); }
        .hist-crash { color: var(--error); border-color: rgba(255,75,75,0.2); }

        .win-badge { position: absolute; background: var(--accent); color: #000; padding: 6px 12px; border-radius: 10px; font-weight: 900; z-index: 10; animation: floatUp 1.5s forwards; }
        @keyframes floatUp { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-60px); } }
    </style>
</head>
<body>

<div class="app-container">
    <div id="game-screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span id="player-name" style="color:#888">Admin</span>
            <div style="color: var(--gold); font-weight: bold; font-size: 20px;">💰 <span id="player-balance">1000.00</span></div>
        </div>

        <div id="main-timer">4</div>
        <div id="mult-display" class="multiplier">1.00x</div>
        
        <div class="track" id="track-box"><div id="camel" class="camel">🐪</div></div>

        <div class="controls">
            <input type="number" id="bet-amount" class="input-field" value="10">
            <button id="action-btn" class="btn-bet" onclick="handleAction()">رهان للسباق القادم</button>
        </div>

        <div id="history-list" class="history-list"></div>
    </div>
</div>

<script>
    // إعدادات افتراضية (استبدلها ببيانات Supabase الخاصة بك)
    let balance = 1000, betPlaced = false, userInBet = false, hasCashedOut = false, lastBet = 0;
    let bgPos = 0, currentRoundId = -1;

    const CYCLE = 20; // طول الدورة الافتراضي
    const WAIT = 5;   // وقت الانتظار

    function generateCrash(seed) {
        let h = Math.abs(Math.sin(seed) * 10000);
        let r = h - Math.floor(h);
        return Math.min(parseFloat((0.98 / (1 - r * 0.98)).toFixed(2)), 700);
    }

    function startEngine() {
        setInterval(() => {
            const now = Date.now() / 1000;
            const cyclePos = now % CYCLE;
            const roundId = Math.floor(now / CYCLE);
            const crashPoint = generateCrash(roundId);

            if (cyclePos < WAIT) {
                // مرحلة الانتظار
                if (currentRoundId !== roundId) {
                    currentRoundId = roundId;
                    resetRound();
                }
                renderWaiting(Math.ceil(WAIT - cyclePos));
            } else {
                // مرحلة السباق
                const elapsed = cyclePos - WAIT;
                const currentMult = Math.pow(1.15, elapsed);

                if (currentMult >= crashPoint) {
                    if (!window.logged) {
                        addToHistory(crashPoint.toFixed(2));
                        window.logged = true;
                    }
                    renderCrash(crashPoint);
                } else {
                    window.logged = false;
                    renderRacing(currentMult, elapsed);
                    
                    if (betPlaced && !userInBet) {
                        userInBet = true; betPlaced = false;
                        lastBet = parseFloat(document.getElementById('bet-amount').value);
                        balance -= lastBet; updateUI();
                    }
                }
            }
        }, 50);
    }

    function resetRound() {
        betPlaced = false; userInBet = false; hasCashedOut = false;
        document.getElementById('mult-display').style.color = "var(--accent)";
        document.getElementById('camel').style.left = "0%";
    }

    function renderWaiting(sec) {
        document.getElementById('main-timer').style.display = 'block';
        document.getElementById('mult-display').style.display = 'none';
        document.getElementById('main-timer').innerText = sec;
        document.getElementById('camel').style.left = "0%";
        updateButton(betPlaced ? "إلغاء الرهان" : "رهان للسباق القادم", betPlaced ? "btn-waiting" : "btn-bet");
    }

    function renderRacing(mult, elapsed) {
        document.getElementById('main-timer').style.display = 'none';
        const display = document.getElementById('mult-display');
        display.style.display = 'block';
        display.innerText = mult.toFixed(2) + "x";
        
        document.getElementById('camel').style.left = Math.min(elapsed * 4, 45) + "%";
        bgPos -= (4 + (mult / 2));
        document.getElementById('track-box').style.backgroundPosition = bgPos + "px 0px";

        if (userInBet && !hasCashedOut) {
            updateButton("سحب الأرباح", "btn-cashout", (mult * lastBet).toFixed(2));
        }
    }

    function renderCrash(cp) {
        const display = document.getElementById('mult-display');
        display.innerText = cp.toFixed(2) + "x";
        display.style.color = "var(--error)";
        updateButton("انفجر الجمل!", "btn-waiting");
    }

    function handleAction() {
        if (document.getElementById('main-timer').style.display === 'block') {
            betPlaced = !betPlaced;
        } else if (userInBet && !hasCashedOut) {
            const mult = parseFloat(document.getElementById('mult-display').innerText);
            cashOut(mult);
        }
    }

    function cashOut(mult) {
        hasCashedOut = true;
        const win = lastBet * mult;
        balance += win;
        showWinBadge(win.toFixed(2));
        updateUI();
        updateButton("تم السحب", "btn-waiting");
    }

    function showWinBadge(amt) {
        const b = document.createElement('div');
        b.className = 'win-badge';
        b.innerText = `+${amt}`;
        b.style.left = document.getElementById('camel').style.left;
        b.style.bottom = "70px";
        document.getElementById('track-box').appendChild(b);
        setTimeout(() => b.remove(), 1500);
    }

    function addToHistory(v) {
        const l = document.getElementById('history-list');
        const i = document.createElement('div');
        i.className = `history-item ${v < 2 ? 'hist-crash' : ''}`;
        i.innerText = v + 'x';
        l.insertBefore(i, l.firstChild);
        if (l.children.length > 10) l.removeChild(l.lastChild);
    }

    function updateUI() {
        document.getElementById('player-balance').innerText = balance.toFixed(2);
    }

    function updateButton(t, c, s="") {
        const b = document.getElementById('action-btn');
        b.className = c;
        b.innerHTML = s ? `<span>${t}</span><br><small>اربح الآن: ${s}</small>` : t;
    }

    startEngine();
</script>
</body>
</html>
