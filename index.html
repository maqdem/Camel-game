<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bet Ahoul - Camel Rider Edition</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --main-bg:#0d1117;
  --card-bg:#161b22;
  --accent:#00ff88;
  --danger:#ff4d4d;
  --gold:#fbbf24;
}

body {
  font-family:'Segoe UI',sans-serif;
  background:var(--main-bg);
  color:white;
  margin:0;
  padding:10px;
  display:flex;
  justify-content:center;
}

.app {
  width:100%;
  max-width:450px;
  background:var(--card-bg);
  border-radius:24px;
  overflow:hidden;
  border:1px solid #30363d;
  box-shadow:0 15px 40px rgba(0,0,0,.6);
}

/* ===== تسجيل الدخول ===== */
#login-ui {
  text-align:center;
  padding-top:100px;
  width:320px;
}

/* ===== السباق ===== */
.race-arena {
  height:260px;
  background:linear-gradient(180deg,#020617 0%,#161b22 100%);
  position:relative;
  overflow:hidden;
  border-bottom:5px solid #8c5a2b;
}

#multiplier {
  position:absolute;
  top:15%;
  left:50%;
  transform:translateX(-50%);
  font-size:55px;
  font-weight:900;
  color:var(--accent);
  z-index:10;
}

/* ===== الجمل ===== */
.camel-container {
  position:absolute;
  left:10%;
  bottom:10px;
  width:160px;
  transform:scaleX(-1);
  transition:left .1s linear;
}

.running svg {
  animation:bounce .4s infinite alternate;
}

@keyframes bounce {
  from { transform:translateY(0); }
  to   { transform:translateY(-6px); }
}

/* ===== الواجهة ===== */
.stats-bar {
  padding:12px 18px;
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  background:#0d1117;
  border-bottom:1px solid #30363d;
}

.controls {
  padding:20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

input {
  background:#0d1117;
  border:1px solid #30363d;
  color:white;
  padding:14px;
  border-radius:12px;
  text-align:center;
  font-size:18px;
}

button {
  grid-column:span 2;
  padding:18px;
  border-radius:15px;
  border:none;
  font-weight:900;
  font-size:20px;
  cursor:pointer;
}

.run-btn { background:var(--accent); color:#000; }
.cash-btn { background:var(--danger); color:white; }
</style>
</head>

<body>

<!-- ===== LOGIN ===== -->
<div id="login-ui">
  <h2 style="color:var(--accent);margin-bottom:25px;">Bet Ahoul</h2>
  <input id="user-in" placeholder="اسم المستخدم" style="margin-bottom:12px;">
  <input id="pass-in" type="password" placeholder="كلمة السر">
  <button onclick="login()" class="run-btn" style="margin-top:15px;">دخول</button>
</div>

<!-- ===== GAME ===== -->
<div id="game-ui" class="app" style="display:none;">
  <div class="stats-bar">
    <span style="color:var(--gold)">💰 <span id="u-bal">0</span></span>
    <span id="u-name" style="opacity:.8"></span>
  </div>

  <div class="race-arena">
    <div id="multiplier">1.00x</div>

    <div id="camel-actor" class="camel-container">
      <svg viewBox="0 0 400 287" xmlns="http://www.w3.org/2000/svg">
        <image href="camel.png" width="400" height="287"
               preserveAspectRatio="xMidYMid meet"/>
      </svg>
    </div>
  </div>

  <div class="controls">
    <input type="number" id="bet-amt" value="100">
    <input type="number" id="guess-amt" value="2.0">
    <button id="main-btn" onclick="handleGame()" class="run-btn">Run</button>
  </div>
</div>

<script>
/* ===== Supabase ===== */
const S_URL = 'https://uqmfwgdrlcqywxvdljlb.supabase.co';
const S_KEY = 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT';
const supa = supabase.createClient(S_URL, S_KEY);

/* ===== Elements ===== */
const loginUI    = document.getElementById('login-ui');
const gameUI     = document.getElementById('game-ui');
const uBal       = document.getElementById('u-bal');
const uName      = document.getElementById('u-name');
const betAmt     = document.getElementById('bet-amt');
const mainBtn    = document.getElementById('main-btn');
const camelActor = document.getElementById('camel-actor');
const multiplier = document.getElementById('multiplier');

/* ===== State ===== */
let bal = 0;
let user = '';
let gameTimer = null;
let currentX = 1.0;
let active = false;

/* ===== Login ===== */
async function login() {
  const u = document.getElementById('user-in').value.trim();
  const p = document.getElementById('pass-in').value.trim();

  const { data } = await supa
    .from('Profiles')
    .select('*')
    .eq('username', u)
    .eq('password', p)
    .single();

  if (!data) {
    alert("بيانات خاطئة!");
    return;
  }

  user = data.username;
  bal = data.balance;

  loginUI.style.display = 'none';
  gameUI.style.display = 'block';
  updateUI();
}

function updateUI() {
  uBal.innerText = Math.floor(bal);
  uName.innerText = '@' + user;
}

/* ===== Game ===== */
function handleGame() {
  if (!active) startGame();
  else cashOut();
}

function startGame() {
  const b = +betAmt.value;
  if (b <= 0 || b > bal) return alert("الرصيد لا يكفي");

  bal -= b;
  updateUI();

  active = true;
  currentX = 1.0;

  const crash = (Math.random() * 5.5 + 1.05).toFixed(2);

  mainBtn.innerText = "Cash Out";
  mainBtn.className = "cash-btn";
  camelActor.classList.add("running");

  gameTimer = setInterval(() => {
    currentX = +(currentX + 0.04).toFixed(2);
    multiplier.innerText = currentX + "x";
    camelActor.style.left = Math.min(10 + currentX * 12, 75) + "%";

    if (currentX >= crash) stopGame(false);
  }, 100);
}

async function cashOut() {
  clearInterval(gameTimer);
  bal += currentX * (+betAmt.value);
  await supa.from('Profiles')
    .update({ balance: Math.floor(bal) })
    .eq('username', user);
  stopGame(true);
}

function stopGame(win) {
  clearInterval(gameTimer);
  active = false;
  camelActor.classList.remove("running");

  if (!win) {
    multiplier.style.color = "var(--danger)";
    multiplier.innerText = "Crash! " + currentX + "x";
  }

  mainBtn.disabled = true;
  setTimeout(() => {
    mainBtn.disabled = false;
    mainBtn.innerText = "Run";
    mainBtn.className = "run-btn";
    multiplier.style.color = "var(--accent)";
    camelActor.style.left = "10%";
  }, 2000);
}
</script>

</body>
</html>
