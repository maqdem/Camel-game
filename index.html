<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام دخول سباق الهجن</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; text-align: center; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 15px; width: 320px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #27ae60; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #252525; color: white; box-sizing: border-box; outline: none; }
        input:focus { border-color: #27ae60; }
        button { width: 100%; padding: 12px; background: #27ae60; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2ecc71; }
        #status { margin-top: 15px; font-size: 14px; min-height: 20px; }
        .balance-box { font-size: 32px; color: #f1c40f; margin: 20px 0; font-weight: bold; }
        .success-text { color: #2ecc71; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card" id="app-container">
    <div id="login-form">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="username" placeholder="اسم المستخدم">
        <input type="password" id="password" placeholder="كلمة السر">
        <button onclick="handleLogin()">دخول ومزامنة الرصيد</button>
        <p id="status"></p>
    </div>
</div>

<script>
    // إعدادات الربط بمشروعك
    const SUPABASE_URL = 'https://uqmfwgdrlcqywxvdljlb.supabase.co';
    const SUPABASE_KEY = 'Sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT'; 

    // إنشاء عميل الاتصال
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function handleLogin() {
        const userField = document.getElementById('username').value;
        const passField = document.getElementById('password').value;
        const statusMsg = document.getElementById('status');
        
        if (!userField || !passField) {
            statusMsg.innerText = "يرجى إدخال البيانات كاملة";
            statusMsg.style.color = "#e74c3c";
            return;
        }

        statusMsg.innerText = "جاري الاتصال بقاعدة البيانات...";
        statusMsg.style.color = "#f1c40f";

        // البحث عن اللاعب في جدول Profiles
        const { data, error } = await _supabase
            .from('Profiles')
            .select('*')
            .eq('username', userField)
            .eq('password', passField)
            .single();

        if (data) {
            // تحديث الشاشة عند نجاح الدخول
            document.getElementById('app-container').innerHTML = `
                <div class="success-text">تم الاتصال بنجاح ✅</div>
                <h3>أهلاً بك، ${data.username}</h3>
                <div class="balance-box">💰 ${data.balance}</div>
                <p style="font-size:12px; color:#888;">بياناتك متزامنة مع Supabase</p>
                <button onclick="location.reload()" style="background:#e67e22; margin-top:10px;">تسجيل الخروج</button>
            `;
        } else {
            // في حال وجود خطأ
            statusMsg.style.color = "#e74c3c";
            statusMsg.innerText = "خطأ: اسم المستخدم أو كلمة السر غير صحيحة";
            console.error("Supabase Error:", error);
        }
    }
</script>
</body>
</html>
