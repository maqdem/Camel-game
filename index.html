<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن العالمي - النسخة النهائية</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-y: auto; padding: 20px 0; }
        .app-container { width: 95%; max-width: 420px; background: var(--card); padding: 20px; border-radius: 24px; border: 1px solid #2d333b; text-align: center; position: relative; }
        
        #main-timer { font-size: 80px; font-weight: 900; color: var(--gold); margin: 20px 0; }
        .multiplier { font-size: 65px; font-weight: 900; color: var(--accent); margin: 15px 0; display: none; }
        
        .track { height: 100px; background: #12191f; border-radius: 18px; position: relative; overflow: hidden; border: 2px solid #2d333b; margin: 15px 0; }
        .camel { position: absolute; bottom: 10px; left: 0; font-size: 50px; transition: left 0.1s linear; }
        
        .controls { background: #0d1117; padding: 15px; border-radius: 18px; margin-bottom: 20px; }
        .input-field { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #1c262d; color: white; text-align: center; font-size: 18px; }
        
        button { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 20px; font-weight: 900; cursor: pointer; transition: 0.2s; position: relative; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cancel { background: #444; color: white; }
        .btn-cashout { background: var(--error); color: white; display: flex; flex-direction: column; line-height: 1.2; }
        .btn-waiting { background: #222; color: #555; cursor: not-allowed; }

        .balance-container { color: var(--gold); font-weight: bold; font-size: 18px; transition: all 0.3s ease; }
        .balance-up { transform: scale(1.3); color: var(--accent) !important; }

        /* سجل الجولات */
        .history-section { text-align: right; margin-top: 10px; border-top: 1px solid #2d333b; padding-top: 15px; }
        .history-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; flex-wrap: wrap; justify-content: center; }
        .history-item { padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 14px; background: #12191f; min-width: 55px; text-align: center; }
        .mult-low { color: var(--error); border: 1px solid rgba(255,75,75,0.2); }
        .mult-mid { color: var(--accent); border: 1px solid rgba(0,255,136,0.2); }
        
        .win-float { position: absolute; font-weight: bold; color: var(--accent); animation: floatUp 1s forwards; pointer-events: none; z-index: 100; text-shadow: 0 0 10px rgba(0,255,136,0.5); }
        @keyframes floatUp { 0% { transform: translate(-50%, 0); opacity: 1; font-size: 20px; } 100% { transform: translate(-50%, -120px); opacity: 0; font-size: 35px; } }
    </style>
</head>
<body>

<div class="app-container">
    <div id="auth-screen">
        <h2>تسجيل الدخول 🐪</h2>
        <input type="text" id="username" class="input-field" placeholder="اسم المستخدم">
        <input type="password" id="password" class="input-field" placeholder="كلمة السر">
        <button class="btn-bet" onclick="handleLogin()">دخول</button>
    </div>

    <div id="game-screen" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span id="player-name" style="color: #888;">---</span>
            <div id="balance-wrap" class="balance-container">💰 <span id="player-balance">0.00</span></div>
        </div>

        <div id="main-timer">5</div>
        <div id="mult-display" class="multiplier">1.00x</div>
        
        <div class="track"><div id="camel" class="camel">🐪</div></div>

        <div class="controls">
            <input type="number" id="bet-amount" class="input-field" value="10">
            <button id="action-btn" class="btn-bet" onclick="handleAction()">رهان</button>
        </div>

        <div class="history-section">
            <span style="font-size: 12px; color:#888;">الجولات السابقة:</span>
            <div id="history-list" class="history-list"></div>
        </div>
    </div>
</div>

<script>
    const CONF = { URL: 'https://uqmfwgdrlcqywxvdljlb.supabase.co', KEY: 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT' };
    const supabaseClient = supabase.createClient(CONF.URL, CONF.KEY);

    let user = null, betPlaced = false, userInBet = false, hasCashedOut = false;
    let crashPoint = 0, lastBetAmount = 0;
    const CYCLE_TIME = 25; // الدورة الكاملة (5 انتظار + 20 سباق كحد أقصى)

    window.onload = () => {
        const saved = localStorage.getItem('camel_history_v2');
        if (saved) document.getElementById('history-list').innerHTML = saved;
    };

    async function handleLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        const { data } = await supabaseClient.from('Profiles').select('*').eq('username', u).eq('password', p).maybeSingle();
        if (data) {
            user = data;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            updateUI();
            startGlobalEngine();
        } else { alert("بيانات الدخول خاطئة"); }
    }

    function updateUI() {
        document.getElementById('player-balance').innerText = parseFloat(user.balance).toFixed(2);
        document.getElementById('player-name').innerText = user.username;
    }

    function startGlobalEngine() {
        setInterval(() => {
            const now = Date.now() / 1000;
            const cyclePos = now % CYCLE_TIME;
            const roundId = Math.floor(now / CYCLE_TIME);
            crashPoint = generateCrashPoint(roundId);

            if (cyclePos < 5) {
                // مرحلة العد التنازلي (5 ثوانٍ)
                const timeLeft = Math.ceil(5 - cyclePos);
                runWaitingPhase(timeLeft);
            } else {
                // مرحلة السباق
                runRacingPhase(cyclePos - 5);
            }
        }, 100);
    }

    function generateCrashPoint(seed) {
        let hash = Math.abs(Math.sin(seed) * 10000);
        let rand = hash - Math.floor(hash);
        if (rand < 0.05) return 1.00;
        let res = (98 / (100 - (rand * 100) * 0.99));
        return parseFloat(Math.max(1, res).toFixed(2));
    }

    function runWaitingPhase(sec) {
        document.getElementById('main-timer').style.display = 'block';
        document.getElementById('mult-display').style.display = 'none';
        document.getElementById('main-timer').innerText = sec;
        document.getElementById('camel').style.left = "0%";
        hasCashedOut = false;
        userInBet = false;
        
        if (!betPlaced) updateButton("رهان للسباق القادم", "btn-bet");
        else updateButton("إلغاء الرهان", "btn-cancel");
    }

    function runRacingPhase(elapsed) {
        document.getElementById('main-timer').style.display = 'none';
        document.getElementById('mult-display').style.display = 'block';
        
        const currentMult = Math.pow(Math.E, 0.08 * elapsed);

        if (currentMult >= crashPoint) {
            // انفجار
            if (document.getElementById('mult-display').innerText.includes("x")) {
                addToHistory(crashPoint.toFixed(2));
            }
            document.getElementById('mult-display').innerText = "💥 " + crashPoint.toFixed(2) + "x";
            document.getElementById('mult-display').style.color = "var(--error)";
            updateButton("انفجر!", "btn-waiting");
            userInBet = false;
            betPlaced = false;
        } else {
            // سباق جاري
            document.getElementById('mult-display').innerText = currentMult.toFixed(2) + "x";
            document.getElementById('mult-display').style.color = "var(--accent)";
            document.getElementById('camel').style.left = Math.min((currentMult - 1) * 20, 88) + "%";

            if (betPlaced && !userInBet) {
                userInBet = true; betPlaced = false;
                lastBetAmount = parseFloat(document.getElementById('bet-amount').value);
                user.balance -= lastBetAmount;
                updateUI();
            }

            if (userInBet && !hasCashedOut) {
                let win = (lastBetAmount * currentMult).toFixed(2);
                updateButton("سحب الأرباح", "btn-cashout", `اربح الآن: ${win} 💰`);
            } else if (!userInBet && !hasCashedOut) {
                updateButton("انتظر الجولة القادمة", "btn-waiting");
            }
        }
    }

    function handleAction() {
        const amt = parseFloat(document.getElementById('bet-amount').value);
        if (document.getElementById('main-timer').style.display === 'block') {
            if (!betPlaced) {
                if (amt > user.balance || amt <= 0) return alert("رصيد ناقص");
                betPlaced = true;
            } else { betPlaced = false; }
        } else if (userInBet && !hasCashedOut) {
            cashOut();
        }
    }

    function cashOut() {
        hasCashedOut = true;
        const mult = parseFloat(document.getElementById('mult-display').innerText);
        const win = lastBetAmount * mult;
        animateWin(win.toFixed(2));
        user.balance += win;
        updateUI(); updateDB();
        updateButton("تم السحب", "btn-waiting");
    }

    function animateWin(amount) {
        const btn = document.getElementById('action-btn');
        const rect = btn.getBoundingClientRect();
        const float = document.createElement('div');
        float.className = 'win-float';
        float.innerText = `+${amount}`;
        float.style.left = (rect.left + rect.width / 2) + 'px';
        float.style.top = rect.top + 'px';
        document.body.appendChild(float);
        document.getElementById('balance-wrap').classList.add('balance-up');
        setTimeout(() => { document.getElementById('balance-wrap').classList.remove('balance-up'); float.remove(); }, 1000);
    }

    function addToHistory(val) {
        const list = document.getElementById('history-list');
        const item = document.createElement('div');
        item.className = `history-item ${val < 2 ? 'mult-low' : 'mult-mid'}`;
        item.innerText = val + 'x';
        if (list.children.length >= 10) list.removeChild(list.lastChild);
        list.insertBefore(item, list.firstChild);
        localStorage.setItem('camel_history_v2', list.innerHTML);
    }

    function updateButton(text, cls, sub = "") {
        const btn = document.getElementById('action-btn');
        btn.className = cls;
        btn.innerHTML = sub ? `<span>${text}</span><br><small style="font-size:12px;">${sub}</small>` : text;
    }

    async function updateDB() {
        await supabaseClient.from('Profiles').update({ balance: user.balance }).eq('id', user.id);
    }
</script>
</body>
</html>
