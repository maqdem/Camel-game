<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسخة الإصلاح النهائي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #0b141a; color: white; text-align: center; padding: 20px; }
        .card { background: #1c262d; padding: 20px; border-radius: 15px; max-width: 350px; margin: auto; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; text-align: center; }
        button { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-green { background: #238636; color: white; }
        #game-ui { display: none; }
        #multiplier { font-size: 50px; color: #00ff88; margin: 20px; }
    </style>
</head>
<body>

<div id="login-ui" class="card">
    <h2>تسجيل الدخول</h2>
    <input type="text" id="u" placeholder="اسم المستخدم">
    <input type="password" id="p" placeholder="كلمة السر">
    <button id="l-btn" onclick="login()" class="btn-green">دخول الآن</button>
</div>

<div id="game-ui" class="card">
    <div style="display:flex; justify-content: space-between;">
        <span id="un"></span>
        <span id="ub"></span>
    </div>
    <div id="multiplier">1.00x</div>
    <button id="m-btn" onclick="action()" class="btn-green">تجهيز الرهان</button>
</div>

<script>
    const S_URL = 'https://uqmfwgdrlcqywxvdljlb.supabase.co';
    const S_KEY = 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT';
    const _s = supabase.createClient(S_URL, S_KEY);

    let user, bal, multiplier = 1.0, active = false, betted = false;

    async function login() {
        const u = document.getElementById('u').value.trim();
        const p = document.getElementById('p').value.trim();
        const b = document.getElementById('l-btn');
        
        b.innerText = "جاري الاتصال...";
        
        try {
            const { data, error } = await _s.from('Profiles').select('*').eq('username', u).eq('password', p).single();
            if (data) {
                user = data.username; bal = data.balance;
                document.getElementById('login-ui').style.display = 'none';
                document.getElementById('game-ui').style.display = 'block';
                document.getElementById('un').innerText = user;
                document.getElementById('ub').innerText = bal + " 💰";
                alert("تم الدخول بنجاح!");
            } else {
                alert("بيانات خاطئة");
                b.innerText = "دخول الآن"; b.disabled = false;
            }
        } catch (err) {
            alert("خطأ في الشبكة");
            b.innerText = "دخول الآن"; b.disabled = false;
        }
    }

    // ملاحظة: قمت بتبسيط دالة الدخول لضمان عدم حدوث تعليق كما في الصورة.
    // إذا ظهرت رسالة "تم الدخول بنجاح" ولم تفتح اللعبة، يرجى إخباري فوراً.
</script>
</body>
</html>
