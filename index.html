<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن Pro - مصلح</title>
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; --input: #12191f; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 420px; height: 95vh; background: var(--card); padding: 15px; border-radius: 25px; border: 1px solid #2d333b; position: relative; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .balance-box { background: rgba(255, 204, 0, 0.1); border: 1px solid var(--gold); padding: 5px 12px; border-radius: 10px; color: var(--gold); font-weight: bold; }
        
        #display-zone { height: 100px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #timer-val { font-size: 70px; font-weight: 900; color: var(--gold); }
        #mult-val { font-size: 60px; font-weight: 900; transition: 0.2s; }

        .track { height: 130px; background: #0d1117; border-radius: 15px; position: relative; overflow: hidden; border: 1px solid #2d333b; margin-bottom: 10px; }
        .camel-wrap { position: absolute; bottom: 10px; left: 0; transition: left 0.1s linear; }
        .camel { font-size: 50px; transform: scaleX(-1); }

        .controls { background: #0d1117; padding: 12px; border-radius: 15px; margin-bottom: 10px; }
        .input-group { display: flex; gap: 8px; margin-bottom: 10px; }
        .field { flex: 1; text-align: center; }
        .field label { display: block; font-size: 10px; color: #888; margin-bottom: 3px; }
        .field input { width: 100%; background: var(--input); border: 1px solid #333; color: white; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; }
        
        .main-btn { width: 100%; padding: 18px; border-radius: 12px; border: none; font-size: 20px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cash { background: var(--error); color: white; animation: pulse 1s infinite; }
        .btn-wait { background: #222; color: #555; cursor: not-allowed; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }
        #history-box { display: flex; flex-wrap: wrap; gap: 5px; height: 60px; overflow-y: auto; }
        .hi { padding: 4px 10px; border-radius: 6px; font-size: 11px; background: #0d1117; font-weight: bold; border: 1px solid #333; }
        
        /* Auth */
        #auth-overlay { position: absolute; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; justify-content: center; padding: 25px; border-radius: 25px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="auth-overlay">
        <h2 style="text-align:center; color: var(--gold); margin-bottom: 20px;">🐪 سباق الهجن PRO</h2>
        <input type="text" id="ui" placeholder="اسم المستخدم" style="width:100%; padding:12px; background:#12191f; border:1px solid #333; color:white; border-radius:10px; margin-bottom:10px; text-align:center">
        <input type="password" id="pi" placeholder="كلمة المرور" style="width:100%; padding:12px; background:#12191f; border:1px solid #333; color:white; border-radius:10px; margin-bottom:20px; text-align:center">
        <button class="main-btn btn-bet" onclick="handleAuth()">دخول / تسجيل</button>
    </div>

    <div class="header">
        <span id="un" style="font-weight:bold; color:var(--accent)">...</span>
        <div class="balance-box">💰 <span id="ub">0.00</span></div>
    </div>

    <div id="display-zone">
        <div id="timer-val">5</div>
        <div id="mult-val" style="display: none;">1.00x</div>
    </div>

    <div class="track">
        <div id="cw" class="camel-wrap"><div class="camel">🐪</div></div>
    </div>

    <div class="controls">
        <div class="input-group">
            <div class="field"><label>مبلغ الرهان</label><input type="number" id="ba" value="10"></div>
            <div class="field"><label>هدف تلقائي</label><input type="number" id="av" value="2.00"></div>
        </div>
        <button id="ab" class="main-btn btn-bet" onclick="mainAction()">وضع رهان</button>
    </div>

    <div id="history-box"></div>
</div>

<script>
    const SB_URL = "https://uqmfwgdrlcqywxvdljlb.supabase.co";
    const SB_KEY = "sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT";
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let user = null, state = 'waiting', nextT = 0, startT = 0, crashP = 0;
    let betted = false, cashed = false, currentMult = 1.00;

    async function handleAuth() {
        const u = document.getElementById('ui').value, p = document.getElementById('pi').value;
        if(!u || p.length < 6) return alert("بيانات غير صالحة");
        const email = `${u}@camel.com`;
        
        let { data, error } = await sb.auth.signInWithPassword({ email, password: p });
        if (error) {
            let { data: reg, error: regErr } = await sb.auth.signUp({ email, password: p });
            if (regErr) return alert(regErr.message);
            data = reg;
            await sb.from('Profiles').insert([{ id: data.user.id, username: u, balance: 100 }]);
        }
        
        const { data: pr } = await sb.from('Profiles').select('*').eq('id', data.user.id).single();
        user = pr; startApp();
    }

    function startApp() {
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('un').innerText = user.username;
        document.getElementById('ub').innerText = user.balance.toFixed(2);
        engine(); sync();
    }

    function engine() {
        setInterval(() => {
            const now = Date.now();
            if (state === 'paused') return;

            if (now < nextT) {
                state = 'waiting';
                document.getElementById('timer-val').innerText = Math.ceil((nextT - now)/1000);
                document.getElementById('timer-val').style.display = 'block';
                document.getElementById('mult-val').style.display = 'none';
                updateBtnState();
                resetScene();
            } else if (startT > 0) {
                state = 'racing';
                let el = (now - startT)/1000;
                currentMult = Math.pow(1.08, el);

                if (currentMult >= crashP) {
                    doCrash();
                } else {
                    document.getElementById('timer-val').style.display = 'none';
                    const mv = document.getElementById('mult-val');
                    mv.style.display = 'block'; 
                    mv.innerText = currentMult.toFixed(2) + 'x';
                    document.getElementById('cw').style.left = Math.min(el * 5, 85) + '%';
                    
                    if (betted && !cashed) {
                        updateBtnState();
                        // Auto cashout
                        if (currentMult >= parseFloat(document.getElementById('av').value)) doCashout();
                    }
                }
            } else { 
                crashP = (Math.random() < 0.03) ? 1.00 : parseFloat((0.98 / Math.random()).toFixed(2));
                startT = Date.now(); 
                cashed = false;
            }
        }, 50);
    }

    function updateBtnState() {
        const btn = document.getElementById('ab');
        if (state === 'waiting') {
            if (betted) {
                btn.innerText = "تم قبول الرهان";
                btn.className = "main-btn btn-wait";
            } else {
                btn.innerText = "وضع رهان";
                btn.className = "main-btn btn-bet";
            }
        } else if (state === 'racing') {
            if (betted && !cashed) {
                let potential = (currentMult * parseFloat(document.getElementById('ba').value)).toFixed(2);
                btn.innerText = `سحب ${potential}`;
                btn.className = "main-btn btn-cash";
            } else {
                btn.innerText = "انتظر الجولة التالية";
                btn.className = "main-btn btn-wait";
            }
        }
    }

    async function doCashout() {
        if (!betted || cashed) return;
        cashed = true;
        let win = parseFloat(document.getElementById('ba').value) * currentMult;
        user.balance += win;
        document.getElementById('ub').innerText = user.balance.toFixed(2);
        await sb.from('Profiles').update({ balance: user.balance }).eq('id', user.id);
    }

    function doCrash() {
        state = 'paused';
        document.getElementById('mult-val').style.color = 'var(--error)';
        sb.from('GameHistory').insert([{ crash_point: crashP }]);
        setTimeout(() => {
            startT = 0; betted = false; nextT = Date.now() + 5000; state = 'waiting';
            sync();
        }, 2500);
    }

    async function mainAction() {
        if (state === 'waiting' && !betted) {
            const amt = parseFloat(document.getElementById('ba').value);
            if (user.balance >= amt && amt > 0) {
                betted = true;
                user.balance -= amt;
                document.getElementById('ub').innerText = user.balance.toFixed(2);
                updateBtnState();
                await sb.from('Profiles').update({ balance: user.balance }).eq('id', user.id);
            } else {
                alert("الرصيد غير كافٍ");
            }
        } else if (state === 'racing' && betted && !cashed) {
            doCashout();
        }
    }

    function resetScene() {
        document.getElementById('cw').style.left = '0%';
        document.getElementById('mult-val').style.color = 'var(--accent)';
    }

    async function sync() {
        const { data } = await sb.from('GameHistory').select('*').order('created_at', {ascending:false}).limit(20);
        if(data) document.getElementById('history-box').innerHTML = data.map(i => `<div class="hi" style="color:${i.crash_point<2?'#ff4b4b':'#00ff88'}">${i.crash_point.toFixed(2)}x</div>`).join('');
    }
</script>
</body>
</html>
