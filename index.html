<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن - النسخة المستمرة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .app-container { width: 95%; max-width: 420px; background: var(--card); padding: 20px; border-radius: 24px; border: 1px solid #2d333b; text-align: center; }
        
        /* شاشة العداد التنازلي */
        #countdown-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; font-weight: 900; color: var(--gold); z-index: 10; display: none; text-shadow: 0 0 20px rgba(255,204,0,0.5); }

        .multiplier { font-size: 65px; font-weight: 900; color: var(--accent); margin: 15px 0; }
        .track { height: 100px; background: #12191f; border-radius: 18px; position: relative; overflow: hidden; border: 2px solid #2d333b; margin: 15px 0; }
        .camel { position: absolute; bottom: 10px; left: 0; font-size: 50px; transition: left 0.1s linear; }
        
        .controls { background: #0d1117; padding: 15px; border-radius: 18px; }
        .input-field { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #1c262d; color: white; text-align: center; font-size: 18px; }
        
        button { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 20px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cashout { background: var(--error); color: white; }
        .btn-waiting { background: #333; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="auth-screen">
        <h2>تسجيل الدخول 🐪</h2>
        <input type="text" id="username" class="input-field" placeholder="اسم المستخدم">
        <input type="password" id="password" class="input-field" placeholder="كلمة السر">
        <button class="btn-bet" onclick="handleLogin()">دخول</button>
    </div>

    <div id="game-screen" style="display:none; position: relative;">
        <div id="countdown-overlay">3</div>
        
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span id="player-name">---</span>
            <span style="color: var(--gold);">💰 <span id="player-balance">0</span></span>
        </div>

        <div id="mult-display" class="multiplier">1.00x</div>
        
        <div class="track">
            <div id="camel" class="camel">🐪</div>
        </div>

        <div class="controls">
            <input type="number" id="bet-amount" class="input-field" value="10">
            <button id="action-btn" class="btn-bet" onclick="toggleBet()">رهان للسباق القادم</button>
        </div>
    </div>
</div>

<script>
    const CONF = {
        URL: 'https://uqmfwgdrlcqywxvdljlb.supabase.co',
        KEY: 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT'
    };
    const sb = supabase.createClient(CONF.URL, CONF.KEY);

    let user = null;
    let currentMult = 1.0;
    let gameActive = false; // هل السباق شغال الآن؟
    let userInBet = false;  // هل اللاعب دخل هذا الرهان؟
    let betPlaced = false;  // هل اللاعب حجز رهان للسباق القادم؟
    let hasCashedOut = false;
    let startTime, crashPoint;

    async function handleLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        const { data } = await sb.from('Profiles').select('*').eq('username', u).eq('password', p).maybeSingle();
        if (data) {
            user = data;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            refreshUI();
            autoLoop(); // بدء الدورة اللانهائية
        }
    }

    function refreshUI() {
        document.getElementById('player-balance').innerText = Math.floor(user.balance);
        document.getElementById('player-name').innerText = user.username;
    }

    // الدورة الرئيسية للعبة
    async function autoLoop() {
        while(true) {
            // 1. مرحلة الرهان (انتظار اللاعبين)
            resetRace();
            let countdown = 5;
            while(countdown > 0) {
                updateButtonStatus(`يبدأ خلال ${countdown}...`);
                await new Promise(r => setTimeout(r, 1000));
                countdown--;
            }

            // 2. عداد تنازلي سريع (3, 2, 1)
            const overlay = document.getElementById('countdown-overlay');
            overlay.style.display = 'block';
            for(let i=3; i>0; i--) {
                overlay.innerText = i;
                await new Promise(r => setTimeout(r, 1000));
            }
            overlay.style.display = 'none';

            // 3. بدء السباق
            await startRace();
            
            // 4. استراحة بسيطة بعد الانفجار
            await new Promise(r => setTimeout(r, 3000));
        }
    }

    function resetRace() {
        gameActive = false;
        hasCashedOut = false;
        currentMult = 1.0;
        document.getElementById('mult-display').innerText = "1.00x";
        document.getElementById('mult-display').style.color = "var(--accent)";
        document.getElementById('camel').style.left = "0";
        if (!betPlaced) {
            userInBet = false;
            updateButtonStatus("رهان للسباق القادم", "btn-bet");
        }
    }

    function updateButtonStatus(text, className = "btn-waiting") {
        const btn = document.getElementById('action-btn');
        btn.innerText = text;
        btn.className = className;
    }

    function toggleBet() {
        if (gameActive && userInBet && !hasCashedOut) {
            cashOut();
            return;
        }
        if (!betPlaced) {
            const amt = parseFloat(document.getElementById('bet-amount').value);
            if (amt > user.balance || amt <= 0) return alert("رصيد غير كافٍ");
            betPlaced = true;
            updateButtonStatus("تم الحجز.. انتظر", "btn-waiting");
        }
    }

    async function startRace() {
        gameActive = true;
        startTime = Date.now();
        crashPoint = (Math.random() * 5 + 1.1);
        
        if (betPlaced) {
            userInBet = true;
            betPlaced = false;
            user.balance -= parseFloat(document.getElementById('bet-amount').value);
            refreshUI();
            updateButtonStatus("سحب الأرباح", "btn-cashout");
        }

        return new Promise(resolve => {
            function frame() {
                if (!gameActive) return resolve();
                
                let elapsed = (Date.now() - startTime) / 1000;
                currentMult = Math.pow(Math.E, 0.08 * elapsed);
                
                document.getElementById('mult-display').innerText = currentMult.toFixed(2) + "x";
                document.getElementById('camel').style.left = Math.min((currentMult - 1) * 20, 85) + "%";

                if (currentMult >= crashPoint) {
                    gameActive = false;
                    onCrash();
                    resolve();
                } else {
                    requestAnimationFrame(frame);
                }
            }
            requestAnimationFrame(frame);
        });
    }

    function cashOut() {
        hasCashedOut = true;
        const bet = parseFloat(document.getElementById('bet-amount').value);
        const win = bet * currentMult;
        user.balance += win;
        refreshUI();
        updateButtonStatus("تم السحب! انتظر الانفجار", "btn-waiting");
        updateDB();
    }

    async function onCrash() {
        document.getElementById('mult-display').innerText = "💥 " + currentMult.toFixed(2) + "x";
        document.getElementById('mult-display').style.color = "var(--error)";
        updateButtonStatus("انفجر الجمل!", "btn-waiting");
        if (userInBet && !hasCashedOut) {
            updateDB(); // لتحديث الرصيد المخصوم في قاعدة البيانات
        }
    }

    async function updateDB() {
        await sb.from('Profiles').update({ balance: user.balance }).eq('id', user.id);
    }
</script>
</body>
</html>
