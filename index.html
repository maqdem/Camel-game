<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن Pro - نسخة الأداء السلس</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        /* التنسيقات الأصلية مع تحسين أداء الأنيميشن */
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; --input: #12191f; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 420px; height: 98vh; background: var(--card); padding: 15px; border-radius: 25px; border: 1px solid #2d333b; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        #auth-overlay { position: absolute; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; justify-content: center; padding: 25px; border-radius: 25px; }
        .auth-tabs { display: flex; background: #0d1117; border-radius: 12px; margin-bottom: 15px; padding: 5px; }
        .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; border-radius: 8px; font-weight: bold; color: #666; }
        .auth-tab.active { background: var(--card); color: var(--accent); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 5px; }
        .balance-box { background: rgba(255, 204, 0, 0.1); border: 1px solid var(--gold); padding: 5px 12px; border-radius: 10px; color: var(--gold); font-weight: bold; }
        #display-zone { height: 90px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        #timer-val { font-size: 60px; font-weight: 900; color: var(--gold); }
        #mult-val { font-size: 55px; font-weight: 900; }
        .track { height: 120px; background: #0d1117; border-radius: 15px; position: relative; overflow: hidden; border: 1px solid #2d333b; margin-bottom: 8px; }
        .moving-bg { position: absolute; inset: 0; background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.05) 50%, transparent 100%), repeating-linear-gradient(90deg, #0d1117 0, #0d1117 40px, #222 41px, #222 42px); background-size: 200% 100%; display: none; }
        .animate-bg { animation: moveGround 0.2s linear infinite; }
        @keyframes moveGround { from { background-position: 200% 0; } to { background-position: 0% 0; } }
        .camel-wrap { position: absolute; bottom: 10px; left: 0; transition: left 0.1s linear; will-change: left; }
        .camel { font-size: 50px; transform: scaleX(-1); }
        .controls { background: #0d1117; padding: 10px; border-radius: 15px; margin-bottom: 10px; }
        .input-group { display: flex; gap: 5px; margin-bottom: 8px; }
        .field { flex: 1; text-align: center; }
        .field label { display: block; font-size: 8px; color: #888; }
        .field input { width: 100%; background: var(--input); border: 1px solid #333; color: white; padding: 8px; border-radius: 8px; text-align: center; font-weight: bold; }
        .main-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cash { background: var(--error); color: white; }
        .btn-wait { background: #222; color: #555; cursor: not-allowed; }
        .tabs-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #0d1117; border-radius: 15px; border: 1px solid #333; }
        .tab-headers { display: flex; border-bottom: 1px solid #222; }
        .tab-h { flex: 1; padding: 10px; text-align: center; font-size: 11px; cursor: pointer; color: #666; }
        .tab-h.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        .tab-body { flex: 1; overflow-y: auto; padding: 5px; }
        .history-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #222; font-size: 11px; }
        .hi-badge { padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:3000; justify-content:center; align-items:center; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 20px; width: 90%; max-width: 340px; }
        .exp-particle { position: absolute; background: radial-gradient(circle, #ffcc00, #ff4b4b, transparent); border-radius: 50%; pointer-events: none; animation: explodeOut 0.6s ease-out forwards; }
        @keyframes explodeOut { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(5); opacity: 0; } }
    </style>
</head>
<body>

<div class="app-container">
    <div id="auth-overlay">
        <h2 style="text-align:center; color: var(--gold); margin-bottom: 20px;">🐪 سباق الهجن PRO</h2>
        <div class="auth-tabs">
            <div id="tb-login" class="auth-tab active" onclick="switchAuth('login')">دخول</div>
            <div id="tb-signup" class="auth-tab" onclick="switchAuth('signup')">تسجيل</div>
        </div>
        <input type="text" id="ui" placeholder="اسم المستخدم" style="width:100%; padding:12px; background:#12191f; border:1px solid #333; color:white; border-radius:10px; margin-bottom:10px; text-align:center">
        <input type="password" id="pi" placeholder="كلمة المرور" style="width:100%; padding:12px; background:#12191f; border:1px solid #333; color:white; border-radius:10px; margin-bottom:10px; text-align:center">
        <button id="auth-bt" class="main-btn btn-bet" onclick="handleAuth()">دخول</button>
    </div>

    <div class="header">
        <div id="un" style="color:var(--accent); font-weight:bold;">...</div>
        <div class="balance-box">💰 <span id="ub">0.00</span></div>
    </div>

    <div id="display-zone">
        <div id="timer-val">5</div>
        <div id="mult-val" style="display: none;">1.00x</div>
    </div>

    <div class="track" id="tr-container">
        <div class="moving-bg" id="bg-move"></div>
        <div id="cw" class="camel-wrap"><div class="camel">🐪</div></div>
    </div>

    <div class="controls">
        <div class="input-group">
            <div class="field"><label>المبلغ</label><input type="number" id="ba" value="10"></div>
            <div class="field"><label>هدف آلي</label><input type="number" id="av" value="2.00"></div>
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center;">
                <label style="font-size:7px; color:var(--accent)">سحب آلي</label>
                <input type="checkbox" id="auto-cash-toggle">
            </div>
        </div>
        <button id="ab" class="main-btn btn-bet" onclick="mainAction()">وضع رهان</button>
    </div>

    <div class="tabs-container">
        <div class="tab-headers">
            <div class="tab-h active" onclick="showTab('game-history')">النتائج</div>
            <div class="tab-h" onclick="showTab('my-bets')">مراهناتي</div>
        </div>
        <div id="game-history" class="tab-body"></div>
        <div id="my-bets" class="tab-body" style="display:none"></div>
    </div>
</div>

<script>
    // الإعدادات الأصلية
    const SB_URL = "https://uqmfwgdrlcqywxvdljlb.supabase.co";
    const SB_KEY = "sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT";
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let user = null, state = 'waiting', crashP = 0, startT = 0, nextT = Date.now() + 5000;
    let betted = false, cashed = false, currentMult = 1.00;
    let engineRef = null;

    // --- وظائف التحسين لتقليل اللاج ---

    async function fetchNewCrash() {
        try {
            const { data, error } = await sb.functions.invoke('smart-function');
            return error ? 1.10 : parseFloat(data.crashPoint);
        } catch { return 1.05; }
    }

    function engine() {
        if (engineRef) clearInterval(engineRef);
        
        engineRef = setInterval(async () => {
            const now = Date.now();

            if (state === 'waiting') {
                let diff = nextT - now;
                if (diff <= 0) {
                    state = 'loading';
                    crashP = await fetchNewCrash();
                    startT = Date.now();
                    state = 'racing';
                    document.getElementById('bg-move').style.display = 'block';
                    document.getElementById('bg-move').classList.add('animate-bg');
                } else {
                    document.getElementById('timer-val').innerText = Math.ceil(diff / 1000);
                    document.getElementById('timer-val').style.display = 'block';
                    document.getElementById('mult-val').style.display = 'none';
                    resetVisuals();
                }
            } 
            
            else if (state === 'racing') {
                let elapsed = (Date.now() - startT) / 1000;
                currentMult = Math.pow(1.075, elapsed);

                if (currentMult >= crashP) {
                    executeCrash();
                } else {
                    document.getElementById('timer-val').style.display = 'none';
                    const mv = document.getElementById('mult-val');
                    mv.style.display = 'block';
                    mv.innerText = currentMult.toFixed(2) + 'x';
                    document.getElementById('cw').style.left = Math.min(elapsed * 8, 80) + '%';
                    
                    // السحب الآلي السريع
                    if(betted && !cashed && document.getElementById('auto-cash-toggle').checked) {
                        if(currentMult >= parseFloat(document.getElementById('av').value)) doCashout();
                    }
                }
            }
            updateButton();
        }, 60); // زيادة التردد لتحسين السلاسة
    }

    function executeCrash() {
        state = 'crashed';
        document.getElementById('bg-move').classList.remove('animate-bg');
        triggerExplosion();
        
        // تحديث التاريخ (تم تصحيح اسم الجدول GameHistory)
        sb.from('GameHistory').insert([{ crash_point: crashP }]).then(() => { syncLogs(); });

        setTimeout(() => {
            state = 'waiting';
            nextT = Date.now() + 5000;
            betted = false; cashed = false;
        }, 3000);
    }

    async function doCashout() {
        if (cashed || !betted || state !== 'racing') return;
        cashed = true;
        const finalM = currentMult;
        
        // استخدام RPC لتفادي اللاج في الطلبات المتعددة
        const { data, error } = await sb.rpc('claim_win_secure', { win_multiplier: parseFloat(finalM.toFixed(2)) });
        if (!error && data.success) {
            syncUser();
            syncMyBets();
        }
    }

    async function mainAction() {
        if (state === 'waiting' && !betted) {
            const amt = parseFloat(document.getElementById('ba').value);
            const { data, error } = await sb.rpc('place_bet_secure', { bet_amount_param: amt });
            if (!error && data.success) {
                betted = true;
                syncUser();
            } else {
                alert(error?.message || "رصيد غير كافٍ");
            }
        } else if (state === 'racing' && betted && !cashed) {
            doCashout();
        }
    }

    // --- وظائف المساعدة والمزامنة ---

    async function syncUser() {
        if (!user) return;
        const { data } = await sb.from('Profiles').select('*').eq('id', user.id).single();
        if (data) {
            user = data;
            document.getElementById('ub').innerText = user.balance.toFixed(2);
        }
    }

    async function syncLogs() {
        // تم استخدام اسم الجدول الصحيح GameHistory
        const { data } = await sb.from('GameHistory').select('*').order('created_at', {ascending:false}).limit(50);
        if (data) {
            document.getElementById('game-history').innerHTML = data.map(i => `
                <div class="history-item">
                    <span>جولة #${i.id.toString().slice(-3)}</span>
                    <span class="hi-badge" style="color:${i.crash_point < 2 ? 'var(--error)' : 'var(--accent)'}">${i.crash_point.toFixed(2)}x</span>
                </div>`).join('');
        }
    }

    async function syncMyBets() {
        const { data } = await sb.from('UserBets').select('*').eq('user_id', user.id).order('created_at', {ascending:false}).limit(50);
        if (data) {
            document.getElementById('my-bets').innerHTML = data.map(i => `
                <div class="history-item">
                    <span>💰 ${i.bet_amount}</span>
                    <span style="color:${i.status === 'won' ? 'var(--accent)' : 'var(--error)'}">${i.status === 'won' ? 'فوز' : 'خسارة'}</span>
                </div>`).join('');
        }
    }

    function updateButton() {
        const btn = document.getElementById('ab');
        if (state === 'waiting') {
            btn.innerText = betted ? "تم وضع الرهان" : "وضع رهان";
            btn.className = betted ? "main-btn btn-wait" : "main-btn btn-bet";
            btn.disabled = betted;
        } else if (state === 'racing') {
            if (betted && !cashed) {
                btn.innerText = `سحب ${(currentMult * parseFloat(document.getElementById('ba').value)).toFixed(2)}`;
                btn.className = "main-btn btn-cash";
                btn.disabled = false;
            } else {
                btn.innerText = cashed ? "تم السحب ✓" : "سباق جارٍ...";
                btn.className = "main-btn btn-wait";
                btn.disabled = true;
            }
        } else {
            btn.innerText = "انفجار!";
            btn.className = "main-btn btn-wait";
            btn.disabled = true;
        }
    }

    function triggerExplosion() {
        for(let i=0; i<6; i++) {
            const p = document.createElement('div'); p.className = 'exp-particle';
            p.style.left = '50%'; p.style.top = '50%'; 
            document.getElementById('display-zone').appendChild(p);
            setTimeout(() => p.remove(), 600);
        }
        document.getElementById('mult-val').style.color = 'var(--error)';
    }

    function resetVisuals() {
        document.getElementById('cw').style.left = '0%';
        document.getElementById('mult-val').style.color = 'var(--text)';
        document.getElementById('bg-move').style.display = 'none';
    }

    async function handleAuth() {
        const u = document.getElementById('ui').value, p = document.getElementById('pi').value;
        try {
            const { data, error } = await sb.auth.signInWithPassword({ email: `${u}@camel.com`, password: p });
            if (error) throw error;
            user = (await sb.from('Profiles').select('*').eq('id', data.user.id).single()).data;
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('un').innerText = user.username;
            syncUser(); syncLogs(); engine();
        } catch (e) { alert("خطأ في الدخول: " + e.message); }
    }

    function switchAuth(m) {
        document.getElementById('tb-login').classList.toggle('active', m==='login');
        document.getElementById('tb-signup').classList.toggle('active', m==='signup');
        document.getElementById('auth-bt').onclick = m==='login' ? handleAuth : () => alert('يرجى استخدام لوحة التحكم للتسجيل');
    }

    function showTab(tid) {
        document.querySelectorAll('.tab-body').forEach(b => b.style.display = 'none');
        document.querySelectorAll('.tab-h').forEach(h => h.classList.remove('active'));
        document.getElementById(tid).style.display = 'block';
        event.target.classList.add('active');
    }
</script>
</body>
</html>
