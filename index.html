<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن Pro - التحديث المتحرك</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; --input: #12191f; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 420px; height: 95vh; background: var(--card); padding: 15px; border-radius: 25px; border: 1px solid #2d333b; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        
        /* شاشة الدخول */
        #auth-overlay { position: absolute; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; justify-content: center; padding: 25px; }
        .auth-tabs { display: flex; background: #0d1117; border-radius: 12px; margin-bottom: 15px; padding: 5px; }
        .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; border-radius: 8px; font-weight: bold; color: #666; }
        .auth-tab.active { background: var(--card); color: var(--accent); }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; z-index: 10; }
        .balance-box { background: rgba(255, 204, 0, 0.1); border: 1px solid var(--gold); padding: 5px 12px; border-radius: 10px; color: var(--gold); font-weight: bold; }
        
        #display-zone { height: 100px; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        #timer-val { font-size: 70px; font-weight: 900; color: var(--gold); }
        #mult-val { font-size: 60px; font-weight: 900; transition: transform 0.2s; }
        .crash-anim { transform: scale(1.2); animation: flash 0.5s infinite; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* مضمار السباق مع الخلفية المتحركة */
        .track { 
            height: 150px; background: linear-gradient(to bottom, #1a2a33 0%, #2c3e50 100%); 
            border-radius: 15px; position: relative; overflow: hidden; border: 1px solid #2d333b; margin-bottom: 10px; 
        }
        .moving-bg {
            position: absolute; width: 200%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/sandpaper.png');
            opacity: 0.1; animation: moveBg 10s linear infinite;
        }
        @keyframes moveBg { from { transform: translateX(0); } to { transform: translateX(50%); } }

        /* الغبار والجمل */
        .dust {
            position: absolute; background: rgba(139, 69, 19, 0.6);
            border-radius: 50%; pointer-events: none; filter: blur(8px);
            animation: drift 1s forwards; z-index: 4;
        }
        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); opacity: 0.8; }
            100% { transform: translate(-100px, -40px) scale(3); opacity: 0; }
        }

        .camel-wrap { position: absolute; bottom: 20px; left: 0; transition: left 0.1s linear; z-index: 5; }
        .camel { font-size: 50px; transform: scaleX(-1); }

        /* عناصر التحكم */
        .controls { background: #0d1117; padding: 12px; border-radius: 15px; margin-bottom: 10px; z-index: 10; }
        .input-group { display: flex; gap: 5px; margin-bottom: 10px; }
        .field { flex: 1; text-align: center; }
        .field label { display: block; font-size: 9px; color: #888; margin-bottom: 3px; }
        .field input { width: 100%; background: var(--input); border: 1px solid #333; color: white; padding: 8px; border-radius: 8px; text-align: center; }
        
        /* زر السحب التلقائي الجديد */
        .auto-toggle {
            display: flex; align-items: center; justify-content: space-between;
            background: #12191f; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #333;
        }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #333; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }
        input:disabled + .slider { opacity: 0.5; cursor: not-allowed; }

        .main-btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-size: 20px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cash { background: var(--error); color: white; }
        .btn-wait { background: #222; color: #555; cursor: not-allowed; }

        #history-box { display: flex; flex-wrap: wrap; gap: 5px; height: 60px; overflow-y: auto; margin-top: 5px; }
        .hi { padding: 3px 8px; border-radius: 5px; font-size: 10px; background: #0d1117; border: 1px solid #333; }
        
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:3000; justify-content:center; align-items:center; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 20px; width: 90%; max-width: 340px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="auth-overlay">
        <h2 style="text-align:center; color: var(--gold); margin-bottom: 20px;">🐪 سباق الهجن PRO</h2>
        <div class="auth-tabs">
            <div id="tb-login" class="auth-tab active" onclick="switchAuth('login')">دخول</div>
            <div id="tb-signup" class="auth-tab" onclick="switchAuth('signup')">تسجيل</div>
        </div>
        <input type="text" id="ui" placeholder="اسم المستخدم" style="width:100%; padding:12px; background:#12191f; border:1px solid #333; color:white; border-radius:10px; margin-bottom:10px; text-align:center">
        <input type="password" id="pi" placeholder="كلمة المرور" style="width:100%; padding:12px; background:#12191f; border:1px solid #333; color:white; border-radius:10px; margin-bottom:10px; text-align:center">
        <input type="text" id="ri" placeholder="كود الإحالة (اختياري)" style="width:100%; padding:12px; background:#12191f; border:1px solid #333; color:white; border-radius:10px; margin-bottom:20px; text-align:center">
        <button id="auth-bt" class="main-btn btn-bet" onclick="handleAuth()">دخول</button>
    </div>

    <div class="header">
        <div class="user-section">
            <button onclick="location.reload()" style="background:none; border:1px solid var(--error); color:var(--error); padding:2px 5px; border-radius:4px; font-size:10px; cursor:pointer">خروج</button>
            <span id="un" style="font-weight:bold; color:var(--accent); margin-right:5px">...</span>
        </div>
        <div style="display: flex; align-items: center;">
            <button style="background:var(--gold); border:none; width:25px; height:25px; border-radius:5px; margin-left:5px;" onclick="openDeposit()">+</button>
            <div class="balance-box">💰 <span id="ub">0.00</span></div>
        </div>
    </div>

    <div id="display-zone">
        <div id="timer-val">5</div>
        <div id="mult-val" style="display: none;">1.00x</div>
    </div>

    <div class="track" id="track-box">
        <div class="moving-bg"></div>
        <div id="cw" class="camel-wrap">
            <div class="camel">🐪</div>
        </div>
    </div>

    <div class="controls">
        <div class="input-group">
            <div class="field"><label>مبلغ الرهان</label><input type="number" id="ba" value="10"></div>
            <div class="field"><label>رقم السحب الآلي</label><input type="number" id="av" value="2.00"></div>
        </div>
        
        <div class="auto-toggle">
            <span style="font-size: 12px; color: #888;">تفعيل السحب التلقائي</span>
            <label class="switch">
                <input type="checkbox" id="auto-switch">
                <span class="slider"></span>
            </label>
        </div>

        <button id="ab" class="main-btn btn-bet" onclick="mainAction()">وضع رهان</button>
    </div>

    <div id="history-box"></div>
    <div style="font-size:10px; text-align:center; color:#555; margin-top:5px;">عنوان محفظتك: TG9gT1pPJK3aETRp1hVu28F5Zayu4oVyEg</div>
</div>

<div id="deposit-modal" class="modal">
    <div class="modal-content">
        <h3 style="text-align:center; color:var(--gold); margin-bottom:15px;">إيداع USDT (TRC20)</h3>
        <p style="font-size:10px; color:#888; text-align:center; margin-bottom:10px;">أرسل للمحفظة ثم أرفق الـ Hash</p>
        <div style="background:#0d1117; padding:10px; border-radius:8px; word-break:break-all; color:var(--accent); font-size:11px; text-align:center; margin-bottom:15px;">TG9gT1pPJK3aETRp1hVu28F5Zayu4oVyEg</div>
        <input type="text" id="tx-hash" placeholder="Transaction Hash" style="width:100%; padding:10px; background:#12191f; border:1px solid #333; color:white; border-radius:8px; margin-bottom:15px;">
        <button class="main-btn btn-bet" onclick="submitDeposit()">تأكيد</button>
        <button onclick="closeDeposit()" style="width:100%; background:none; border:none; color:var(--error); margin-top:10px;">إغلاق</button>
    </div>
</div>

<script>
    const SB_URL = "https://uqmfwgdrlcqywxvdljlb.supabase.co";
    const SB_KEY = "sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT";
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let user = null, state = 'waiting', mode = 'login';
    let nextT = 0, startT = 0, crashP = 0, betted = false, cashed = false, currentMult = 1.00;

    function switchAuth(m) {
        mode = m;
        document.getElementById('tb-login').classList.toggle('active', m==='login');
        document.getElementById('tb-signup').classList.toggle('active', m==='signup');
        document.getElementById('auth-bt').innerText = m==='login' ? 'دخول' : 'إنشاء حساب';
    }

    async function handleAuth() {
        const u = document.getElementById('ui').value, p = document.getElementById('pi').value;
        if(!u || p.length < 6) return alert("بيانات غير صالحة");
        const email = `${u.trim()}@camel.com`;

        if(mode === 'signup') {
            const { data, error } = await sb.auth.signUp({ email, password: p });
            if(error) return alert(error.message);
            const ref = Math.random().toString(36).substring(7).toUpperCase();
            await sb.from('Profiles').insert([{ id: data.user.id, username: u, balance: 10, referral_code: ref }]);
            alert("تم التسجيل! رصيد مجاني 10"); switchAuth('login');
        } else {
            const { data, error } = await sb.auth.signInWithPassword({ email, password: p });
            if(error) return alert("خطأ في الدخول");
            const { data: pr } = await sb.from('Profiles').select('*').eq('id', data.user.id).single();
            user = pr; startApp();
        }
    }

    function startApp() {
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('un').innerText = user.username;
        document.getElementById('ub').innerText = user.balance.toFixed(2);
        engine(); sync();
    }

    // وظيفة إنشاء الغبار الكثيف
    function createDust() {
        const track = document.getElementById('track-box');
        const camel = document.getElementById('cw');
        const rect = camel.getBoundingClientRect();
        const trackRect = track.getBoundingClientRect();

        for(let i=0; i<3; i++) { // إنشاء 3 جزيئات في كل دورة لزيادة الكثافة
            const dust = document.createElement('div');
            dust.className = 'dust';
            dust.style.left = (rect.left - trackRect.left + 20) + 'px';
            dust.style.bottom = (Math.random() * 20 + 20) + 'px';
            dust.style.width = (Math.random() * 15 + 10) + 'px';
            dust.style.height = dust.style.width;
            track.appendChild(dust);
            setTimeout(() => dust.remove(), 1000);
        }
    }

    function engine() {
        setInterval(() => {
            const now = Date.now();
            if (state === 'paused') return;

            const autoSwitch = document.getElementById('auto-switch');

            if(now < nextT) {
                state = 'waiting';
                autoSwitch.disabled = false; // تفعيل الزر في وقت الانتظار
                document.getElementById('timer-val').innerText = Math.ceil((nextT - now)/1000);
                document.getElementById('timer-val').style.display = 'block';
                document.getElementById('mult-val').style.display = 'none';
                document.getElementById('cw').style.left = '0%';
                updateBtnUI();
            } else if (startT > 0) {
                state = 'racing';
                autoSwitch.disabled = true; // قفل زر السحب التلقائي أثناء السباق
                
                let el = (now - startT)/1000;
                currentMult = Math.pow(1.07, el);

                if(currentMult >= crashP) {
                    explosion();
                } else {
                    document.getElementById('timer-val').style.display = 'none';
                    const mv = document.getElementById('mult-val');
                    mv.style.display = 'block'; mv.innerText = currentMult.toFixed(2)+'x';
                    
                    // تحريك الجمل بحد أقصى 85% من الشاشة
                    document.getElementById('cw').style.left = Math.min(el * 4, 85) + '%';
                    
                    createDust(); // توليد الغبار
                    updateBtnUI();

                    // السحب التلقائي إذا كان مفعل
                    if(betted && !cashed && autoSwitch.checked) {
                        const target = parseFloat(document.getElementById('av').value);
                        if(currentMult >= target) doCashout();
                    }
                }
            } else { 
                crashP = (Math.random() < 0.02) ? 1.00 : parseFloat((0.99 / Math.random()).toFixed(2));
                startT = Date.now(); cashed = false; 
            }
        }, 50);
    }

    function updateBtnUI() {
        const btn = document.getElementById('ab');
        if (state === 'waiting') {
            btn.innerText = betted ? "انتظر البدء..." : "وضع رهان";
            btn.className = betted ? "main-btn btn-wait" : "main-btn btn-bet";
        } else if (state === 'racing') {
            if (betted && !cashed) {
                let pot = (currentMult * parseFloat(document.getElementById('ba').value)).toFixed(2);
                btn.innerText = `سحب ${pot}`; btn.className = "main-btn btn-cash";
            } else {
                btn.innerText = "في السباق..."; btn.className = "main-btn btn-wait";
            }
        }
    }

    async function doCashout() {
        if(cashed || !betted) return;
        cashed = true;
        let win = parseFloat(document.getElementById('ba').value) * currentMult;
        user.balance += win;
        document.getElementById('ub').innerText = user.balance.toFixed(2);
        await sb.from('Profiles').update({ balance: user.balance }).eq('id', user.id);
    }

    async function explosion() {
        state = 'paused';
        const mv = document.getElementById('mult-val');
        mv.innerText = crashP.toFixed(2) + 'x';
        mv.style.color = 'var(--error)';
        mv.classList.add('crash-anim');
        
        await sb.from('GameHistory').insert([{ crash_point: crashP }]);
        sync();

        setTimeout(() => {
            state = 'waiting';
            startT = 0;
            nextT = Date.now() + 5000;
            betted = false;
            mv.style.color = 'white';
            mv.classList.remove('crash-anim');
        }, 3000);
    }

    async function mainAction() {
        if(state === 'waiting' && !betted) {
            const amt = parseFloat(document.getElementById('ba').value);
            if(user.balance >= amt) {
                betted = true; user.balance -= amt;
                document.getElementById('ub').innerText = user.balance.toFixed(2);
                await sb.from('Profiles').update({ balance: user.balance }).eq('id', user.id);
            }
        } else if (state === 'racing' && betted && !cashed) {
            doCashout();
        }
    }

    async function sync() {
        const { data } = await sb.from('GameHistory').select('*').order('created_at', {ascending:false}).limit(15);
        if(data) {
            document.getElementById('history-box').innerHTML = data.map(i => 
                `<div class="hi" style="color:${i.crash_point < 2 ? '#ff4b4b' : '#00ff88'}">${i.crash_point.toFixed(2)}x</div>`
            ).join('');
        }
    }

    function openDeposit() { document.getElementById('deposit-modal').style.display = 'flex'; }
    function closeDeposit() { document.getElementById('deposit-modal').style.display = 'none'; }
    async function submitDeposit() {
        const h = document.getElementById('tx-hash').value;
        if(!h) return;
        alert("سيتم مراجعة العملية خلال دقائق"); closeDeposit();
    }
</script>
</body>
</html>
