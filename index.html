<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن العالمي | Camel Dash Pro</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 420px; background: var(--card); padding: 25px; border-radius: 30px; border: 1px solid #2d333b; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        
        #auth-overlay { position: absolute; inset: 0; background: rgba(11, 20, 26, 0.98); z-index: 100; display: flex; flex-direction: column; justify-content: center; padding: 30px; transition: 0.5s; }
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background: #2d333b; border-radius: 10px; cursor: pointer; border: none; color: white; font-weight: bold; }
        .tab-btn.active { background: var(--accent); color: #000; }
        .input-field { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #333; background: #12191f; color: white; margin-bottom: 15px; font-size: 16px; text-align: center; outline: none; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; position: relative; }
        .balance-box { background: rgba(255, 204, 0, 0.15); padding: 10px 18px; border-radius: 14px; border: 1px solid var(--gold); color: var(--gold); font-weight: 900; font-size: 18px; transition: transform 0.2s; }
        
        .money-float { position: absolute; right: 10px; top: -20px; color: var(--accent); font-weight: bold; animation: floatUp 1.2s ease-out forwards; pointer-events: none; z-index: 100; }

        #main-timer { font-size: 90px; font-weight: 900; color: var(--gold); text-align: center; }
        .multiplier { font-size: 80px; font-weight: 900; color: var(--accent); display: none; text-align: center; }
        
        .track { height: 140px; background: #12191f; border-radius: 20px; position: relative; overflow: hidden; border: 2px solid #2d333b; margin: 15px 0; background-image: linear-gradient(90deg, transparent 45%, rgba(255,255,255,0.03) 50%); background-size: 60px 100%; }
        .camel-wrapper { position: absolute; bottom: 15px; left: 0; transition: left 0.4s ease-out; z-index: 5; }
        .camel { font-size: 55px; transform: scaleX(-1); }
        .explosion { position: absolute; width: 100px; height: 100px; background: radial-gradient(circle, #ffcc00, #ff4b4b, transparent); border-radius: 50%; display: none; z-index: 6; animation: explode 0.5s ease-out; }

        .controls { background: #0d1117; padding: 20px; border-radius: 22px; display: flex; flex-direction: column; gap: 12px; }
        .input-row { display: flex; gap: 10px; align-items: flex-end; }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: #888; margin-right: 5px; }
        .field-small { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #333; background: #12191f; color: white; text-align: center; font-weight: bold; outline: none; transition: 0.3s; }
        .auto-active { border-color: var(--accent); background: rgba(0, 255, 136, 0.05); }

        .toggle-container { display: flex; align-items: center; background: #1c262d; padding: 8px; border-radius: 12px; cursor: pointer; border: 1px solid #333; transition: 0.3s; min-width: 85px; justify-content: space-between; position: relative; }
        .toggle-container.on { border-color: var(--accent); background: rgba(0, 255, 136, 0.1); }
        .toggle-container.disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
        .toggle-label { font-size: 10px; font-weight: 900; color: #666; transition: 0.3s; }
        .toggle-container.on .toggle-label { color: var(--accent); }
        .switch { width: 34px; height: 18px; background: #333; border-radius: 20px; position: relative; transition: 0.3s; }
        .toggle-container.on .switch { background: var(--accent); }
        .dot { width: 14px; height: 14px; background: white; border-radius: 50%; position: absolute; top: 2px; right: 2px; transition: 0.3s; }
        .toggle-container.on .dot { right: 18px; }

        button.main-btn { width: 100%; padding: 18px; border-radius: 16px; border: none; font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cashout { background: var(--error); color: white; }
        .btn-waiting { background: #222; color: #555; pointer-events: none; }

        .history-list { display: flex; gap: 8px; overflow-x: auto; padding: 10px 5px; flex-direction: row-reverse; scrollbar-width: none; border-top: 1px solid #333; }
        .history-item { min-width: 60px; padding: 6px; border-radius: 8px; background: #12191f; font-size: 12px; font-weight: bold; text-align: center; }
        .hist-low { color: var(--error); border: 1px solid rgba(255, 75, 75, 0.3); }
        .hist-high { color: var(--accent); border: 1px solid rgba(0, 255, 136, 0.3); }

        @keyframes explode { 0% { transform: scale(0.1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-40px); opacity: 0; } }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <div id="auth-overlay">
        <h2 style="color: var(--accent); text-align: center;">سباق الهجن 🐪</h2>
        <div class="auth-tabs">
            <button class="tab-btn active" id="login-tab" onclick="switchAuth('login')">دخول</button>
            <button class="tab-btn" id="signup-tab" onclick="switchAuth('signup')">تسجيل</button>
        </div>
        <input type="text" id="username" class="input-field" placeholder="اسم المستخدم">
        <input type="password" id="password" class="input-field" placeholder="كلمة المرور">
        <button class="main-btn btn-bet" id="auth-submit-btn" onclick="processAuth()">ابدأ الآن</button>
    </div>

    <div id="game-screen">
        <div class="header" id="header-area">
            <div class="player-info" onclick="logout()" style="cursor: pointer;">
                <span id="player-display" style="font-weight: bold; color: var(--accent);">جاري التحميل...</span>
                <small style="opacity: 0.5; font-size: 10px; display: block;">تسجيل خروج</small>
            </div>
            <div id="bal-box" class="balance-box">💰 <span id="balance">0.00</span></div>
        </div>
        
        <div id="main-timer">5</div>
        <div id="mult-display" class="multiplier">1.00x</div>
        
        <div class="track">
            <div id="camel-wrap" class="camel-wrapper">
                <div class="camel">🐪</div>
            </div>
            <div id="boom-fx" class="explosion"></div>
        </div>

        <div class="controls">
            <div class="input-row">
                <div class="input-group">
                    <label>الرهان</label>
                    <input type="number" id="bet-amount" class="field-small" value="5" min="1">
                </div>
                <div class="input-group">
                    <label>الهدف (X)</label>
                    <input type="number" id="auto-val" class="field-small" value="2.00" min="1.01" step="0.1">
                </div>
                <div id="auto-toggle" class="toggle-container" onclick="toggleAuto()">
                    <span class="toggle-label">تلقائي</span>
                    <div class="switch"><div class="dot"></div></div>
                </div>
            </div>
            <button id="action-btn" class="main-btn btn-bet" onclick="handleAction()">وضع رهان</button>
        </div>
        <div id="history-list" class="history-list"></div>
    </div>
</div>

<script>
    const CONF = { 
        URL: 'https://uqmfwgdrlcqywxvdljlb.supabase.co', 
        KEY: 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT' 
    };
    const supabaseClient = supabase.createClient(CONF.URL, CONF.KEY);

    let user = null, betPlaced = false, userInRace = false, cashed = false, currentBet = 0, autoOn = false;
    let currentGameState = "waiting"; const CYCLE = 15, WAIT = 5;
    let lastRoundLogged = -1;

    async function checkSavedSession() {
        const saved = localStorage.getItem('camel_session');
        if (saved) {
            try {
                const userId = JSON.parse(saved).id;
                const { data: profile } = await supabaseClient.from('Profiles').select('*').eq('id', userId).single();
                if (profile) launch(profile);
                else localStorage.removeItem('camel_session');
            } catch(e) { localStorage.removeItem('camel_session'); }
        }
    }

    function launch(p) {
        user = p; 
        localStorage.setItem('camel_session', JSON.stringify({ id: p.id }));
        document.getElementById('auth-overlay').style.display = 'none';
        updateUI();
        syncHistory();
    }

    function toggleAuto() {
        if (userInRace) return;
        autoOn = !autoOn;
        const container = document.getElementById('auto-toggle');
        container.classList.toggle('on', autoOn);
        document.getElementById('auto-val').classList.toggle('auto-active', autoOn);
        if (autoOn && currentGameState === "waiting") betPlaced = true;
    }

    function globalEngine() {
        setInterval(() => {
            const now = Date.now() / 1000, pos = now % CYCLE, roundId = Math.floor(now / CYCLE);
            const crashAt = getCrash(roundId);

            if (pos < WAIT) {
                if (currentGameState !== "waiting") { 
                    currentGameState = "waiting"; 
                    resetVisuals(); 
                    syncHistory(); 
                }
                if (autoOn) betPlaced = true; 
                renderWait(Math.ceil(WAIT - pos));
            } else {
                const elapsed = pos - WAIT, mult = Math.pow(1.12, elapsed);
                if (mult >= crashAt) {
                    if (currentGameState !== "crashed") { 
                        currentGameState = "crashed"; 
                        renderCrash(crashAt); 
                        logGameResult(roundId, crashAt);
                    }
                } else {
                    currentGameState = "racing";
                    renderRace(mult, elapsed);
                    if (userInRace && !cashed && autoOn) {
                        const target = parseFloat(document.getElementById('auto-val').value);
                        if (mult >= target) doCashout(target, "AUTO");
                    }
                    if (user && betPlaced && !userInRace) joinRace();
                }
            }
        }, 50);
    }

    async function logGameResult(rid, cp) {
        if (lastRoundLogged === rid) return;
