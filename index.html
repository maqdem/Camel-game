<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن Pro - الإصدار المستقر</title>
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; --input: #12191f; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 420px; height: 95vh; background: var(--card); padding: 15px; border-radius: 25px; border: 1px solid #2d333b; position: relative; display: flex; flex-direction: column; z-index: 100; transition: transform 0.1s; }
        
        #auth-overlay { position: absolute; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; justify-content: center; padding: 25px; border-radius: 25px; }
        .auth-tabs { display: flex; background: #0d1117; border-radius: 12px; margin-bottom: 15px; padding: 5px; }
        .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; border-radius: 8px; font-weight: bold; color: #666; }
        .auth-tab.active { background: var(--card); color: var(--accent); }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 5px; z-index: 10; }
        .balance-box { background: rgba(255, 204, 0, 0.1); border: 1px solid var(--gold); padding: 5px 12px; border-radius: 10px; color: var(--gold); font-weight: bold; }
        .btn-deposit { background: var(--gold); border: none; width: 30px; height: 30px; border-radius: 8px; font-weight: bold; cursor: pointer; color: #000; margin-left: 8px; }
        
        #display-zone { height: 100px; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; position: relative; }
        #timer-val { font-size: 70px; font-weight: 900; color: var(--gold); }
        #mult-val { font-size: 60px; font-weight: 900; transition: transform 0.2s; z-index: 20; }
        
        .exp-particle { position: absolute; background: radial-gradient(circle, #ffcc00, #ff4b4b, transparent); border-radius: 50%; pointer-events: none; z-index: 15; animation: explodeOut 0.6s ease-out forwards; }
        @keyframes explodeOut { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(5); opacity: 0; } }
        
        .crash-anim { transform: scale(1.3); color: var(--error) !important; animation: shake 0.2s infinite; }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, -2px); } }

        .track { height: 140px; background: #0d1117; border-radius: 15px; position: relative; overflow: hidden; border: 1px solid #2d333b; margin-bottom: 10px; }
        .moving-bg { position: absolute; inset: 0; 
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.05) 50%, transparent 100%),
                        repeating-linear-gradient(90deg, #0d1117 0, #0d1117 40px, #222 41px, #222 42px);
            background-size: 200% 100%; animation: moveGround 0.2s linear infinite; display: none; }
        @keyframes moveGround { from { background-position: 200% 0; } to { background-position: 0% 0; } }
        
        .dust { position: absolute; background: rgba(139, 103, 66, 0.6); border-radius: 50%; pointer-events: none; filter: blur(6px); z-index: 4; animation: dustFade 0.5s linear forwards; }
        @keyframes dustFade { 0% { transform: scale(1) translate(0,0); opacity: 0.8; } 100% { transform: scale(3) translate(-80px, -20px); opacity: 0; } }

        .camel-wrap { position: absolute; bottom: 15px; left: 0; transition: left 0.1s linear; z-index: 5; }
        .camel { font-size: 55px; transform: scaleX(-1); }

        .controls { background: #0d1117; padding: 12px; border-radius: 15px; margin-bottom: 10px; z-index: 10; }
        .input-group { display: flex; gap: 5px; margin-bottom: 10px; align-items: flex-end; }
        .field { flex: 1; text-align: center; }
        .field label { display: block; font-size: 9px; color: #888; margin-bottom: 3px; }
        .field input { width: 100%; background: var(--input); border: 1px solid #333; color: white; padding: 8px; border-radius: 8px; text-align: center; font-weight: bold; }
        
        .auto-switch-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; margin-right: 5px; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #333; transition: .4s; border-radius: 34px; border: 1px solid #444; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        .main-btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-size: 20px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cash { background: var(--error); color: white; animation: pulse 1s infinite; }
        .btn-wait { background: #222; color: #555; cursor: not-allowed; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }

        #history-box { display: flex; flex-wrap: wrap; gap: 5px; height: 60px; overflow-y: auto; margin-top: 5px; padding: 5px; }
        .hi { padding: 3px 8px; border-radius: 5px; font-size: 10px; background: #0d1117; font-weight: bold; border: 1px solid #333; }
        .ref-section { font-size: 11px; text-align: center; margin-top: 10px; color: #888; border-top: 1px solid #333; padding-top: 10px; }
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:3000; justify-content:center; align-items:center; padding:20px; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 20px; width: 100%; max-width: 340px; border: 1px solid #333; }
    </style>
</head>
<body>

<div class="app-container" id="main-app">
    <div id="auth-overlay">
        <h2 style="text-align:center; color: var(--gold); margin-bottom: 20px;">🐪 سباق الهجن PRO</h2>
        <div class="auth-tabs">
            <div id="tb-login" class="auth-tab active" onclick="switchAuth('login')">دخول</div>
            <div id="tb-signup" class="auth-tab" onclick="switchAuth('signup')">تسجيل</div>
        </div>
        <input type="text" id="ui" placeholder="اسم المستخدم" style="width:100%; padding:12px; background:#12191f; border:1px solid #333; color:white; border-radius:10px; margin-bottom:10px; text-align:center">
        <input type="password" id="pi" placeholder="كلمة المرور" style="width:100%; padding:12px; background:#12191f; border:1px solid #333; color:white; border-radius:10px; margin-bottom:10px; text-align:center">
        <input type="text" id="ri" placeholder="كود الإحالة (اختياري)" style="width:100%; padding:12px; background:#12191f; border:1px solid #333; color:white; border-radius:10px; margin-bottom:20px; text-align:center">
        <button id="auth-bt" class="main-btn btn-bet" onclick="handleAuth()">دخول</button>
    </div>

    <div class="header">
        <div class="user-section"><button onclick="location.reload()" style="background:none; border:1px solid var(--error); color:var(--error); padding:2px 5px; border-radius:4px; font-size:10px; cursor:pointer">خروج</button><span id="un" style="font-weight:bold; color:var(--accent); margin-right:5px">...</span></div>
        <div style="display: flex; align-items: center;"><button class="btn-deposit" onclick="openDeposit()">+</button><div class="balance-box">💰 <span id="ub">0.00</span></div></div>
    </div>

    <div id="display-zone">
        <div id="timer-val">5</div>
        <div id="mult-val" style="display: none;">1.00x</div>
    </div>

    <div class="track" id="tr-container">
        <div class="moving-bg" id="bg-move"></div>
        <div id="cw" class="camel-wrap"><div class="camel">🐪</div></div>
    </div>

    <div class="controls">
        <div class="input-group">
            <div class="field"><label>الرهان</label><input type="number" id="ba" value="10"></div>
            <div class="field"><label>هدف تلقائي</label><input type="number" id="av" value="2.00"></div>
            <div class="auto-switch-wrap">
                <label style="font-size: 8px; color: var(--accent);">سحب آلي</label>
                <label class="switch"><input type="checkbox" id="auto-cash-toggle"><span class="slider"></span></label>
            </div>
        </div>
        <button id="ab" class="main-btn btn-bet" onclick="mainAction()">وضع رهان</button>
    </div>

    <div id="history-box"></div>
    <div class="ref-section">كود الإحالة: <b id="my-ref-code" style="color:var(--gold)">---</b></div>
</div>

<div id="deposit-modal" class="modal">
    <div class="modal-content">
        <h3 style="text-align:center; color:var(--gold); margin-bottom:15px;">إيداع USDT (TRC20)</h3>
        <div style="background:#0d1117; padding:10px; border-radius:8px; word-break:break-all; color:var(--accent); font-size:11px; text-align:center; margin-bottom:15px; border:1px solid #333;">TG9gT1pPJK3aETRp1hVu28F5Zayu4oVyEg</div>
        <input type="text" id="tx-hash" placeholder="رقم العملية (Hash)" style="width:100%; padding:10px; background:#12191f; border:1px solid #333; color:white; border-radius:8px; margin-bottom:10px;">
        <input type="number" id="dep-amount" placeholder="المبلغ" style="width:100%; padding:10px; background:#12191f; border:1px solid #333; color:white; border-radius:8px; margin-bottom:15px;">
        <button class="main-btn btn-bet" onclick="submitDeposit()">تأكيد الإرسال</button>
        <button onclick="closeDeposit()" style="width:100%; background:none; border:none; color:var(--error); margin-top:10px; cursor:pointer;">إلغاء</button>
    </div>
</div>

<script>
    const SB_URL = "https://uqmfwgdrlcqywxvdljlb.supabase.co";
    const SB_KEY = "sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT";
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let user = null, state = 'waiting', mode = 'login';
    let nextT = 0, startT = 0, crashP = 0, betted = false, cashed = false, currentMult = 1.00;

    function generateCrashPoint() {
        const rand = Math.random() * 100;
        if (rand < 70) return parseFloat((1 + Math.random() * 0.9).toFixed(2));
        if (rand < 90) return parseFloat((1.9 + Math.random() * 8).toFixed(2));
        return parseFloat((10 + Math.random() * 90).toFixed(2));
    }

    // توليد غبار كثيف جداً بشكل مستقر
    function createDust() {
        if (state !== 'racing') return;
        const tr = document.getElementById('tr-container');
        const cw = document.getElementById('cw');
        const rect = cw.getBoundingClientRect();
        const trRect = tr.getBoundingClientRect();
        
        for(let i=0; i<4; i++) {
            const d = document.createElement('div');
            d.className = 'dust';
            d.style.left = (rect.left - trRect.left + 10) + 'px';
            d.style.bottom = (Math.random() * 20 + 15) + 'px';
            const size = Math.random() * 15 + 10;
            d.style.width = size + 'px'; d.style.height = size + 'px';
            tr.appendChild(d);
            setTimeout(() => d.remove(), 500);
        }
    }

    function triggerVisualExplosion() {
        const zone = document.getElementById('display-zone');
        for(let i=0; i<10; i++) {
            const p = document.createElement('div');
            p.className = 'exp-particle';
            p.style.width = '25px'; p.style.height = '25px';
            p.style.left = '50%'; p.style.top = '50%';
            zone.appendChild(p);
            setTimeout(() => p.remove(), 600);
        }
    }

    function switchAuth(m) {
        mode = m;
        document.getElementById('tb-login').classList.toggle('active', m==='login');
        document.getElementById('tb-signup').classList.toggle('active', m==='signup');
        document.getElementById('auth-bt').innerText = m==='login' ? 'دخول' : 'إنشاء حساب';
    }

    async function handleAuth() {
        const u = document.getElementById('ui').value, p = document.getElementById('pi').value, r = document.getElementById('ri').value;
        if(!u || p.length < 6) return alert("البيانات غير صالحة");
        const email = `${u.trim()}@camel.com`;
        try {
            if(mode === 'signup') {
                const { data, error } = await sb.auth.signUp({ email, password: p });
                if(error) throw error;
                const rc = Math.random().toString(36).substring(2, 7).toUpperCase();
                await sb.from('Profiles').insert([{ id: data.user.id, username: u, balance: 0, referral_code: rc, referred_by: r || null }]);
                alert("تم التسجيل!"); switchAuth('login');
            } else {
                const { data, error } = await sb.auth.signInWithPassword({ email, password: p });
                if(error) throw error;
                const { data: pr } = await sb.from('Profiles').select('*').eq('id', data.user.id).single();
                user = pr; startApp();
            }
        } catch(e) { alert(e.message); }
    }

    function startApp() {
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('un').innerText = user.username;
        document.getElementById('ub').innerText = user.balance.toFixed(2);
        document.getElementById('my-ref-code').innerText = user.referral_code;
        engine(); sync();
    }

    function engine() {
        setInterval(() => {
            const now = Date.now();
            if (state === 'paused') return;

            if(now < nextT) {
                state = 'waiting';
                document.getElementById('timer-val').innerText = Math.ceil((nextT - now)/1000);
                document.getElementById('timer-val').style.display = 'block';
                document.getElementById('mult-val').style.display = 'none';
                document.getElementById('bg-move').style.display = 'none';
                document.getElementById('cw').style.display = 'block';
                updateBtnUI(); resetScene();
            } else if (startT > 0) {
                state = 'racing';
                document.getElementById('bg-move').style.display = 'block';
                let el = (now - startT)/1000;
                currentMult = Math.pow(1.08, el);
                
                if(currentMult >= crashP) { explosion(); } 
                else {
                    document.getElementById('timer-val').style.display = 'none';
                    const mv = document.getElementById('mult-val');
                    mv.style.display = 'block'; mv.innerText = currentMult.toFixed(2)+'x';
                    
                    // تحكم دقيق في موقع الجمل (حد أقصى 75%)
                    let progress = Math.min(el * 10, 75);
                    document.getElementById('cw').style.left = progress + '%';
                    
                    createDust();
                    updateBtnUI();

                    if(betted && !cashed && document.getElementById('auto-cash-toggle').checked) {
                        if(currentMult >= parseFloat(document.getElementById('av').value)) doCashout();
                    }
                }
            } else { 
                crashP = generateCrashPoint();
                startT = Date.now(); cashed = false; 
            }
        }, 60); // زيادة المهلة قليلاً لتحقيق استقرار المعالج
    }

    function updateBtnUI() {
        const btn = document.getElementById('ab');
        if (state === 'waiting') {
            btn.innerText = betted ? "تم قبول الرهان" : "وضع رهان";
            btn.className = betted ? "main-btn btn-wait" : "main-btn btn-bet";
        } else if (state === 'racing') {
            if (betted && !cashed) {
                let pot = (currentMult * parseFloat(document.getElementById('ba').value)).toFixed(2);
                btn.innerText = `سحب ${pot}`; btn.className = "main-btn btn-cash";
            } else { btn.innerText = "انتظر..."; btn.className = "main-btn btn-wait"; }
        }
    }

    async function doCashout() {
        if(cashed || !betted || state !== 'racing') return;
        cashed = true;
        let win = parseFloat(document.getElementById('ba').value) * currentMult;
        user.balance += win; 
        document.getElementById('ub').innerText = user.balance.toFixed(2);
        await sb.from('Profiles').update({ balance: user.balance }).eq('id', user.id);
        updateBtnUI();
    }

    async function explosion() {
        state = 'paused';
        document.getElementById('bg-move').style.display = 'none';
        document.getElementById('cw').style.display = 'none';
        triggerVisualExplosion();
        const mv = document.getElementById('mult-val');
        mv.innerText = crashP.toFixed(2) + 'x';
        mv.classList.add('crash-anim');
        
        await sb.from('GameHistory').insert([{ crash_point: crashP }]);
        sync();
        
        setTimeout(() => {
            state = 'waiting'; startT = 0; betted = false;
            nextT = Date.now() + 4000;
            mv.classList.remove('crash-anim');
        }, 2500);
    }

    async function mainAction() {
        if(state === 'waiting' && !betted) {
            const amt = parseFloat(document.getElementById('ba').value);
            if(user.balance >= amt && amt > 0) {
                betted = true; user.balance -= amt;
                document.getElementById('ub').innerText = user.balance.toFixed(2);
                await sb.from('Profiles').update({ balance: user.balance }).eq('id', user.id);
                updateBtnUI();
            } else { alert("الرصيد غير كافٍ"); }
        } else if (state === 'racing' && betted && !cashed) doCashout();
    }

    function resetScene() {
        document.getElementById('cw').style.left = '0%';
        if(!betted) cashed = false;
    }

    async function sync() {
        const { data } = await sb.from('GameHistory').select('*').order('created_at', {ascending:false}).limit(20);
        if(data) {
            document.getElementById('history-box').innerHTML = data.map(i => 
                `<div class="hi" style="color:${i.crash_point < 2 ? '#ff4b4b' : '#00ff88'}">${i.crash_point.toFixed(2)}x</div>`
            ).join('');
        }
    }

    function openDeposit() { document.getElementById('deposit-modal').style.display = 'flex'; }
    function closeDeposit() { document.getElementById('deposit-modal').style.display = 'none'; }
    async function submitDeposit() {
        const h = document.getElementById('tx-hash').value, a = document.getElementById('dep-amount').value;
        if(!h || !a) return alert("املأ البيانات");
        await sb.from('deposits').insert([{ user_id: user.id, amount: parseFloat(a), tx_hash: h }]);
        alert("جاري المراجعة ✅"); closeDeposit();
    }
</script>
</body>
</html>
