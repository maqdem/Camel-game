<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سباق الجمل - النسخة النهائية</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b141a; color: white; text-align: center; margin: 0; padding: 10px; }
        .card { background: #1c262d; padding: 20px; border-radius: 20px; max-width: 400px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #2d333b; }
        #multiplier { font-size: 65px; font-weight: 900; color: #00ff88; margin: 20px 0; display: none; height: 80px; align-items: center; justify-content: center; }
        .sky-area { background: #12191f; height: 160px; border-radius: 15px; position: relative; overflow: hidden; margin-bottom: 15px; border: 2px solid #2d333b; }
        
        /* هنا نضع صورة الجمل كخلفية أو عنصر ثابت */
        .plane { 
            width: 80px; height: 80px; 
            position: absolute; left: 10%; bottom: 20px; 
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...'); /* استبدل النقاط بكود Base64 الذي استخرجته */
            background-size: contain; background-repeat: no-repeat;
            transition: transform 0.1s linear;
        }
        
        .controls { background: #12191f; padding: 15px; border-radius: 15px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2d333b; background: #1c262d; color: white; text-align: center; margin-bottom: 10px; }
        button { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-bet { background: #238636; color: white; }
        .btn-cashout { background: #f85149; color: white; }
        .leaderboard { margin-top: 20px; background: #12191f; border-radius: 15px; padding: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div id="login-ui" class="card">
    <h2>تسجيل الدخول</h2>
    <input type="text" id="u" placeholder="اسم المستخدم">
    <input type="password" id="p" placeholder="كلمة السر">
    <button onclick="login()" class="btn-bet">دخول</button>
</div>

<div id="game-ui" style="display:none;" class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span id="user-name"></span>
        <span style="color:#e3b341;">💰 <span id="user-balance">0</span></span>
    </div>

    <div id="multiplier">1.00x</div>
    <div id="countdown-box" style="font-size: 50px; color: #ffcc00;">5</div>

    <div class="sky-area">
        <div id="plane-img" class="plane">🐪</div>
    </div>

    <div class="controls">
        <input type="number" id="bet-amount" value="10">
        <div style="display: flex; gap: 5px; align-items: center; margin-bottom: 10px;">
            <label style="font-size: 12px;">سحب تلقائي:</label>
            <input type="number" id="auto-val" value="2.0" step="0.1" style="margin:0;">
        </div>
        <button id="main-btn" onclick="handleButtonClick()" class="btn-bet">رهان</button>
    </div>

    <div class="leaderboard">
        <strong>🏆 المتصدرون</strong>
        <div id="leader-list"></div>
    </div>
</div>

<script>
    // تأكد من وضع رابط Supabase ومفتاح API الخاص بك هنا
    const S_URL = 'https://uqmfwgdrlcqywxvdljlb.supabase.co';

    const _supabase = supabase.createClient(S_URL, S_KEY);

    // ... (بقية منطق البرمجة الخاص باللعبة كما في الكود السابق)
</script>
</body>
</html>
