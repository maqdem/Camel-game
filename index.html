<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سباق الجمال - Bet Camel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2ecc71; --secondary: #e74c3c; --bg: #1a1d21; --card: #24292e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; }
        
        /* الهيدر العلوي */
        .top-bar { display: flex; justify-content: space-between; padding: 10px; background: #121518; border-radius: 10px; margin-bottom: 10px; font-size: 14px; }
        
        /* منطقة السباق (الصحراء) */
        .desert-area { 
            background: linear-gradient(to bottom, #0f172a, #1e293b), url('https://www.transparenttextures.com/patterns/stardust.png');
            height: 220px; border-radius: 15px; position: relative; overflow: hidden; 
            border: 1px solid #334155; margin-bottom: 15px;
        }
        .moon { position: absolute; top: 20px; right: 40px; font-size: 30px; opacity: 0.8; }
        .dunes { position: absolute; bottom: 0; width: 100%; height: 60px; background: #c2914d; clip-path: polygon(0% 50%, 20% 30%, 45% 60%, 70% 20%, 100% 50%, 100% 100%, 0% 100%); }
        .camel { font-size: 50px; position: absolute; left: 10%; bottom: 30px; transition: transform 0.1s linear; z-index: 10; }
        
        .multiplier-text { 
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 55px; font-weight: 900; color: #4ade80; text-shadow: 0 0 20px rgba(74,222,128,0.5); display: none;
        }

        /* منطقة التحكم والمدخلات */
        .controls-grid { background: var(--card); padding: 15px; border-radius: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-group { text-align: right; }
        .input-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #121518; color: white; box-sizing: border-box; }
        
        .btn-action { grid-column: span 2; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 18px; }
        .btn-start { background: var(--primary); color: white; }
        .btn-cash { background: var(--secondary); color: white; }

        /* جدول النتائج السفلي */
        .history-table { margin-top: 15px; width: 100%; border-collapse: collapse; font-size: 13px; }
        .history-table th { color: #94a3b8; padding: 10px; text-align: center; border-bottom: 1px solid #334155; }
        .history-table td { padding: 10px; text-align: center; }
        .badge { padding: 3px 8px; border-radius: 5px; font-weight: bold; }
        .badge-win { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
        .badge-loss { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }

        #login-ui { max-width: 350px; margin: 100px auto; padding: 30px; background: var(--card); border-radius: 20px; }
    </style>
</head>
<body>

<div id="login-ui">
    <h2 style="margin-top:0">تسجيل الدخول</h2>
    <input type="text" id="u" placeholder="اسم المستخدم" style="margin-bottom:15px">
    <input type="password" id="p" placeholder="كلمة السر" style="margin-bottom:20px">
    <button onclick="login()" class="btn-action btn-start" id="l-btn">دخول</button>
</div>

<div id="game-ui" style="display:none;">
    <div class="top-bar">
        <span>👤 <span id="user-name"></span></span>
        <span style="color:#fbbf24">💰 <span id="user-balance">0</span></span>
    </div>

    <div class="desert-area">
        <div class="moon">🌙</div>
        <div id="multiplier" class="multiplier-text">1.00x</div>
        <div id="camel-img" class="camel">🐪</div>
        <div class="dunes"></div>
    </div>

    <div class="controls-grid">
        <div class="input-group">
            <label>قيمة الرهان</label>
            <input type="number" id="bet-amount" value="100">
        </div>
        <div class="input-group">
            <label>التوقع (Guess)</label>
            <input type="number" id="guess-amount" value="2.0">
        </div>
        <button id="main-btn" onclick="handleAction()" class="btn-action btn-start">بدء السباق</button>
    </div>

    <table class="history-table">
        <thead>
            <tr>
                <th>النتيجة</th>
                <th>المضاعف</th>
                <th>المبلغ</th>
            </tr>
        </thead>
        <tbody id="history-body"></tbody>
    </table>
</div>

<script>
    const S_URL = 'https://uqmfwgdrlcqywxvdljlb.supabase.co';
    const S_KEY = 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT';
    const _supabase = supabase.createClient(S_URL, S_KEY);

    let currentBalance, username, gameInterval, currentMult = 1.0, crashPt = 0, isBetted = false;

    async function login() {
        const u = document.getElementById('u').value.trim();
        const p = document.getElementById('p').value.trim();
        const { data } = await _supabase.from('Profiles').select('*').eq('username', u).eq('password', p).single();
        if (data) {
            username = data.username; currentBalance = data.balance;
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            updateUI();
            resetRound();
        } else { alert("خطأ في البيانات"); }
    }

    function updateUI() {
        document.getElementById('user-name').innerText = username;
        document.getElementById('user-balance').innerText = Math.floor(currentBalance);
    }

    function resetRound() {
        currentMult = 1.0; isBetted = false;
        document.getElementById('multiplier').style.display = 'none';
        document.getElementById('multiplier').style.color = "#4ade80";
        document.getElementById('camel-img').style.transform = "translateX(0)";
        const btn = document.getElementById('main-btn');
        btn.innerText = "بدء السباق";
        btn.className = "btn-action btn-start";
        btn.disabled = false;
    }

    function handleAction() {
        const btn = document.getElementById('main-btn');
        if (btn.innerText === "بدء السباق") {
            startRace();
        } else {
            cashOut();
        }
    }

    function startRace() {
        let amt = parseFloat(document.getElementById('bet-amount').value);
        if (amt > currentBalance) return alert("الرصيد لا يكفي");
        
        currentBalance -= amt;
        isBetted = true;
        updateUI();

        document.getElementById('multiplier').style.display = 'block';
        const btn = document.getElementById('main-btn');
        btn.innerText = "سحب الأرباح";
        btn.className = "btn-action btn-cash";

        // احتمالات الجمل
        crashPt = (Math.random() * 5 + 1.1).toFixed(2); 

        gameInterval = setInterval(() => {
            currentMult = parseFloat((currentMult + 0.05).toFixed(2));
            document.getElementById('multiplier').innerText = currentMult + "x";
            
            // حركة الجمل
            let move = (currentMult - 1) * 40;
            document.getElementById('camel-img').style.transform = `translateX(${Math.min(move, 250)}px)`;

            if (currentMult >= crashPt) finishRace(false);
        }, 100);
    }

    async function cashOut() {
        clearInterval(gameInterval);
        let win = currentMult * parseFloat(document.getElementById('bet-amount').value);
        currentBalance += win;
        updateUI();
        addToHistory("فوز", currentMult, win.toFixed(0));
        await _supabase.from('Profiles').update({ balance: Math.floor(currentBalance) }).eq('username', username);
        finishRace(true);
    }

    function finishRace(isWin) {
        clearInterval(gameInterval);
        if (!isWin) {
            document.getElementById('multiplier').style.color = "#e74c3c";
            document.getElementById('multiplier').innerText = "تعثر! " + currentMult + "x";
            addToHistory("خسارة", currentMult, "-");
        }
        document.getElementById('main-btn').disabled = true;
        setTimeout(resetRound, 3000);
    }

    function addToHistory(status, mult, amt) {
        const body = document.getElementById('history-body');
        const row = `<tr>
            <td><span class="badge ${status === 'فوز' ? 'badge-win' : 'badge-loss'}">${status}</span></td>
            <td>${mult}x</td>
            <td>${amt}</td>
        </tr>`;
        body.innerHTML = row + body.innerHTML;
        if (body.children.length > 5) body.removeChild(body.lastChild);
    }
</script>
</body>
</html>
