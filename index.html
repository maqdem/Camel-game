<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن العالمي | Camel Dash Pro</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; --input: #12191f; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 420px; height: 95vh; background: var(--card); padding: 20px; border-radius: 30px; border: 1px solid #2d333b; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; overflow-y: auto; scrollbar-width: none; }
        .app-container::-webkit-scrollbar { display: none; }

        /* Auth Overlay */
        #auth-overlay { position: absolute; inset: 0; background: rgba(11, 20, 26, 0.98); z-index: 1000; display: flex; flex-direction: column; justify-content: center; padding: 30px; }
        
        /* Game Elements */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .balance-box { background: rgba(255, 204, 0, 0.15); padding: 8px 15px; border-radius: 12px; border: 1px solid var(--gold); color: var(--gold); font-weight: 900; font-size: 16px; }
        
        #main-timer { font-size: 80px; font-weight: 900; color: var(--gold); text-align: center; height: 100px; line-height: 100px; }
        .multiplier { font-size: 70px; font-weight: 900; color: var(--accent); display: none; text-align: center; height: 100px; line-height: 100px; }
        
        .track { height: 120px; background: var(--input); border-radius: 20px; position: relative; overflow: hidden; border: 2px solid #2d333b; margin: 10px 0; background-image: linear-gradient(90deg, transparent 45%, rgba(255,255,255,0.03) 50%); background-size: 60px 100%; }
        .camel-wrapper { position: absolute; bottom: 10px; left: 0; transition: left 0.4s ease-out; z-index: 5; }
        .camel { font-size: 50px; transform: scaleX(-1); }
        .dust { position: absolute; bottom: 5px; left: -10px; width: 20px; height: 10px; background: rgba(255,255,255,0.1); border-radius: 50%; filter: blur(4px); display: none; }
        
        .explosion { position: absolute; width: 80px; height: 80px; background: radial-gradient(circle, #ffcc00, #ff4b4b, transparent); border-radius: 50%; display: none; z-index: 6; animation: explode 0.5s ease-out; }

        /* Tabs & Panels */
        .extra-tabs { display: flex; gap: 5px; margin-top: 15px; background: #0d1117; padding: 5px; border-radius: 12px; }
        .tab-small { flex: 1; padding: 8px; font-size: 12px; border: none; background: transparent; color: #888; cursor: pointer; border-radius: 8px; }
        .tab-small.active { background: #1c262d; color: var(--accent); font-weight: bold; }
        .panel { display: none; background: #0d1117; border-radius: 15px; padding: 10px; height: 200px; overflow-y: auto; margin-top: 5px; }
        .panel.active { display: block; }

        /* Chat Styles */
        .chat-msg { font-size: 12px; margin-bottom: 8px; border-bottom: 1px solid #1c262d; padding-bottom: 4px; }
        .chat-user { color: var(--accent); font-weight: bold; }
        .chat-input-area { display: flex; gap: 5px; margin-top: 5px; }
        .chat-input { flex: 1; background: var(--input); border: 1px solid #333; color: white; padding: 8px; border-radius: 8px; font-size: 12px; }

        /* Leaderboard Styles */
        .lb-row { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #1c262d; font-size: 13px; }
        .lb-rank { color: var(--gold); font-weight: bold; margin-left: 10px; }

        /* Existing Controls */
        .controls { background: #0d1117; padding: 15px; border-radius: 20px; display: flex; flex-direction: column; gap: 10px; }
        .input-row { display: flex; gap: 8px; align-items: flex-end; }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .field-small { width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #333; background: var(--input); color: white; text-align: center; font-weight: bold; outline: none; }
        
        .toggle-container { display: flex; align-items: center; background: #1c262d; padding: 8px; border-radius: 10px; cursor: pointer; border: 1px solid #333; min-width: 80px; justify-content: space-between; }
        .toggle-container.on { border-color: var(--accent); background: rgba(0, 255, 136, 0.1); }
        .switch { width: 30px; height: 16px; background: #333; border-radius: 20px; position: relative; transition: 0.3s; }
        .toggle-container.on .switch { background: var(--accent); }
        .dot { width: 12px; height: 12px; background: white; border-radius: 50%; position: absolute; top: 2px; right: 2px; transition: 0.3s; }
        .toggle-container.on .dot { right: 16px; }

        .main-btn { width: 100%; padding: 15px; border-radius: 15px; border: none; font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cashout { background: var(--error); color: white; }
        .btn-waiting { background: #222; color: #555; pointer-events: none; }

        .shake { animation: shakeAnim 0.3s ease-in-out; }
        @keyframes shakeAnim { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
        @keyframes explode { 0% { transform: scale(0.1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <div id="auth-overlay">
        <h2 style="color: var(--accent); text-align: center;">سباق الهجن 🐪</h2>
        <div class="auth-tabs" style="display:flex; gap:10px; margin-bottom:20px;">
            <button class="tab-btn active" id="login-tab" onclick="switchAuth('login')" style="flex:1; padding:10px;">دخول</button>
            <button class="tab-btn" id="signup-tab" onclick="switchAuth('signup')" style="flex:1; padding:10px;">تسجيل</button>
        </div>
        <input type="text" id="username" class="input-field" placeholder="اسم المستخدم">
        <input type="password" id="password" class="input-field" placeholder="كلمة المرور">
        <button class="main-btn btn-bet" onclick="processAuth()">ابدأ الآن</button>
    </div>

    <div id="game-screen">
        <div class="header">
            <div onclick="logout()" style="cursor: pointer;">
                <span id="player-display" style="font-weight: bold; color: var(--accent);">جاري التحميل...</span>
            </div>
            <div id="bal-box" class="balance-box">💰 <span id="balance">0.00</span></div>
        </div>
        
        <div id="main-timer">5</div>
        <div id="mult-display" class="multiplier">1.00x</div>
        
        <div class="track" id="track-box">
            <div id="camel-wrap" class="camel-wrapper">
                <div class="camel">🐪</div>
                <div id="dust-fx" class="dust"></div>
            </div>
            <div id="boom-fx" class="explosion"></div>
        </div>

        <div class="controls">
            <div class="input-row">
                <div class="input-group">
                    <label style="font-size:10px">الرهان</label>
                    <input type="number" id="bet-amount" class="field-small" value="10">
                </div>
                <div class="input-group">
                    <label style="font-size:10px">هدف تلقائي</label>
                    <input type="number" id="auto-val" class="field-small" value="2.00">
                </div>
                <div id="auto-toggle" class="toggle-container" onclick="toggleAuto()">
                    <span style="font-size:10px">تلقائي</span>
                    <div class="switch"><div class="dot"></div></div>
                </div>
            </div>
            <button id="action-btn" class="main-btn btn-bet" onclick="handleAction()">وضع رهان</button>
        </div>

        <div class="extra-tabs">
            <button class="tab-small active" onclick="showPanel('history')">السجل</button>
            <button class="tab-small" onclick="showPanel('chat')">الدردشة</button>
            <button class="tab-small" onclick="showPanel('leaderboard')">المتصدرون</button>
        </div>

        <div id="history" class="panel active">
            <div id="history-list" style="display:flex; flex-wrap:wrap; gap:5px;"></div>
        </div>

        <div id="chat" class="panel">
            <div id="chat-msgs" style="height:140px; overflow-y:auto; margin-bottom:5px;"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" class="chat-input" placeholder="اكتب رسالة...">
                <button onclick="sendMsg()" style="padding:5px 10px; background:var(--accent); border:none; border-radius:5px; font-weight:bold;">إرسال</button>
            </div>
        </div>

        <div id="leaderboard" class="panel">
            <div id="lb-list"></div>
        </div>
    </div>
</div>

<script>
    const CONF = { 
        URL: 'https://uqmfwgdrlcqywxvdljlb.supabase.co', 
        KEY: 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT' 
    };
    const supabaseClient = supabase.createClient(CONF.URL, CONF.KEY);

    let user = null, betPlaced = false, userInRace = false, cashed = false, currentBet = 0, autoOn = false;
    let currentGameState = "waiting"; const CYCLE = 15, WAIT = 5;
    let bgPos = 0;

    async function checkSavedSession() {
        const saved = localStorage.getItem('camel_session');
        if (saved) {
            const userId = JSON.parse(saved).id;
            const { data: profile } = await supabaseClient.from('Profiles').select('*').eq('id', userId).single();
            if (profile) launch(profile);
        }
    }

    function launch(p) {
        user = p; 
        localStorage.setItem('camel_session', JSON.stringify({ id: p.id }));
        document.getElementById('auth-overlay').style.display = 'none';
        updateUI();
        syncHistory();
        syncLeaderboard();
        listenChat();
    }

    function globalEngine() {
        setInterval(() => {
            const now = Date.now() / 1000, pos = now % CYCLE, roundId = Math.floor(now / CYCLE);
            const crashAt = getCrash(roundId);

            if (pos < WAIT) {
                if (currentGameState !== "waiting") { currentGameState = "waiting"; resetVisuals(); syncHistory(); syncLeaderboard(); }
                if (autoOn) betPlaced = true;
                renderWait(Math.ceil(WAIT - pos));
            } else {
                const elapsed = pos - WAIT, mult = Math.pow(1.12, elapsed);
                if (mult >= crashAt) {
                    if (currentGameState !== "crashed") { currentGameState = "crashed"; renderCrash(crashAt); logGame(crashAt); }
                } else {
                    currentGameState = "racing";
                    renderRace(mult, elapsed);
                    if (userInRace && !cashed && autoOn) {
                        if (mult >= parseFloat(document.getElementById('auto-val').value)) doCashout(mult);
                    }
                    if (user && betPlaced && !userInRace) joinRace();
                }
            }
        }, 50);
    }

    function getCrash(id) {
        let r = Math.abs(Math.sin(id * 789.123) * 10000) % 1;
        return Math.max(1.01, Math.min(parseFloat((0.98 / (1 - r * 0.98)).toFixed(2)), 500));
    }

    function renderWait(s) {
        document.getElementById('main-timer').style.display = 'block';
        document.getElementById('main-timer').innerText = s;
        document.getElementById('mult-display').style.display = 'none';
        updateBtn(betPlaced ? "بانتظار السباق..." : "وضع رهان", betPlaced ? "btn-waiting" : "btn-bet");
    }

    function renderRace(m, e) {
        document.getElementById('main-timer').style.display = 'none';
        const d = document.getElementById('mult-display');
        d.style.display = 'block'; d.innerText = m.toFixed(2) + "x";
        
        const camelPos = Math.min(e * 4, 75);
        document.getElementById('camel-wrap').style.left = camelPos + "%";
        document.getElementById('dust-fx').style.display = "block";
        
        bgPos -= (2 + m);
        document.getElementById('track-box').style.backgroundPosition = bgPos + "px 0px";
        
        if (userInRace && !cashed) updateBtn("سحب الأرباح", "btn-cashout", (m * currentBet).toFixed(2));
    }

    function renderCrash(cp) {
        document.getElementById('mult-display').style.color = "var(--error)";
        document.getElementById('app').classList.add('shake');
        setTimeout(() => document.getElementById('app').classList.remove('shake'), 300);
        
        const boom = document.getElementById('boom-fx');
        boom.style.left = document.getElementById('camel-wrap').style.left;
        boom.style.display = "block";
        document.getElementById('camel-wrap').style.opacity = "0";
        document.getElementById('dust-fx').style.display = "none";
        
        updateBtn("انفجر الجمل!", "btn-waiting");
        userInRace = false; betPlaced = false;
    }

    async function doCashout(m) {
        if (cashed || !userInRace) return;
        cashed = true;
        const win = currentBet * m;
        user.balance += win;
        updateUI();
        await supabaseClient.from('Profiles').update({ balance: user.balance }).eq('id', user.id);
        updateBtn("تم السحب ✅", "btn-waiting");
    }

    async function joinRace() {
        currentBet = parseFloat(document.getElementById('bet-amount').value);
        if (user.balance >= currentBet) {
            userInRace = true; cashed = false; betPlaced = false;
            user.balance -= currentBet;
            updateUI();
            await supabaseClient.from('Profiles').update({ balance: user.balance }).eq('id', user.id);
        } else {
            autoOn = false; alert("الرصيد غير كافٍ");
        }
    }

    function toggleAuto() {
        autoOn = !autoOn;
        document.getElementById('auto-toggle').classList.toggle('on', autoOn);
    }

    function handleAction() {
        if (currentGameState === "racing" && userInRace && !cashed) {
            doCashout(parseFloat(document.getElementById('mult-display').innerText));
        } else if (currentGameState === "waiting") {
            betPlaced = !betPlaced;
        }
    }

    // Panels System
    function showPanel(id) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-small').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    }

    // Leaderboard
    async function syncLeaderboard() {
        const { data } = await supabaseClient.from('Profiles').select('username, balance').order('balance', { ascending: false }).limit(5);
        if (data) {
            document.getElementById('lb-list').innerHTML = data.map((p, i) => `
                <div class="lb-row">
                    <span><span class="lb-rank">#${i+1}</span> ${p.username}</span>
                    <span style="color:var(--gold)">${p.balance.toFixed(2)}</span>
                </div>
            `).join('');
        }
    }

    // Chat System
    async function sendMsg() {
        const inp = document.getElementById('chat-input');
        if (!inp.value.trim() || !user) return;
        await supabaseClient.from('Messages').insert([{ user_id: user.id, username: user.username, text: inp.value }]);
        inp.value = '';
    }

    function listenChat() {
        supabaseClient.channel('chat').on('postgres_changes', { event: 'INSERT', table: 'Messages' }, payload => {
            const div = document.getElementById('chat-msgs');
            div.innerHTML += `<div class="chat-msg"><span class="chat-user">${payload.new.username}:</span> ${payload.new.text}</div>`;
            div.scrollTop = div.scrollHeight;
        }).subscribe();
    }

    // Helpers
    function updateUI() {
        if (user) {
            document.getElementById('balance').innerText = user.balance.toFixed(2);
            document.getElementById('player-display').innerText = user.username;
        }
    }

    function updateBtn(t, c, s="") {
        const b = document.getElementById('action-btn');
        b.className = `main-btn ${c}`;
        b.innerHTML = s ? `${t}<br><small>💰 ${s}</small>` : t;
    }

    function resetVisuals() {
        document.getElementById('camel-wrap').style.left = "0%";
        document.getElementById('camel-wrap').style.opacity = "1";
        document.getElementById('boom-fx').style.display = "none";
        document.getElementById('mult-display').style.color = "var(--accent)";
    }

    async function syncHistory() {
        const { data } = await supabaseClient.from('GameHistory').select('crash_point').order('created_at', { ascending: false }).limit(10);
        if (data) {
            document.getElementById('history-list').innerHTML = data.map(r => `
                <div style="padding:4px 8px; border-radius:5px; font-size:10px; background:#12191f; color:${r.crash_point < 2 ? 'var(--error)' : 'var(--accent)'}">
                    ${r.crash_point.toFixed(2)}x
                </div>
            `).join('');
        }
    }

    async function logGame(cp) {
        await supabaseClient.from('GameHistory').insert([{ crash_point: cp }]);
    }

    async function processAuth() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        const mode = window.authMode || 'login';
        
        if (mode === 'signup') {
            const { data, error } = await supabaseClient.auth.signUp({ email: `${u}@game.com`, password: p });
            if (error) return alert(error.message);
            // Profiles trigger should handle profile creation
            setTimeout(() => location.reload(), 1000);
        } else {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email: `${u}@game.com`, password: p });
            if (error) return alert(error.message);
            const { data: profile } = await supabaseClient.from('Profiles').select('*').eq('id', data.user.id).single();
            if (profile) launch(profile);
        }
    }

    function switchAuth(m) {
        window.authMode = m;
        document.getElementById('login-tab').classList.toggle('active', m==='login');
        document.getElementById('signup-tab').classList.toggle('active', m==='signup');
    }

    function logout() { localStorage.removeItem('camel_session'); location.reload(); }

    globalEngine();
    checkSavedSession();
</script>
</body>
</html>
