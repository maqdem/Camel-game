<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن الاحترافي | Global Camel Racing</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 420px; background: var(--card); padding: 20px; border-radius: 28px; border: 1px solid #2d333b; box-shadow: 0 15px 40px rgba(0,0,0,0.6); position: relative; }
        
        /* شاشة الدخول */
        .auth-box h2 { color: var(--accent); margin-bottom: 20px; font-weight: 800; }
        .input-field { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #333; background: #12191f; color: white; margin-bottom: 12px; font-size: 16px; text-align: center; outline: none; transition: 0.3s; }
        .input-field:focus { border-color: var(--accent); }

        /* الشاشة الرئيسية */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .balance-box { background: rgba(255, 204, 0, 0.15); padding: 8px 16px; border-radius: 12px; border: 1px solid var(--gold); color: var(--gold); font-weight: bold; font-size: 18px; }

        #main-timer { font-size: 90px; font-weight: 900; color: var(--gold); margin: 10px 0; letter-spacing: -2px; }
        .multiplier { font-size: 75px; font-weight: 900; color: var(--accent); display: none; margin: 10px 0; }
        
        /* المسار والخلفية المتحركة */
        .track { 
            height: 140px; background: #12191f; border-radius: 20px; position: relative; overflow: hidden; border: 2px solid #2d333b; margin: 15px 0;
            background-image: linear-gradient(90deg, transparent 45%, rgba(255,255,255,0.03) 50%);
            background-size: 50px 100%;
        }
        .camel { position: absolute; bottom: 15px; left: 0; font-size: 55px; z-index: 5; transition: left 0.1s linear; }

        /* أزرار التحكم */
        .controls { background: #0d1117; padding: 20px; border-radius: 22px; display: flex; flex-direction: column; gap: 12px; }
        button { width: 100%; padding: 18px; border-radius: 16px; border: none; font-size: 19px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cashout { background: var(--error); color: white; }
        .btn-waiting { background: #222; color: #555; pointer-events: none; }

        /* أنيميشن الربح */
        .win-popup { position: absolute; color: var(--accent); font-weight: 900; font-size: 24px; pointer-events: none; animation: winFly 1.5s forwards; z-index: 10; }
        @keyframes winFly { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-100px); opacity: 0; } }

        /* سجل الجولات */
        .history-list { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; flex-direction: row-reverse; scrollbar-width: none; }
        .history-item { min-width: 65px; padding: 8px; border-radius: 10px; background: #12191f; color: var(--accent); border: 1px solid rgba(0,255,136,0.2); font-size: 13px; font-weight: bold; text-align: center; }
        .hist-crash { color: var(--error); border-color: rgba(255,75,75,0.2); }
    </style>
</head>
<body>

<div class="app-container">
    <div id="auth-screen" class="auth-box">
        <h2>دخول السباق 🐪</h2>
        <input type="text" id="username" class="input-field" placeholder="اسم المستخدم">
        <input type="password" id="password" class="input-field" placeholder="كلمة المرور">
        <button class="btn-bet" onclick="handleAuth()">دخول / تسجيل</button>
    </div>

    <div id="game-screen" style="display:none;">
        <div class="header">
            <span id="player-name" style="opacity: 0.6;">---</span>
            <div class="balance-box">💰 <span id="balance">0.00</span></div>
        </div>

        <div id="main-timer">5</div>
        <div id="mult-display" class="multiplier">1.00x</div>
        
        <div class="track" id="track-box">
            <div id="camel" class="camel">🐪</div>
        </div>

        <div class="controls">
            <input type="number" id="bet-amount" class="input-field" value="10" min="1">
            <button id="action-btn" class="btn-bet" onclick="handleAction()">وضع رهان</button>
        </div>

        <div id="history-list" class="history-list"></div>
    </div>
</div>

<script>
    const CONF = { URL: 'https://uqmfwgdrlcqywxvdljlb.supabase.co', KEY: 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT' };
    const supabaseClient = supabase.createClient(CONF.URL, CONF.KEY);

    let user = null, betPlaced = false, userActive = false, cashed = false, currentBet = 0, bgPos = 0;
    const CYCLE = 20, WAIT = 5;

    async function handleAuth() {
        const u = document.getElementById('username').value, p = document.getElementById('password').value;
        if (!u || !p) return;
        let { data } = await supabaseClient.from('Profiles').select('*').eq('username', u).maybeSingle();
        if (data) {
            if (data.password === p) launch(data);
            else alert("خطأ في البيانات");
        } else {
            const { data: n } = await supabaseClient.from('Profiles').insert([{ username: u, password: p, balance: 100.00 }]).select().single();
            launch(n);
        }
    }

    function launch(p) {
        user = p;
        document.getElementById('auth-screen').style.display='none';
        document.getElementById('game-screen').style.display='block';
        updateUI(); syncHistory(); runEngine();
    }

    function runEngine() {
        setInterval(() => {
            const now = Date.now() / 1000;
            const pos = now % CYCLE;
            const roundId = Math.floor(now / CYCLE);
            const crashAt = getGlobalCrash(roundId);

            if (pos < WAIT) {
                renderWaiting(Math.ceil(WAIT - pos));
                window.isLogged = false;
            } else {
                const elapsed = pos - WAIT;
                const mult = Math.pow(1.15, elapsed);

                if (mult >= crashAt) {
                    renderCrash(crashAt);
                    if (!window.isLogged) { saveRound(crashAt.toFixed(2)); window.isLogged = true; }
                } else {
                    renderRacing(mult, elapsed);
                    if (betPlaced && !userActive) join();
                }
            }
        }, 50);
    }

    function getGlobalCrash(id) {
        let r = Math.abs(Math.sin(id * 789.123) * 10000) % 1;
        return Math.min(parseFloat((0.98 / (1 - r * 0.98)).toFixed(2)), 400);
    }

    function renderWaiting(s) {
        document.getElementById('main-timer').style.display = 'block';
        document.getElementById('mult-display').style.display = 'none';
        document.getElementById('main-timer').innerText = s;
        document.getElementById('camel').style.left = "0%";
        updateBtn(betPlaced ? "انتظار الانطلاق..." : "وضع رهان", betPlaced ? "btn-waiting" : "btn-bet");
    }

    function renderRacing(m, e) {
        document.getElementById('main-timer').style.display = 'none';
        const d = document.getElementById('mult-display');
        d.style.display = 'block'; d.innerText = m.toFixed(2) + "x";
        d.style.color = "var(--accent)";
        document.getElementById('camel').style.left = Math.min(e * 5.5, 45) + "%";
        bgPos -= (2 + m); document.getElementById('track-box').style.backgroundPosition = bgPos + "px 0px";
        if (userActive && !cashed) updateBtn("سحب الأرباح", "btn-cashout", (m * currentBet).toFixed(2));
    }

    function renderCrash(cp) {
        const d = document.getElementById('mult-display'); d.innerText = cp.toFixed(2) + "x"; d.style.color = "var(--error)";
        updateBtn("انفجر الجمل!", "btn-waiting");
        userActive = false;
    }

    function handleAction() {
        const pos = (Date.now() / 1000) % CYCLE;
        if (pos < WAIT) betPlaced = !betPlaced;
        else if (userActive && !cashed) {
            const m = parseFloat(document.getElementById('mult-display').innerText);
            doCashout(m);
        }
    }

    function join() {
        currentBet = parseFloat(document.getElementById('bet-amount').value);
        if (user.balance >= currentBet) {
            userActive = true; cashed = false; betPlaced = false;
            user.balance -= currentBet; updateUI(); saveBalance();
        }
    }

    function doCashout(m) {
        cashed = true; const win = currentBet * m; user.balance += win;
        triggerWinAnim(win.toFixed(2)); updateUI(); saveBalance();
        updateBtn("تم السحب!", "btn-waiting");
    }

    function triggerWinAnim(amt) {
        const p = document.createElement('div'); p.className = 'win-popup'; p.innerText = `+${amt}`;
        const c = document.getElementById('camel');
        p.style.left = c.offsetLeft + "px"; p.style.top = c.offsetTop + "px";
        document.getElementById('track-box').appendChild(p);
        setTimeout(() => p.remove(), 1500);
    }

    async function saveRound(p) {
        addUIHist(p);
        await supabaseClient.rpc('add_crash_record', { crash_val: parseFloat(p) });
    }

    async function syncHistory() {
        const { data } = await supabaseClient.from('GameHistory').select('crash_point').order('created_at', { ascending: false }).limit(10);
        if (data) data.forEach(r => addUIHist(r.crash_point.toFixed(2)));
    }

    function addUIHist(v) {
        const l = document.getElementById('history-list'); const i = document.createElement('div');
        i.className = `history-item ${v < 2 ? 'hist-crash' : ''}`; i.innerText = v + 'x';
        l.insertBefore(i, l.firstChild); if (l.children.length > 10) l.removeChild(l.lastChild);
    }

    function updateUI() {
        document.getElementById('balance').innerText = user.balance.toFixed(2);
        document.getElementById('player-name').innerText = user.username;
    }

    function updateBtn(t, c, s="") {
        const b = document.getElementById('action-btn'); b.className = c;
        b.innerHTML = s ? `<span>${t}</span><br><small>💰 ${s}</small>` : t;
    }

    async function saveBalance() {
        await supabaseClient.from('Profiles').update({ balance: user.balance }).eq('id', user.id);
    }
</script>
</body>
</html>
