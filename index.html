<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن العالمي | Camel Dash Pro</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 420px; background: var(--card); padding: 25px; border-radius: 30px; border: 1px solid #2d333b; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        
        /* شاشة المصادقة */
        #auth-overlay {
            position: absolute; inset: 0; background: rgba(11, 20, 26, 0.95);
            z-index: 100; display: flex; flex-direction: column; justify-content: center; padding: 30px;
            transition: 0.5s;
        }
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background: #2d333b; border-radius: 10px; cursor: pointer; border: none; color: white; font-weight: bold; }
        .tab-btn.active { background: var(--accent); color: #000; }
        .input-field { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #333; background: #12191f; color: white; margin-bottom: 15px; font-size: 16px; text-align: center; outline: none; }

        /* الهيدر واللعبة */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .balance-box { background: rgba(255, 204, 0, 0.15); padding: 10px 18px; border-radius: 14px; border: 1px solid var(--gold); color: var(--gold); font-weight: 900; font-size: 18px; }
        #main-timer { font-size: 90px; font-weight: 900; color: var(--gold); text-align: center; }
        .multiplier { font-size: 80px; font-weight: 900; color: var(--accent); display: none; text-align: center; }
        
        .track { height: 140px; background: #12191f; border-radius: 20px; position: relative; overflow: hidden; border: 2px solid #2d333b; margin: 15px 0; background-image: linear-gradient(90deg, transparent 45%, rgba(255,255,255,0.03) 50%); background-size: 60px 100%; }
        .camel-wrapper { position: absolute; bottom: 15px; left: 0; transition: left 0.4s ease-out; z-index: 5; }
        .camel { font-size: 55px; transform: scaleX(-1); }
        .explosion { position: absolute; width: 100px; height: 100px; background: radial-gradient(circle, #ffcc00, #ff4b4b, transparent); border-radius: 50%; display: none; z-index: 6; animation: explode 0.5s ease-out; }

        /* أزرار التحكم الجديدة */
        .controls { background: #0d1117; padding: 20px; border-radius: 22px; display: flex; flex-direction: column; gap: 15px; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        .field-small { flex: 1; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #12191f; color: white; text-align: center; font-weight: bold; outline: none; }
        
        /* زر الـ ON/OFF الأنيق */
        .auto-toggle {
            display: flex; align-items: center; background: #1c262d; padding: 5px 10px; border-radius: 12px; border: 1px solid #333; cursor: pointer; transition: 0.3s; min-width: 100px; justify-content: space-between;
        }
        .auto-toggle.on { border-color: var(--accent); background: rgba(0, 255, 136, 0.1); }
        .auto-toggle.disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
        .toggle-circle { width: 20px; height: 20px; background: #555; border-radius: 50%; transition: 0.3s; }
        .auto-toggle.on .toggle-circle { background: var(--accent); transform: translateX(-5px); box-shadow: 0 0 10px var(--accent); }
        .toggle-text { font-size: 12px; font-weight: bold; color: #888; }
        .auto-toggle.on .toggle-text { color: var(--accent); }

        button.main-btn { width: 100%; padding: 18px; border-radius: 16px; border: none; font-size: 18px; font-weight: 900; cursor: pointer; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cashout { background: var(--error); color: white; }
        .btn-waiting { background: #222; color: #555; pointer-events: none; }

        .history-list { display: flex; gap: 8px; overflow-x: auto; padding: 10px 5px; flex-direction: row-reverse; border-top: 1px solid #333; }
        .history-item { min-width: 60px; padding: 6px; border-radius: 8px; background: #12191f; color: var(--accent); font-size: 12px; font-weight: bold; text-align: center; }
        
        @keyframes explode { 0% { transform: scale(0.1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <div id="auth-overlay">
        <h2 style="color: var(--accent); text-align: center;">سباق الهجن 🐪</h2>
        <div class="auth-tabs">
            <button class="tab-btn active" onclick="switchAuth('login')">دخول</button>
            <button class="tab-btn" onclick="switchAuth('signup')">تسجيل</button>
        </div>
        <input type="text" id="username" class="input-field" placeholder="اسم المستخدم">
        <input type="password" id="password" class="input-field" placeholder="كلمة المرور">
        <button class="main-btn btn-bet" onclick="processAuth()">ابدأ الآن</button>
    </div>

    <div id="game-screen">
        <div class="header">
            <div class="player-info" onclick="logout()">
                <span id="player-display" style="font-weight: bold; color: var(--accent);">جاري التحميل...</span>
                <small style="opacity: 0.5; font-size: 10px; display: block;">تبديل الحساب</small>
            </div>
            <div id="bal-box" class="balance-box">💰 <span id="balance">0.00</span></div>
        </div>
        
        <div id="main-timer">5</div>
        <div id="mult-display" class="multiplier">1.00x</div>
        
        <div class="track" id="track-box">
            <div id="camel-wrap" class="camel-wrapper">
                <div class="camel">🐪</div>
            </div>
            <div id="boom-fx" class="explosion"></div>
        </div>

        <div class="controls">
            <div class="input-row">
                <div style="flex: 2; position: relative;">
                    <small style="position: absolute; top: -18px; left: 0; font-size: 10px; color: #888;">مبلغ الرهان</small>
                    <input type="number" id="bet-amount" class="field-small" value="5" min="1">
                </div>
                <div style="flex: 2; position: relative;">
                    <small style="position: absolute; top: -18px; left: 0; font-size: 10px; color: #888;">الهدف (X)</small>
                    <input type="number" id="auto-cashout-val" class="field-small" value="2.00" min="1.01" step="0.01">
                </div>
                <div id="auto-toggle-btn" class="auto-toggle" onclick="toggleAuto()">
                    <span class="toggle-text">تلقائي OFF</span>
                    <div class="toggle-circle"></div>
                </div>
            </div>
            <button id="action-btn" class="main-btn btn-bet" onclick="handleAction()">وضع رهان</button>
        </div>
        
        <div id="history-list" class="history-list"></div>
    </div>
</div>

<script>
    const CONF = { URL: 'https://uqmfwgdrlcqywxvdljlb.supabase.co', KEY: 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT' };
    const supabaseClient = supabase.createClient(CONF.URL, CONF.KEY);

    let user = null, betPlaced = false, userInRace = false, cashed = false, currentBet = 0, bgPos = 0;
    let isAutoOn = false, currentGameState = "waiting";
    const CYCLE = 15, WAIT = 5;

    async function checkSavedSession() {
        const saved = localStorage.getItem('camel_session');
        if (saved) {
            const { data: profile } = await supabaseClient.from('Profiles').select('*').eq('id', JSON.parse(saved).id).single();
            if (profile) launch(profile);
        }
    }

    function launch(profile) {
        user = profile;
        localStorage.setItem('camel_session', JSON.stringify({ id: profile.id }));
        document.getElementById('auth-overlay').style.display = 'none';
        updateUI();
    }

    function toggleAuto() {
        if (userInRace) return; // منع التغيير أثناء السباق
        isAutoOn = !isAutoOn;
        const btn = document.getElementById('auto-toggle-btn');
        btn.classList.toggle('on', isAutoOn);
        btn.querySelector('.toggle-text').innerText = isAutoOn ? "تلقائي ON" : "تلقائي OFF";
    }

    function globalEngine() {
        setInterval(() => {
            const now = Date.now() / 1000, pos = now % CYCLE, roundId = Math.floor(now / CYCLE);
            const crashAt = getCrash(roundId);

            if (pos < WAIT) {
                if (currentGameState !== "waiting") { currentGameState = "waiting"; resetVisuals(); syncHistory(); }
                renderWait(Math.ceil(WAIT - pos));
            } else {
                const elapsed = pos - WAIT, mult = Math.pow(1.12, elapsed);
                if (mult >= crashAt) {
                    if (currentGameState !== "crashed") { currentGameState = "crashed"; renderCrash(crashAt); }
                } else {
                    currentGameState = "racing";
                    renderRace(mult, elapsed);
                    if (user && userInRace && !cashed && isAutoOn) {
                        const target = parseFloat(document.getElementById('auto-cashout-val').value);
                        if (mult >= target) doCashout(target);
                    }
                    if (user && betPlaced && !userInRace) joinRace();
                }
            }
        }, 50);
    }

    function getCrash(id) {
        let r = Math.abs(Math.sin(id * 789.123) * 10000) % 1;
        return Math.max(1.01, Math.min(parseFloat((0.98 / (1 - r * 0.98)).toFixed(2)), 500));
    }

    function renderWait(s) {
        document.getElementById('main-timer').style.display = 'block';
        document.getElementById('main-timer').innerText = s;
        document.getElementById('mult-display').style.display = 'none';
        document.getElementById('auto-toggle-btn').classList.remove('disabled');
        updateBtn(betPlaced ? "بانتظار الانطلاق..." : "وضع رهان", betPlaced ? "btn-waiting" : "btn-bet");
    }

    function renderRace(m, e) {
        document.getElementById('main-timer').style.display = 'none';
        const d = document.getElementById('mult-display');
        d.style.display = 'block'; d.innerText = m.toFixed(2) + "x";
        document.getElementById('camel-wrap').style.left = Math.min(e * 4, 75) + "%";
        document.getElementById('auto-toggle-btn').classList.add('disabled');
        bgPos -= (2 + m); document.getElementById('track-box').style.backgroundPosition = bgPos + "px 0px";
        if (userInRace && !cashed) updateBtn("سحب الأرباح", "btn-cashout", (m * currentBet).toFixed(2));
    }

    function renderCrash(cp) {
        const d = document.getElementById('mult-display');
        d.innerText = cp.toFixed(2) + "x"; d.style.color = "var(--error)";
        document.getElementById('boom-fx').style.left = document.getElementById('camel-wrap').style.left;
        document.getElementById('boom-fx').style.display = "block";
        document.getElementById('camel-wrap').style.opacity = "0";
        updateBtn("انفجر الجمل!", "btn-waiting");
        userInRace = false; betPlaced = false;
    }

    function handleAction() {
        if (!user) return;
        if (currentGameState === "waiting") betPlaced = !betPlaced;
        else if (userInRace && !cashed) doCashout(parseFloat(document.getElementById('mult-display').innerText));
    }

    function joinRace() {
        currentBet = parseFloat(document.getElementById('bet-amount').value);
        if (user.balance >= currentBet) {
            userInRace = true; cashed = false; betPlaced = false;
            user.balance -= currentBet; updateUI(); saveBalance();
        }
    }

    function doCashout(m) {
        if (cashed || !userInRace) return;
        cashed = true; user.balance += (currentBet * m);
        updateUI(); saveBalance(); updateBtn("تم السحب ✅", "btn-waiting");
    }

    function resetVisuals() {
        document.getElementById('camel-wrap').style.left = "0%";
        document.getElementById('camel-wrap').style.opacity = "1";
        document.getElementById('boom-fx').style.display = "none";
        document.getElementById('mult-display').style.color = "var(--accent)";
    }

    async function syncHistory() {
        const { data } = await supabaseClient.from('GameHistory').select('crash_point').order('created_at', { ascending: false }).limit(8);
        if (data) document.getElementById('history-list').innerHTML = data.map(r => `<div class="history-item">${r.crash_point.toFixed(2)}x</div>`).join('');
    }

    function updateUI() { if (user) { document.getElementById('balance').innerText = user.balance.toFixed(2); document.getElementById('player-display').innerText = user.username; } }
    function updateBtn(t, c, s="") { const b = document.getElementById('action-btn'); b.className = `main-btn ${c}`; b.innerHTML = s ? `${t}<br><small>💰 ${s}</small>` : t; }
    async function saveBalance() { if (user) await supabaseClient.from('Profiles').update({ balance: user.balance }).eq('id', user.id); }
    async function saveRoundToDB(val) { try { await supabaseClient.rpc('add_crash_record', { crash_val: parseFloat(val) }); } catch(e){} }
    function logout() { localStorage.removeItem('camel_session'); location.reload(); }
    function switchAuth(m) { window.authMode = m; }
    async function processAuth() {
        const u = document.getElementById('username').value, p = document.getElementById('password').value;
        const { data, error } = await supabaseClient.auth[window.authMode === 'signup' ? 'signUp' : 'signInWithPassword']({ email: `${u}@game.com`, password: p });
        if (error) alert("خطأ"); else {
            const { data: profile } = await supabaseClient.from('Profiles').select('*').eq('id', data.user.id).single();
            if (profile) launch(profile);
        }
    }

    globalEngine();
    checkSavedSession();
</script>
</body>
</html>
