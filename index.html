<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن | السحب التلقائي</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 420px; background: var(--card); padding: 20px; border-radius: 30px; border: 1px solid #2d333b; position: relative; transition: all 0.2s; }
        
        .shake-screen { animation: shake 0.4s both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .balance-box { background: rgba(255, 204, 0, 0.15); padding: 8px 15px; border-radius: 12px; border: 1px solid var(--gold); color: var(--gold); font-weight: 900; transition: 0.3s; }
        .win-flash { transform: scale(1.1); box-shadow: 0 0 20px var(--accent); border-color: var(--accent); }

        #main-timer { font-size: 80px; font-weight: 900; color: var(--gold); text-align: center; }
        .multiplier { font-size: 70px; font-weight: 900; color: var(--accent); display: none; text-align: center; }
        
        .track { 
            height: 130px; background: #12191f; border-radius: 20px; position: relative; overflow: hidden; 
            border: 2px solid #2d333b; margin: 15px 0;
            background-image: linear-gradient(90deg, #1c262d 1px, transparent 1px);
            background-size: 50px 100%;
        }

        .camel-box { position: absolute; bottom: 10px; left: 0; transition: left 0.1s linear; z-index: 5; }
        .camel-gif { width: 85px; height: auto; transform: scaleX(-1); transition: opacity 0.2s; }
        
        .boom { 
            position: absolute; width: 80px; height: 80px; background: radial-gradient(circle, #ffcc00, #ff4b4b, transparent); 
            border-radius: 50%; display: none; z-index: 10; animation: fire 0.4s forwards;
        }
        @keyframes fire { 0% { transform: scale(0.1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

        .controls { background: #0d1117; padding: 15px; border-radius: 22px; display: flex; flex-direction: column; gap: 10px; }
        .input-group { display: flex; gap: 10px; }
        .input-box { flex: 1; }
        .input-box label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; margin-right: 5px; }
        
        input.field { width: 100%; background: #1c262d; border: 1px solid #333; color: white; padding: 12px; border-radius: 12px; text-align: center; font-weight: bold; }
        
        button.main-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cashout { background: var(--error); color: white; }
        .btn-off { background: #222; color: #555; cursor: not-allowed; }

        .history-bar { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; flex-direction: row-reverse; }
        .history-tag { min-width: 65px; padding: 6px; border-radius: 8px; background: #12191f; color: var(--accent); border: 1px solid rgba(0,255,136,0.1); text-align: center; font-size: 12px; font-weight: bold; }
        .crash-tag { color: var(--error); border-color: var(--error); }
    </style>
</head>
<body>

<div class="app-container" id="stage">
    <div class="header">
        <span style="opacity: 0.6;">لاعب: <span id="u-name">Admin</span></span>
        <div id="bal-card" class="balance-box">💰 <span id="balance">100.00</span></div>
    </div>

    <div id="main-timer">5</div>
    <div id="mult-text" class="multiplier">1.00x</div>
    
    <div class="track" id="track-ui">
        <div id="camel-move" class="camel-box">
            <img class="camel-gif" id="c-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3N2cWlxbm12dzR2ZzRxdjR2ZzRxdjR2ZzRxdjR2ZzRxdjR2ZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/jR7kYj3n8HkU4/giphy.gif">
        </div>
        <div id="exp" class="boom"></div>
    </div>

    <div class="controls">
        <div class="input-group">
            <div class="input-box">
                <label>مبلغ الرهان</label>
                <input type="number" id="bet-val" class="field" value="10">
            </div>
            <div class="input-box">
                <label>سحب تلقائي</label>
                <input type="number" id="auto-val" class="field" value="2.00" step="0.01">
            </div>
        </div>
        <button id="btn-action" class="main-btn btn-bet" onclick="doAction()">وضع رهان</button>
    </div>

    <div id="history-ui" class="history-bar"></div>
</div>

<script>
    let bal = 100.00, betActive = false, inRace = false, isCashed = false, currentBet = 0, bgX = 0;
    const WAIT_TIME = 5; 
    const GAME_CYCLE = 25; 

    function runGame() {
        setInterval(() => {
            const now = Date.now() / 1000, pos = now % GAME_CYCLE, rId = Math.floor(now / GAME_CYCLE);
            const crashPoint = calculateCrash(rId);

            if (pos < WAIT_TIME) {
                renderWaiting(Math.ceil(WAIT_TIME - pos));
                window.logFlag = false;
            } else {
                const elapsed = pos - WAIT_TIME, m = Math.pow(1.12, elapsed);
                if (m >= crashPoint) {
                    renderBoom(crashPoint);
                    if (!window.logFlag) { pushHistory(crashPoint.toFixed(2)); window.logFlag = true; }
                } else {
                    renderRacing(m, elapsed);
                    checkAutoCashout(m); // فحص السحب التلقائي
                    if (betActive && !inRace) startBet();
                }
            }
        }, 50);
    }

    function calculateCrash(seed) {
        let r = Math.abs(Math.sin(seed * 43758.5453123) * 10000) % 1;
        let val = 0.99 / (1 - r); 
        return Math.min(Math.max(val, 1.00), 700.00);
    }

    function renderWaiting(s) {
        document.getElementById('main-timer').style.display = 'block';
        document.getElementById('mult-text').style.display = 'none';
        document.getElementById('main-timer').innerText = s;
        document.getElementById('camel-move').style.left = "0%";
        document.getElementById('c-img').style.opacity = "1";
        document.getElementById('exp').style.display = "none";
        if (!inRace) setBtn(betActive ? "تم التجهيز" : "وضع رهان", betActive ? "btn-off" : "btn-bet");
    }

    function renderRacing(m, e) {
        document.getElementById('main-timer').style.display = 'none';
        const txt = document.getElementById('mult-text');
        txt.style.display = 'block'; txt.innerText = m.toFixed(2) + "x"; txt.style.color = "var(--accent)";
        document.getElementById('camel-move').style.left = Math.min(e * 8, 75) + "%";
        bgX -= (3 + m);
        document.getElementById('track-ui').style.backgroundPosition = bgX + "px 0px";
        if (inRace && !isCashed) setBtn("سحب الأرباح", "btn-cashout", (m * currentBet).toFixed(2));
    }

    function checkAutoCashout(currentMult) {
        if (inRace && !isCashed) {
            const autoVal = parseFloat(document.getElementById('auto-val').value);
            if (autoVal > 1.01 && currentMult >= autoVal) {
                triggerCashout(autoVal);
            }
        }
    }

    function renderBoom(cp) {
        const txt = document.getElementById('mult-text'); 
        txt.innerText = cp.toFixed(2) + "x"; txt.style.color = "var(--error)";
        const img = document.getElementById('c-img');
        const explosion = document.getElementById('exp');
        if (img.style.opacity !== "0") {
            img.style.opacity = "0";
            explosion.style.left = document.getElementById('camel-move').style.left;
            explosion.style.display = "block";
            document.getElementById('stage').classList.add('shake-screen');
            setTimeout(() => document.getElementById('stage').classList.remove('shake-screen'), 400);
        }
        setBtn("طحن الجمل!", "btn-off");
        inRace = false; betActive = false;
    }

    function doAction() {
        const pos = (Date.now() / 1000) % GAME_CYCLE;
        if (pos < WAIT_TIME) {
            betActive = !betActive;
        } else if (inRace && !isCashed) {
            const m = parseFloat(document.getElementById('mult-text').innerText);
            triggerCashout(m);
        }
    }

    function triggerCashout(multiplier) {
        isCashed = true; 
        bal += (currentBet * multiplier);
        document.getElementById('bal-card').classList.add('win-flash');
        setTimeout(() => document.getElementById('bal-card').classList.remove('win-flash'), 600);
        updateBalanceUI();
        setBtn("تم السحب ✅", "btn-off");
    }

    function startBet() {
        currentBet = parseFloat(document.getElementById('bet-val').value);
        if (bal >= currentBet) {
            inRace = true; isCashed = false; betActive = false;
            bal -= currentBet; updateBalanceUI();
        }
    }

    function pushHistory(v) {
        const h = document.getElementById('history-ui');
        const tag = document.createElement('div');
        tag.className = `history-tag ${v < 2 ? 'crash-tag' : ''}`;
        tag.innerText = v + 'x';
        h.insertBefore(tag, h.firstChild);
        if (h.children.length > 8) h.removeChild(h.lastChild);
    }

    function updateBalanceUI() { document.getElementById('balance').innerText = bal.toFixed(2); }

    function setBtn(t, c, s="") {
        const b = document.getElementById('btn-action'); b.className = `main-btn ${c}`;
        b.innerHTML = s ? `<span>${t}</span><br><small>💰 ${s}</small>` : t;
    }

    runGame();
</script>
</body>
</html>
