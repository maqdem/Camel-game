<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن | نظام الحسابات الآمن</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; --text: #e1e1e1; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px 0; }
        .app-container { width: 95%; max-width: 420px; background: var(--card); padding: 25px; border-radius: 30px; border: 1px solid #2d333b; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .field-small { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #333; background: #12191f; color: white; text-align: center; font-weight: bold; outline: none; margin-bottom: 10px; }
        button.main-btn { width: 100%; padding: 18px; border-radius: 16px; border: none; font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .btn-bet { background: var(--accent); color: #000; }
        .auth-toggle { text-align: center; margin-top: 15px; color: var(--accent); cursor: pointer; font-size: 13px; text-decoration: underline; }
        /* تنسيقات اللعبة السابقة تبقى كما هي */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .balance-box { background: rgba(255, 204, 0, 0.15); padding: 10px 18px; border-radius: 14px; border: 1px solid var(--gold); color: var(--gold); font-weight: 900; }
        #main-timer { font-size: 80px; font-weight: 900; color: var(--gold); text-align: center; }
        .multiplier { font-size: 80px; font-weight: 900; color: var(--accent); display: none; text-align: center; }
        .track { height: 140px; background: #12191f; border-radius: 20px; position: relative; overflow: hidden; border: 2px solid #2d333b; margin: 15px 0; }
        .camel-wrapper { position: absolute; bottom: 15px; left: 0; transition: left 0.1s linear; }
        .camel { font-size: 55px; transform: scaleX(-1); }
        .controls { background: #0d1117; padding: 20px; border-radius: 22px; display: flex; flex-direction: column; gap: 12px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="auth-screen">
        <h2 id="auth-title" style="text-align:center; color:var(--accent);">دخول اللاعب</h2>
        
        <div id="register-fields" style="display:none;">
            <input type="text" id="full-name" class="field-small" placeholder="الاسم الكامل">
        </div>
        
        <input type="text" id="auth-username" class="field-small" placeholder="اسم المستخدم (Username)">
        <input type="password" id="auth-password" class="field-small" placeholder="كلمة المرور">
        
        <button id="auth-submit" class="main-btn btn-bet" onclick="handleAuth()">دخول</button>
        <p class="auth-toggle" onclick="toggleAuthMode()" id="auth-mode-text">ليس لديك حساب؟ سجل الآن</p>
    </div>

    <div id="game-screen" style="display:none;">
        <div class="header">
            <span id="player-display" style="opacity: 0.7;">---</span>
            <div class="balance-box">💰 <span id="balance">0.00</span></div>
        </div>
        <div id="main-timer">5</div>
        <div id="mult-display" class="multiplier">1.00x</div>
        <div class="track"><div id="camel-wrap" class="camel-wrapper"><div class="camel">🐪</div></div></div>
        <div class="controls">
            <input type="number" id="bet-amount" class="field-small" value="10">
            <button id="action-btn" class="main-btn btn-bet" onclick="handleAction()">وضع رهان</button>
        </div>
    </div>
</div>

<script>
    const CONF = { URL: 'https://uqmfwgdrlcqywxvdljlb.supabase.co', KEY: 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT' };
    const supabaseClient = supabase.createClient(CONF.URL, CONF.KEY);

    let userProfile = null;
    let isRegisterMode = false;

    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        document.getElementById('auth-title').innerText = isRegisterMode ? "إنشاء حساب جديد" : "دخول اللاعب";
        document.getElementById('auth-submit').innerText = isRegisterMode ? "تسجيل" : "دخول";
        document.getElementById('register-fields').style.display = isRegisterMode ? "block" : "none";
        document.getElementById('auth-mode-text').innerText = isRegisterMode ? "لديك حساب؟ سجل دخولك" : "ليس لديك حساب؟ سجل الآن";
    }

    async function handleAuth() {
        const username = document.getElementById('auth-username').value;
        const password = document.getElementById('auth-password').value;
        const fullName = document.getElementById('full-name').value;

        // ملاحظة: Supabase يتطلب إيميل للتسجيل التقليدي، سنستخدم "username@game.com" كخدعة برمجية
        const fakeEmail = `${username}@game.com`;

        if (isRegisterMode) {
            // تسجيل حساب جديد
            const { data, error } = await supabaseClient.auth.signUp({
                email: fakeEmail,
                password: password,
                options: { data: { username: username, full_name: fullName } }
            });
            if (error) return alert("خطأ في التسجيل: " + error.message);
            alert("تم التسجيل بنجاح! يمكنك الدخول الآن.");
            toggleAuthMode();
        } else {
            // تسجيل دخول
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: fakeEmail,
                password: password
            });
            if (error) return alert("خطأ في الدخول: " + error.message);
            
            // جلب البروفايل
            const { data: profile } = await supabaseClient.from('Profiles').select('*').eq('id', data.user.id).single();
            userProfile = profile;
            launchGame();
        }
    }

    function launchGame() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('player-display').innerText = userProfile.username;
        document.getElementById('balance').innerText = userProfile.balance.toFixed(2);
        // ابدأ حلقات اللعبة (Loop) هنا كما في الكود السابق
    }

    // ملاحظة: يجب أن تكون قد فعلت الـ SQL Trigger الذي يربط بين Auth و Profiles
</script>
</body>
</html>
