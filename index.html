<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الهجن العالمي - موحد 24/7</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b141a; --card: #1c262d; --accent: #00ff88; --error: #ff4b4b; --gold: #ffcc00; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 95%; max-width: 420px; background: var(--card); padding: 20px; border-radius: 24px; border: 1px solid #2d333b; text-align: center; }
        .multiplier { font-size: 65px; font-weight: 900; color: var(--accent); margin: 15px 0; }
        #game-status { color: var(--gold); font-size: 18px; margin-bottom: 10px; font-weight: bold; }
        .track { height: 100px; background: #12191f; border-radius: 18px; position: relative; overflow: hidden; border: 2px solid #2d333b; margin: 15px 0; }
        .camel { position: absolute; bottom: 10px; left: 0; font-size: 50px; transition: left 0.1s linear; }
        .controls { background: #0d1117; padding: 15px; border-radius: 18px; }
        button { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 20px; font-weight: 900; cursor: pointer; }
        .btn-bet { background: var(--accent); color: #000; }
        .btn-cashout { background: var(--error); color: white; }
        .btn-waiting { background: #222; color: #555; cursor: not-allowed; }
        .history-list { display: flex; gap: 8px; overflow-x: auto; margin-top: 15px; justify-content: center; }
        .history-item { padding: 4px 10px; border-radius: 6px; font-size: 12px; background: #12191f; border: 1px solid #333; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="auth-screen">
        <h2>الدخول للسباق العالمي 🌍</h2>
        <input type="text" id="username" style="width:80%; padding:10px; margin-bottom:10px;" placeholder="اسم المستخدم"><br>
        <button class="btn-bet" onclick="handleLogin()">دخول</button>
    </div>

    <div id="game-screen" style="display:none;">
        <div id="game-status">بانتظار الجولة القادمة...</div>
        <div id="mult-display" class="multiplier">1.00x</div>
        <div class="track"><div id="camel" class="camel">🐪</div></div>
        <div class="controls">
            <div id="balance-display" style="margin-bottom:10px;">💰 0.00</div>
            <input type="number" id="bet-amount" style="width:100%; padding:10px; background:#1c262d; color:white; border:1px solid #333; border-radius:8px;" value="10">
            <button id="action-btn" class="btn-bet" onclick="handleAction()">رهان</button>
        </div>
        <div id="history-list" class="history-list"></div>
    </div>
</div>

<script>
    const CONF = { URL: 'https://uqmfwgdrlcqywxvdljlb.supabase.co', KEY: 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT' };
    const supabaseClient = supabase.createClient(CONF.URL, CONF.KEY);

    let user = null, betPlaced = false, userInBet = false, hasCashedOut = false;
    let currentCycleTime = 0, crashPoint = 0, isRunning = false;

    // إعدادات الدورة (ثابتة عند الجميع)
    const WAIT_TIME = 8; // 8 ثواني مراهنة
    const CYCLE_DURATION = 30; // جولة كل 30 ثانية

    async function handleLogin() {
        const u = document.getElementById('username').value;
        const { data } = await supabaseClient.from('Profiles').select('*').eq('username', u).maybeSingle();
        if (data) {
            user = data;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            updateUI();
            startGlobalSync();
        }
    }

    function updateUI() {
        document.getElementById('balance-display').innerText = "💰 " + parseFloat(user.balance).toFixed(2);
    }

    // هذه هي الدالة الأهم التي تربط الجميع بنفس اللحظة
    function startGlobalSync() {
        setInterval(() => {
            const now = Date.now() / 1000;
            const cyclePos = now % CYCLE_DURATION; // مكاننا الحالي في الدورة العالمية (من 0 لـ 30)
            
            // توليد نفس رقم التحطم لكل الناس بناءً على "بداية الدورة"
            const cycleId = Math.floor(now / CYCLE_DURATION);
            crashPoint = generateCrashPoint(cycleId);

            if (cyclePos < WAIT_TIME) {
                // مرحلة المراهنة
                runWaitingPhase(WAIT_TIME - cyclePos);
            } else {
                // مرحلة السباق
                runRacingPhase(cyclePos - WAIT_TIME);
            }
        }, 100); // تحديث سريع جداً لضمان المزامنة
    }

    // معادلة رياضية تعطي نفس الرقم لكل من يدخل نفس الـ cycleId
    function generateCrashPoint(seed) {
        const x = Math.sin(seed) * 10000;
        const rand = x - Math.floor(x);
        // جعل الأرقام منطقية (أغلبها بين 1 و 3 وقليل منها عالي)
        return parseFloat((1 / (1 - rand * 0.95)).toFixed(2));
    }

    function runWaitingPhase(timeLeft) {
        isRunning = false;
        hasCashedOut = false;
        document.getElementById('game-status').innerText = `تبدأ الجولة خلال: ${timeLeft.toFixed(1)}s`;
        document.getElementById('mult-display').innerText = "1.00x";
        document.getElementById('camel').style.left = "0%";
        
        if (!betPlaced) {
            updateButton("رهان الآن", "btn-bet");
        } else {
            updateButton("تم حجز الرهان", "btn-waiting");
        }
    }

    function runRacingPhase(elapsed) {
        isRunning = true;
        // حساب المضاعف الحالي بناءً على الوقت المنقضي عالمياً
        const multiplier = Math.pow(Math.E, 0.08 * elapsed);
        
        if (multiplier >= crashPoint) {
            // حالة الانفجار
            gameCrash();
        } else {
            // حالة السباق الجاري
            document.getElementById('game-status').innerText = "السباق جارٍ...";
            document.getElementById('mult-display').innerText = multiplier.toFixed(2) + "x";
            document.getElementById('camel').style.left = Math.min((multiplier - 1) * 20, 88) + "%";

            if (betPlaced && !userInBet) { // لحظة انتقال الرهان للعمل
                userInBet = true;
                betPlaced = false;
                user.balance -= parseFloat(document.getElementById('bet-amount').value);
                updateUI();
            }

            if (userInBet && !hasCashedOut) {
                const win = (parseFloat(document.getElementById('bet-amount').value) * multiplier).toFixed(2);
                updateButton(`سحب الأرباح (${win})`, "btn-cashout");
            } else if (!userInBet && !hasCashedOut) {
                updateButton("الجولة بدأت (انتظر)", "btn-waiting");
            }
        }
    }

    function handleAction() {
        if (!isRunning && !betPlaced) {
            betPlaced = true;
        } else if (isRunning && userInBet && !hasCashedOut) {
            cashOut();
        }
    }

    function cashOut() {
        hasCashedOut = true;
        const mult = parseFloat(document.getElementById('mult-display').innerText);
        const win = parseFloat(document.getElementById('bet-amount').value) * mult;
        user.balance += win;
        userInBet = false;
        updateUI();
        updateDB();
        updateButton("تم السحب بنجاح", "btn-waiting");
    }

    function gameCrash() {
        document.getElementById('game-status').innerText = "💥 انفجر!";
        document.getElementById('mult-display').innerText = crashPoint.toFixed(2) + "x";
        userInBet = false;
        betPlaced = false;
        updateButton("انتهت الجولة", "btn-waiting");
    }

    function updateButton(text, cls) {
        const btn = document.getElementById('action-btn');
        btn.innerText = text;
        btn.className = cls;
    }

    async function updateDB() {
        await supabaseClient.from('Profiles').update({ balance: user.balance }).eq('id', user.id);
    }
</script>
</body>
</html>
