<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Ahoul - SVG Edition</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --green: #22c55e; --red: #ef4444; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; }
        .main-container { max-width: 450px; margin: auto; background: var(--card); border-radius: 20px; overflow: hidden; }
        
        /* منطقة السباق */
        .race-track { 
            height: 250px; background: linear-gradient(to bottom, #020617, #1e293b); 
            position: relative; overflow: hidden; border-bottom: 4px solid #f59e0b;
        }

        /* الجمل SVG */
        .camel-actor {
            position: absolute; left: 10%; bottom: 20px; width: 100px;
            transition: left 0.1s linear; transform: scaleX(-1);
        }

        /* أنيميشن الركض */
        .running .leg { animation: moveLeg 0.2s infinite alternate; transform-origin: top; }
        @keyframes moveLeg { from { transform: rotate(-20deg); } to { transform: rotate(20deg); } }
        
        #multiplier { 
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            font-size: 50px; font-weight: bold; color: var(--green);
        }

        .controls { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        input { background: #111827; border: 1px solid #334155; color: white; padding: 12px; border-radius: 10px; text-align: center; width: 100%; box-sizing: border-box; }
        button { grid-column: span 2; padding: 15px; border-radius: 10px; border: none; font-weight: bold; font-size: 18px; cursor: pointer; }
        .btn-run { background: var(--green); color: white; }
        .btn-cash { background: var(--red); color: white; }
    </style>
</head>
<body>

<div id="login-ui" style="text-align:center; padding-top:100px;">
    <input type="text" id="u" placeholder="اسم المستخدم" style="max-width:300px; margin-bottom:10px;"><br>
    <input type="password" id="p" placeholder="كلمة السر" style="max-width:300px;"><br>
    <button onclick="login()" class="btn-run" style="max-width:300px; margin-top:10px;">دخول</button>
</div>

<div id="game-ui" class="main-container" style="display:none;">
    <div style="padding:15px; display:flex; justify-content:space-between;">
        <span style="color:#fbbf24">💰 <span id="bal">0</span></span>
        <span id="user-display"></span>
    </div>

    <div class="race-track">
        <div id="multiplier">1.00x</div>
        <div id="camel-div" class="camel-actor">
            <svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
                <path class="leg" d="M30 50 L25 75" stroke="#d97706" stroke-width="6"/>
                <path class="leg" d="M45 50 L50 75" stroke="#d97706" stroke-width="6" style="animation-delay:0.1s"/>
                <path d="M15 50 Q 40 10 65 50 L 85 50 Q 95 50 90 30" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
                <circle cx="90" cy="30" r="7" fill="#f59e0b"/>
                <circle cx="92" cy="28" r="1.5" fill="black"/>
                <path class="leg" d="M65 55 L60 78" stroke="#d97706" stroke-width="6"/>
                <path class="leg" d="M75 55 L80 78" stroke="#d97706" stroke-width="6" style="animation-delay:0.1s"/>
            </svg>
        </div>
    </div>

    <div class="controls">
        <input type="number" id="bet-amt" value="10">
        <input type="number" id="guess-amt" value="2.0">
        <button id="main-btn" onclick="handleGame()" class="btn-run">Run</button>
    </div>
</div>

<script>
    const S_URL = 'https://uqmfwgdrlcqywxvdljlb.supabase.co';
    const S_KEY = 'sb_publishable_I5yn0tVPmbK6XczHoiQS-g_fct3pACT';
    const _s = supabase.createClient(S_URL, S_KEY);

    let bal, user, gameInt, mult = 1.0;

    async function login() {
        const u = document.getElementById('u').value, p = document.getElementById('p').value;
        try {
            const { data, error } = await _s.from('Profiles').select('*').eq('username', u).eq('password', p).single();
            if (data) {
                user = data.username; bal = data.balance;
                document.getElementById('login-ui').style.display = 'none';
                document.getElementById('game-ui').style.display = 'block';
                updateUI();
            } else { alert("بيانات خاطئة"); }
        } catch(e) { alert("فشل في الاتصال"); }
    }

    function updateUI() {
        document.getElementById('bal').innerText = Math.floor(bal);
        document.getElementById('user-display').innerText = user;
    }

    function handleGame() {
        const btn = document.getElementById('main-btn');
        if (btn.innerText === "Run") start(); else cash();
    }

    function start() {
        let b = parseFloat(document.getElementById('bet-amt').value);
        if (b > bal) return alert("رصيد منخفض");
        bal -= b; updateUI();
        
        mult = 1.0;
        let crashPt = (Math.random() * 5 + 1.1).toFixed(2);
        const btn = document.getElementById('main-btn');
        const camel = document.getElementById('camel-div');

        btn.innerText = "Cash Out";
        btn.className = "btn-cash";
        camel.classList.add('running');

        gameInt = setInterval(() => {
            mult = parseFloat((mult + 0.05).toFixed(2));
            document.getElementById('multiplier').innerText = mult + "x";
            camel.style.left = Math.min(10 + (mult * 10), 80) + "%";
            if (mult >= crashPt) stop(false);
        }, 100);
    }

    async function cash() {
        clearInterval(gameInt);
        let win = mult * parseFloat(document.getElementById('bet-amt').value);
        bal += win; updateUI();
        await _s.from('Profiles').update({ balance: Math.floor(bal) }).eq('username', user);
        stop(true);
    }

    function stop(win) {
        clearInterval(gameInt);
        const camel = document.getElementById('camel-div');
        const btn = document.getElementById('main-btn');
        camel.classList.remove('running');
        if(!win) document.getElementById('multiplier').style.color = "var(--red)";
        btn.disabled = true;
        setTimeout(() => {
            btn.disabled = false;
            btn.innerText = "Run";
            btn.className = "btn-run";
            document.getElementById('multiplier').style.color = "var(--green)";
            camel.style.left = "10%";
        }, 2000);
    }
</script>
</body>
</html>
