<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سباق الجمال الذكي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <style>
        body { background: #f4e4bc; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; color: #333; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        input { width: 85%; padding: 15px; margin: 10px 0; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; }
        button { width: 90%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #218838; transform: scale(1.02); }
        #game-screen { display: none; }
        #multiplier { font-size: 60px; color: #d9534f; margin: 30px 0; font-weight: 900; }
        .info-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; }
        #status { margin-top: 15px; font-weight: bold; color: #555; }
    </style>
</head>
<body>

    <div id="login-screen" class="card">
        <h2 style="color: #8b4513;">🐪 سباق الجمال</h2>
        <p>أدخل بيانات الحساب المشحون للبدء</p>
        <input type="text" id="user-input" placeholder="اسم المستخدم">
        <input type="password" id="pass-input" placeholder="كلمة السر">
        <button onclick="login()">دخول ومزامنة الرصيد</button>
        <p id="login-error" style="color:red; margin-top:10px;"></p>
    </div>

    <div id="game-screen">
        <div id="multiplier">1.00x</div>
        <div class="card">
            <div class="info-bar">
                <span>👤 <span id="display-name">---</span></span>
                <span>💰 <span id="balance">0</span></span>
            </div>
            <p>حدد مبلغ الرهان:</p>
            <input type="number" id="bet-amount" value="10" min="1">
            <button id="btn-bet" onclick="startRace()">وضع الرهان</button>
            <button id="btn-cashout" onclick="cashOut()" style="display:none; background:#ffc107; color:#333;">جني الأرباح</button>
            <div id="status">جاهز للسباق...</div>
        </div>
    </div>

    <script>
        // ضع بيانات Supabase الخاصة بك هنا من صورتك رقم 1000009779
        const SB_URL = "رابط_مشروعك_هنا"; 
        const SB_KEY = "مفتاح_API_الخاص_بك";
        const supabase = supabase.createClient(SB_URL, SB_KEY);

        let user = null;
        let currentMult = 1.00;
        let raceInterval;
        let isRacing = false;

        async function login() {
            const u = document.getElementById('user-input').value;
            const p = document.getElementById('pass-input').value;

            const { data, error } = await supabase
                .from('Profiles')
                .select('*')
                .eq('Username', u)
                .eq('password', p)
                .single();

            if (data) {
                user = data;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
                document.getElementById('display-name').innerText = user.Username;
                document.getElementById('balance').innerText = user.Balance;
            } else {
                document.getElementById('login-error').innerText = "بيانات خاطئة، تواصل مع الوكيل للشحن.";
            }
        }

        async function startRace() {
            const amount = parseInt(document.getElementById('bet-amount').value);
            if (amount > user.Balance || amount <= 0) return alert("رصيد غير كافٍ!");

            isRacing = true;
            user.Balance -= amount;
            document.getElementById('balance').innerText = user.Balance;
            
            // تحديث الرصيد في القاعدة فوراً
            await supabase.from('Profiles').update({ Balance: user.Balance }).eq('id', user.id);
            // إضافة الربح لك كمدير في جدول Admin_states
            await supabase.rpc('increment_admin_profit', { amount_to_add: amount });

            document.getElementById('btn-bet').style.display = 'none';
            document.getElementById('btn-cashout').style.display = 'block';
            
            currentMult = 1.00;
            const crashPoint = (Math.random() * 5 + 1).toFixed(2); 

            raceInterval = setInterval(() => {
                currentMult += 0.01;
                document.getElementById('multiplier').innerText = currentMult.toFixed(2) + "x";
                document.getElementById('multiplier').style.color = "#28a745";

                if (currentMult >= crashPoint) {
                    endRace(false);
                }
            }, 100);
        }

        async function cashOut() {
            if (!isRacing) return;
            const winnings = Math.floor(parseInt(document.getElementById('bet-amount').value) * currentMult);
            user.Balance += winnings;
            endRace(true, winnings);
        }

        async function endRace(isWin, winAmount = 0) {
            clearInterval(raceInterval);
            isRacing = false;
            document.getElementById('btn-bet').style.display = 'block';
            document.getElementById('btn-cashout').style.display = 'none';

            if (isWin) {
                document.getElementById('status').innerText = `مبروك! ربحت ${winAmount}`;
                document.getElementById('balance').innerText = user.Balance;
                await supabase.from('Profiles').update({ Balance: user.Balance }).eq('id', user.id);
            } else {
                document.getElementById('multiplier').style.color = "red";
                document.getElementById('status').innerText = "تحطم الجمل! خسر الرهان.";
            }
        }
    </script>
</body>
</html>
